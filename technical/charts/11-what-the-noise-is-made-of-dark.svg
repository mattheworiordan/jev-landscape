<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 525" width="640" height="525" role="img" aria-labeledby="11-wdark-t 11-wdark-d" font-family="Manrope, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="11-wdark-t">About a fifth of posts are meta, and memes and hot takes are under half a percent each</title><desc id="11-wdark-d">1,265 noise posts by sub-type. Audited: meta 21% (19 to 22) of all posts. Unrelated or unclear: 523 posts (41.3%), 33.1% of the noise's views. Benchmarks of the model: 360 posts (28.5%), 33.0% of the noise's views. Tooling or wrappers: 245 posts (19.4%), 19.6% of the noise's views. Explainers or tutorials: 59 posts (4.7%), 1.7% of the noise's views. News or reposts: 45 posts (3.6%), 10.6% of the noise's views. Hot takes: 18 posts (1.4%), 1.9% of the noise's views. Memes or jokes: 15 posts (1.2%), 0.1% of the noise's views.</desc><rect x="0" y="0" width="640" height="525" fill="#1a1a19"/><text x="24" y="44" font-size="20" font-weight="700" fill="#ffffff">About a fifth of posts are meta, and memes and hot takes</text><text x="24" y="69" font-size="20" font-weight="700" fill="#ffffff">are under half a percent each</text><text x="24" y="91" font-size="13" fill="#c3c2b7">1,265 noise posts by sub-type. Audited: meta 21% (19 to 22) of all posts.</text><line x1="196" y1="136" x2="196" y2="401" stroke-width="1" stroke="#4a4a46"/><text x="196" y="416" font-size="11" fill="#c3c2b7">0%</text><line x1="348" y1="136" x2="348" y2="401" stroke-width="1" stroke="#2c2c2a"/><text x="348" y="416" font-size="11" text-anchor="middle" fill="#c3c2b7">25%</text><line x1="500" y1="136" x2="500" y2="401" stroke-width="1" stroke="#2c2c2a"/><text x="500" y="416" font-size="11" text-anchor="middle" fill="#c3c2b7">50%</text><text x="348" y="432" font-size="11.5" text-anchor="middle" fill="#c3c2b7">Share of the noise</text><rect x="24" y="109.6" width="12" height="12" rx="2" fill="#3987e5"/><text x="44" y="120" font