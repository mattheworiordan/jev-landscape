<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 477" width="640" height="477" role="img" aria-labeledby="03-wdark-t 03-wdark-d" font-family="Manrope, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="03-wdark-t">About four in five posts compared Jev with nothing, and about 1 in 30 with what it would replace</title><desc id="03-wdark-d">5,595 posts. Audited: nothing 80% (77 to 82), the tools Jev would replace 3.7% (3 to 5). Nothing: 80.4%. Frontier LLM: 11.3%. Small LLM: 4.3%. Rules or regex: 2.5%. Classic classifier or ML: 1.1%. Vendor API: 0.6%. Audited: nothing 80% (77 to 82), frontier LLM 11.3% (10 to 13), small LLM 5.0% (4 to 7), the tools Jev would replace 3.7% (3 to 5).</desc><rect x="0" y="0" width="640" height="477" fill="#1a1a19"/><text x="24" y="44" font-size="20" font-weight="700" fill="#ffffff">About four in five posts compared Jev with nothing, and</text><text x="24" y="69" font-size="20" font-weight="700" fill="#ffffff">about 1 in 30 with what it would replace</text><text x="24" y="91" font-size="13" fill="#c3c2b7">5,595 posts. Audited: nothing 80% (77 to 82), the tools Jev would replace 3.7% (3 to 5).</text><line x1="196" y1="137.5" x2="196" y2="367.5" stroke-width="1" stroke="#4a4a46"/><text x="196" y="382.5" font-size="11" fill="#c3c2b7">0%</text><line x1="299" y1="137.5" x2="299" y2="367.5" stroke-width="1" stroke="#2c2c2a"/><text x="299" y="382.5" font-size="11" text-anchor="middle" fill="#c3c2b7">25%</text><line x1="402" y1="137.5" x2="402" y2="367.5" stroke-width="1" stroke="#2c2c2a"/><text x="402" y="382.5" font-size="11" text-anchor="middle" fill="#c3c2b7">50%</text><line x1="505" y1="137.5" x2="505" y2="367.5" stroke-width="1" stroke="#2c2c2a"/><text x="505" y="382.5" font-size="11" text-anchor="middle" fill="#c3c2b7">75%</text><line x1="608" y1="137.5" x2="608" y2="367.5" stroke-width="1" stroke="#2c2c2a"/><text x="608" y="382.5" font-size="11" text-anchor="end" fill="#c3c2b7">100%