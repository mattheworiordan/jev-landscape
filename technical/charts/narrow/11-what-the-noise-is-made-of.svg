<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 693" width="360" height="693" role="img" aria-labeledby="11-nauto-t 11-nauto-d" font-family="Manrope, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="11-nauto-t">About a fifth of posts are meta, and memes and hot takes are under half a percent each</title><desc id="11-nauto-d">1,265 noise posts by sub-type. Audited: meta 21% (19 to 22) of all posts. Unrelated or unclear: 523 posts (41.3%), 33.1% of the noise's views. Benchmarks of the model: 360 posts (28.5%), 33.0% of the noise's views. Tooling or wrappers: 245 posts (19.4%), 19.6% of the noise's views. Explainers or tutorials: 59 posts (4.7%), 1.7% of the noise's views. News or reposts: 45 posts (3.6%), 10.6% of the noise's views. Hot takes: 18 posts (1.4%), 1.9% of the noise's views. Memes or jokes: 15 posts (1.2%), 0.1% of the noise's views.</desc><style>svg{--v-surface:#fcfcfb;--v-ink:#0b0b0b;--v-ink2:#52514e;--v-muted:#6f6e69;--v-grid:#e6e5df;--v-axis:#b9b8ae;--v-accent:#eb6834;--v-blue:#2a78d6;--v-blueLo:#86b6ef;--v-blueHi:#104281;--v-g1:#dcdbd3;--v-g2:#bdbcb2;--v-g3:#8a8981;--v-seq0:#f0efec;--v-seq1:#b7d3f6;--v-seq2:#86b6ef;--v-seq3:#5598e7;--v-seq4:#2a78d6;--v-seq5:#1c5cab;--v-seq6:#104281;--v-sqt1:#0b0b0b;--v-sqt2:#0b0b0b;--v-sqt3:#0b0b0b;--v-sqt4:#ffffff;--v-sqt5:#ffffff;--v-sqt6:#ffffff}@media (prefers-color-scheme: dark){svg{--v-surface:#1a1a19;--v-ink:#ffffff;--v-ink2:#c3c2b7;--v-muted:#9d9b93;--v-grid:#2c2c2a;--v-axis:#4a4a46;--v-accent:#d95926;--v-blue:#3987e5;--v-blueLo:#1c5cab;--v-blueHi:#b7d3f6;--v-g1:#3a3a37;--v-g2:#5a5954;--v-g3:#8a8880;--v-seq0:#242423;--v-seq1:#104281;--v-seq2:#1c5cab;--v-seq3:#2a78d6;--v-seq4:#5598e7;--v-seq5:#86b6ef;--v-seq6:#b7d3f6;--v-sqt1:#ffffff;--v-sqt2:#ffffff;--v-sqt3:#ffffff;--v-sqt4:#0b0b0b;--v-sqt5:#0b0b0b;--v-sqt6:#0b0b0b}}</style><rect x="0" y="0" width="360" height="693" style="fill:var(--v-surface)"/><text x="16" y="33" font-size="17" font-weight="700" style="fill:var(--v-ink)">About a fifth of posts are meta, and</text><text x="16" y="54" font-size="17" font-weight="700" style="fill:var(--v-ink)">memes and hot takes are under half a</text><text x="16" y="75" font-size="17" font-weight="700" style="fill:var(--v-ink)">percent each</text><text x="16" y="97" font-size="13" style="fill:var(--v-ink2)">1,265 noise posts by sub-type. Audited: meta 21%</text><text x="16" y="115" font-size="13" style="fill:var(--v-ink2)">(19 to 22) of all posts.</text><line x1="16" y1="181" x2="16" y2="548" stroke-width="1" style="stroke:var(--v-axis)"/><text x="16" y="563" font-size="11" style="fill:var(--v-ink2)">0%</text><line x1="122" y1="181" x2="122" y2="548" stroke-width="1" style="stroke:var(--v-grid)"/><text x="122" y="563" font-size="11" text-anchor="middle" style="fill:var(--v-ink2)">25%</text><line x1="228" y1="181" x2="228" y2="548" stroke-width="1" style="stroke:var(--v-grid)"/><text x="228" y="563" font-size="11" text-anchor="middle" style="fill:var(--v-ink2)">50%</text><text x="122" y="579" font-size="11.5" text-anchor="middle" style="fill:var(--v-ink2)">Share of the noise</text><rect x="16" y="133.6" width="12" height="12" rx="2" style="fill:var(--v-blue)"/><text x="36" y="144" font-size="12" style="fill:var(--v-ink)">Share of the noise posts</text><rect x="16" y="154.6" width="12" height="12" rx="2" style="fill:var(--v-blueLo)"/><text x="36" y="165" font-size="12" style="fill:var(--v-ink)">Share of the noise views</text><text x="16" y="197" font-size="12" font-weight="600" style="fill:var(--v-ink)">Unrelated or unclear</text><path d="M16 203h171.3a4 4 0 0 1 4 4v7a4 4 0 0 1 -4 4h-171.3z" style="fill:var(--v-blue)"><title>Unrelated or unclear: 523 posts, 41.3% of the noise</title></path><path d="M16 220h137.3a3 3 0 0 1 3 3v2a3 3 0 0 1 -3 3h-137.3z" style="fill:var(--v-blueLo)"><title>Unrelated or unclear: 2,176,307 views, 33.1% of the noise's views</title></path><text x="198.3" y="215" font-size="12.5"><tspan font-weight="