<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 600" width="360" height="600" role="img" aria-labeledby="03-nlight-t 03-nlight-d" font-family="Manrope, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="03-nlight-t">About four in five posts compared Jev with nothing, and about 1 in 30 with what it would replace</title><desc id="03-nlight-d">5,595 posts. Audited: nothing 80% (77 to 82), the tools Jev would replace 3.7% (3 to 5). Nothing: 80.4%. Frontier LLM: 11.3%. Small LLM: 4.3%. Rules or regex: 2.5%. Classic classifier or ML: 1.1%. Vendor API: 0.6%. Audited: nothing 80% (77 to 82), frontier LLM 11.3% (10 to 13), small LLM 5.0% (4 to 7), the tools Jev would replace 3.7% (3 to 5).</desc><rect x="0" y="0" width="360" height="600" fill="#fcfcfb"/><text x="16" y="33" font-size="17" font-weight="700" fill="#0b0b0b">About four in five posts compared</text><text x="16" y="54" font-size="17" font-weight="700" fill="#0b0b0b">Jev with nothing, and about 1 in 30</text><text x="16" y="75" font-size="17" font-weight="700" fill="#0b0b0b">with what it would replace</text><text x="16" y="97" font-size="13" fill="#52514e">5,595 posts. Audited: nothing 80% (77 to 82), the</text><text x="16" y="115" font-size="13" fill="#52514e">tools Jev would replace 3.7% (3 to 5).</text><line x1="16" y1="161.5" x2="16" y2="469.5" stroke-width="1" stroke="#b9b8ae"/><text x="16" y="484.5" font-size="11" fill="#52514e">0%</text><line x1="96" y1="161.5" x2="96" y2="469.5" stroke-width="1" stroke="#e6e5df"/><text x="96" y="484.5" font-size="11" text-anchor="middle" fill="#52514e">25%</text><line x1="176" y1="161.5" x2="176" y2="469.5" stroke-width="1" stroke="#e6e5df"/><text x="176" y="484.5" font-size="11" text-anchor="middle" fill="#52514e">50%</text><line x1="256" y1="161.5" x2="256" y2="469.5" stroke-width="1" stroke="#e6e5df"/><text x="256" y="484.5" font-size="11" text-anchor="middle" fill="#52514e">75%</text><line x1="336" y1="161.5" x2="336" y2="469.5" stroke-width="1" stroke="#e6e5df"/><text x="336" y="484.5" font-size="11" text-anchor="end" fill="#52514e">100%</text><rect x="16" y="133.3" width="12" height="12" rx="2" fill="#bdbcb2"/><text x="36" y="143.5" font-size="11.5" fill="#0b0b0b">Opus's labels</text><path d="M133.7 133.3l6 6l-6 6l-6 -6z" fill="#0b0b0b"/><text x="147.7" y="143.5" font-size="11.5" fill="#0b0b0b">Audit estimate and 95% interval</text><text x="16" y="177.5" font-size="12" font-weight="600" fill="#0b0b0b">Nothing</text><path d="M16 183.5h253.3a4 4 0 0 1 4 4v10a4 4 0 0 1 -4 4h-253.3z" fill="#bdbcb2"><title>Nothing: 80.4% of posts (4,498), Opus's labels</title></path><text x="265.3" y="196.5" font-size="12.5" text-anchor="end"><tspan font-weight="700" fill="#0b0b0b">80.4%</tspan><tspan dx="6.7" font-size="11.5" fill="#52514e">4,498 posts</tspan></text><g><title>Nothing: audit 80.0% (95% interval 77.4% to 81.6%)</title><line x1="263.8" y1="208.5" x2="277.1" y2="208.5" stroke-width="1.5" stroke="#0b0b0b"/><line x1="263.8" y1="205" x2="263.8" y2="212" stroke-width="1.5" stroke="#0b0b0b"/><line x1="277.1" y1="205" x2="277.1" y2="212" stroke-width="1.5" stroke="#0b0b0b"/><path d="M271.9 203.5l5 5l-5 5l-5 -5z" stroke-width="1.2" fill="#0b0b0b" stroke="#fcfcfb"/></g><text x="255.8" y="212.5" font-size="11" text-anchor="end" fill="#52514e">audit 80% (77 to 82)</text><text x="16" y="229.5" font-size="12" font-weight="600" fill="#0b0b0b">Frontier LLM</text><path d="M16 235.5h32a4 4 0 0 1 4 4v10a4 4 0 0 1 -4 4h-32z" fill="#bdbcb2"><title>Frontier LLM: 11.3% of posts (630), Opus's labels</title></path><text x="59" y="248.5" font-size="12.5"><tspan font-weight="700" fill="#0b0b0b">11.3%</tspan><tspan dx="6.7" font-size="11.5" fill="#52514e">630 posts</tspan></text><g><title>Frontier LLM: audit 11.3% (95% interval 10.5% to 13.1%)</title><line x1="49.5" y1="260.5" x2="57.8" y2="260.5" stroke-width="1.5" stroke="#0b0b0b"/><line x1="49.5" y1="257" x2="49.5" y2="264" stroke-width="1.5" stroke="#0b0b0b"/><line x1="57.8" y1="257" x2="57.8" y2="264" stroke-width="1.5" stroke="#0b0b0b"/><path d="M52 255.5l5 5l-5 5l-5 -5z" stroke-width="1.2" fill="#0b0b0b" stroke="#fcfcfb"/></g><text x="65.8" y="264.5" font-size="11" fill="#52514e">audit 11.3% (10 to 13)</text><text x="16" y="281.5" font-size="12" font-weight="600" fill="#0b0b0b">Small LLM</text><path d="M16 287.5h9.7a4 4 0 0 1 4 4v10a4 4 0 0 1 -4 4h-9.7z" fill="#bdbcb2"><title>Small LLM: 4.3% of posts (239), Opus's labels</title></path><text x="36.7" y="300.5" font-size="12.5"><tspan font-weight="700" fill="#0b0b0b">4.3%</tspan><tspan dx="6.7" font-size="11.5" fill="#52514e">239 posts</tspan></text><g><title>Small LLM: audit 5.0% (95% interval 4.2% to 6.9%)</title><line x1="29.3" y1="312.5" x2="38.2" y2="312.5" stroke-width="1.5" stroke="#0b0b0b"/><line x1="29.3" y1="309" x2="29.3" y2="316" stroke-width="1.5" stroke="#0b0b0b"/><line x1="38.2" y1="309" x2="38.2" y2="316" stroke-width="1.5" stroke="#0b0b0b"/><path d="M32.1 307.5l5 5l-5 5l-5 -5z" stroke-width="1.2" fill="#0b0b0b" stroke="#fcfcfb"/></g><text x="46.2" y="316.5" font-size="11" fill="#52514e">audit 5.0% (4 to 7)</text><text x="16" y="333.5" font-size="12" font-weight="600" fill="#0b0b0b">Rules or regex</text><path d="M16 339.5h3.9a4 4 0 0 1 4 4v10a4 4 0 0 1 -4 4h-3.9z" fill="#2a78d6"><title>Rules or regex: 2.5% of posts (138), Opus's labels</title></path><text x="30.9" y="352.5" font-size="12.5"><tspan font-weight="700" fill="#0b0b0b">2.5%</tspan><tspan dx="6.7" font-size="11.5" fill="#52514e">138 posts</tspan></text><text x="16" y="385.5" font-size="12" font-weight="600" fill="#0b0b0b">Classic classifier or ML</text><path d="M16 391.5h0a3.4 3.4 0 0 1 3.4 3.4v11.3a3.4 3.4 0 0 1 -3.4 3.4h0z" fill="#2a78d6"><title>Classic classifier or ML: 1.1% of posts (59), Opus's labels</title></path><text x="26.4" y="404.5" font-size="12.5"><tspan font-weight="700" fill="#0b0b0b">1.1%</tspan><tspan dx="6.7" font-size="11.5" fill="#52514e">59 posts</tspan></text><text x="16" y="437.5" font-size="12" font-weight="600" fill="#0b0b0b">Vendor API</text><path d="M16 443.5h0a1.8 1.8 0 0 1 1.8 1.8v14.5a1.8 1.8 0 0 1 -1.8 1.8h0z" fill="#2a78d6"><title>Vendor API: 0.6% of posts (31), Opus's labels</title></path><text x="24.8" y="456.5" font-size="12.5"><tspan font-weight="700" fill="#0b0b0b">0.6%</tspan><tspan dx="6.7" font-size="11.5" fill="#52514e">31 posts</tspan></text><line x1="175.9" y1="340.5" x2="175.9" y2="460.5" stroke-width="1.5" stroke="#0b0b0b"/><line x1="170.9" y1="340.5" x2="175.9" y2="340.5" stroke-width="1.5" stroke="#0b0b0b"/><line x1="170.9" y1="460.5" x2="175.9" y2="460.5" stroke-width="1.5" stroke="#0b0b0b"/><text x="185.9" y="383" font-size="12.5" font-weight="600" fill="#0b0b0b">4.1% combined (228</text><text x="185.9" y="399" font-size="12.5" font-weight="600" fill="#0b0b0b">posts): the tools Jev</text><text x="185.9" y="415" font-size="12.5" font-weight="600" fill="#0b0b0b">would replace. Audit:</text><text x="185.9" y="431" font-size="12.5" font-weight="600" fill="#0b0b0b">3.7% (3 to 5)</text><line x1="16" y1="513.5" x2="344" y2="513.5" stroke-width="1" stroke="#e6e5df"/><text x="16" y="527.5" font-size="11" fill="#6f6e69">Source: jev.openchamber.dev, 5,950 posts 16 to 23 Sep 2026</text><text x="16" y="542" font-size="11" fill="#6f6e69">(UTC), classified with Claude Opus 5.5, 1,681 posts audited</text><text x="16" y="556.5" font-size="11" fill="#6f6e69">blind by Grok; analysis by Matthew O'Riordan</text><text x="16" y="571.5" font-size="11" fill="#6f6e69">Disclosure: the author is CEO of Ably, a realtime</text><text x="16" y="586" font-size="11" fill="#6f6e69">infrastructure company.</text></svg>
