<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 546" width="360" height="546" role="img" aria-labeledby="09-ndark-t 09-ndark-d" font-family="Manrope, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="09-ndark-t">When Jev was surest, it picked the same family as Opus 98.0% of the time</title><desc id="09-ndark-d">5,949 Jev calls in tenths. Audited: at 0.99 or more, Jev matched 98.1% of 464 posts. D1: 42.5%. D2: 49.1%. D3: 65.2%. D4: 76.5%. D5: 83.2%. D6: 86.9%. D7: 90.1%. D8: 95.8%. D9: 97.1%. D10: 98.0%.</desc><rect x="0" y="0" width="360" height="546" fill="#1a1a19"/><text x="16" y="33" font-size="17" font-weight="700" fill="#ffffff">When Jev was surest, it picked the</text><text x="16" y="54" font-size="17" font-weight="700" fill="#ffffff">same family as Opus 98.0% of the</text><text x="16" y="75" font-size="17" font-weight="700" fill="#ffffff">time</text><text x="16" y="97" font-size="13" fill="#c3c2b7">5,949 Jev calls in tenths. Audited: at 0.99 or more,</text><text x="16" y="115" font-size="13" fill="#c3c2b7">Jev matched 98.1% of 464 posts.</text><rect x="16" y="133.6" width="12" height="12" rx="2" fill="#d95926"/><text x="36" y="144" font-size="12" fill="#ffffff">Jev agreed with Opus</text><rect x="179.9" y="133.6" width="12" height="12" rx="2" fill="#5a5954"/><text x="199.9" y="144" font-size="12" fill="#ffffff">Disagreed</text><line x1="15" y1="160.6" x2="31" y2="160.6" stroke-width="2.5" stroke="#ffffff"/><text x="36" y="165" font-size="12" fill="#ffffff">Jev’s average stated probability</text><text x="16" y="187" font-size="11.5" fill="#c3c2b7">Cards</text><line x1="50" y1="399" x2="344" y2="399" stroke-width="1" stroke="#4a4a46"/><text x="44" y="403" font-size="11" text-anchor="end" fill="#c3c2b7">0</text><line x1="50" y1="332.3" x2="344" y2="332.3" stroke-width="1" stroke="#2c2c2a"/><text x="44" y="336.3" font-size="11" text-anchor="end" fill="#c3c2b7">200</text><line x1="50" y1="265.7" x2="344" y2="265.7" stroke-width="1" stroke="#2c2c2a"/><text x="44" y="269.7" font-size="11" text-anchor="end" fill="#c3c2b7">400</text><line x1="50" y1="199" x2="344" y2="199" stroke-width="1" stroke="#2c2c2a"/><text x="44" y="203" font-size="11" text-anchor="end" fill="#c3c2b7">600</text><path d="M55.9 399h17.6v-84.3h-17.6z" fill="#d95926"><title>D1 (stated 0.20–0.52): agreed on 253 of 595, 42.5%</title></path><path d="M55.9 312.7v-108a4 4 0 0 1 4 -4h9.6a4 4 0 0 1 4 4v108z" fill="#5a5954"><title>D1: disagreed on 342 of 595</title></path><line x1="51.9" y1="311.8" x2="77.5" y2="311.8" stroke-width="2" stroke="#ffffff"/><text x="64.7" y="192.7" font-size="11" font-weight="700" text-anchor="middle" fill="#ffffff">42.5%</text><text x="64.7" y="414" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">D1</text><path d="M85.3 399h17.6v-97.3h-17.6z" fill="#d95926"><title>D2 (stated 0.52–0.64): agreed on 292 of 595, 49.1%</title></path><path d="M85.3 299.7v-95a4 4 0 0 1 4 -4h9.6a4 4 0 0 1 4 4v95z" fill="#5a5954"><title>D2: disagreed on 303 of 595</title></path><line x1="81.3" y1="284.2" x2="106.9" y2="284.2" stroke-width="2" stroke="#ffffff"/><text x="94.1" y="414" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">D2</text><path d="M114.7 399h17.6v-129.3h-17.6z" fill="#d95926"><title>D3 (stated 0.64–0.75): agreed on 388 of 595, 65.2%</title></path><path d="M114.7 267.7v-63a4 4 0 0 1 4 -4h9.6a4 4 0 0 1 4 4v63z" fill="#5a5954"><title>D3: disagreed on 207 of 595</title></path><line x1="110.7" y1="261.3" x2="136.3" y2="261.3" stroke-width="2" stroke="#ffffff"/><text x="123.5" y="414" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">D3</text><path d="M144.1 399h17.6v-151.7h-17.6z" fill="#d95926"><title>D4 (stated 0.75–0.84): agreed on 455 of 595, 76.5%</title></path><path d="M144.1 245.3v-40.7a4 4 0 0 1 4 -4h9.6a4 4 0 0 1 4 4v40.7z" fill="#5a5954"><title>D4: disagreed on 140 of 595</title></path><line x1="140.1" y1="240.9" x2="165.7" y2="240.9" stroke-width="2" stroke="#ffffff"/><text x="152.9" y="414" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">D4</text><path d="M173.5 399h17.6v-165h-17.6z" fill="#d95926"><title>D5 (stated 0.84–0.91): agreed on 495 of 595, 83.2%</title></path><path d="M173.5 232v-27.3a4 4 0 0 1 4 -4h9.6a4 4 0 0 1 4 4v27.3z" fill="#5a5954"><title>D5: disagreed on 100 of 595</title></path><line x1="169.5" y1="225.1" x2="195.1" y2="225.1" stroke-width="2" stroke="#ffffff"/><text x="182.3" y="192.7" font-size="11" font-weight="700" text-anchor="middle" fill="#ffffff">83.2%</text><text x="182.3" y="414" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">D5</text><path d="M202.9 399h17.6v-172h-17.6z" fill="#d95926"><title>D6 (stated 0.91–0.96): agreed on 516 of 594, 86.9%</title></path><path d="M202.9 225v-20a4 4 0 0 1 4 -4h9.6a4 4 0 0 1 4 4v20z" fill="#5a5954"><title>D6: disagreed on 78 of 594</title></path><line x1="198.9" y1="214.3" x2="224.5" y2="214.3" stroke-width="2" stroke="#ffffff"/><text x="211.7" y="414" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">D6</text><path d="M232.3 399h17.6v-178.7h-17.6z" fill="#d95926"><title>D7 (stated 0.96–0.98): agreed on 536 of 595, 90.1%</title></path><path d="M232.3 218.3v-13.7a4 4 0 0 1 4 -4h9.6a4 4 0 0 1 4 4v13.7z" fill="#5a5954"><title>D7: disagreed on 59 of 595</title></path><line x1="228.3" y1="206.6" x2="253.9" y2="206.6" stroke-width="2" stroke="#ffffff"/><text x="241.1" y="414" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">D7</text><path d="M261.7 399h17.6v-190h-17.6z" fill="#d95926"><title>D8 (stated 0.98–0.99): agreed on 570 of 595, 95.8%</title></path><path d="M261.7 207v-2.3a4 4 0 0 1 4 -4h9.6a4 4 0 0 1 4 4v2.3z" fill="#5a5954"><title>D8: disagreed on 25 of 595</title></path><line x1="257.7" y1="203.1" x2="283.3" y2="203.1" stroke-width="2" stroke="#ffffff"/><text x="270.5" y="414" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">D8</text><path d="M291.1 399h17.6v-192.7h-17.6z" fill="#d95926"><title>D9 (stated 0.99–1.00): agreed on 578 of 595, 97.1%</title></path><path d="M291.1 204.3v0a3.7 3.7 0 0 1 3.7 -3.7h10.3a3.7 3.7 0 0 1 3.7 3.7v0z" fill="#5a5954"><title>D9: disagreed on 17 of 595</title></path><line x1="287.1" y1="200.8" x2="312.7" y2="200.8" stroke-width="2" stroke="#ffffff"/><text x="299.9" y="414" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">D9</text><path d="M320.5 399h17.6v-194.3h-17.6z" fill="#d95926"><title>D10 (stated 1.00–1.00): agreed on 583 of 595, 98.0%</title></path><path d="M320.5 202.7v0a2 2 0 0 1 2 -2h13.6a2 2 0 0 1 2 2v0z" fill="#5a5954"><title>D10: disagreed on 12 of 595</title></path><line x1="316.5" y1="200.7" x2="342.1" y2="200.7" stroke-width="2" stroke="#ffffff"/><text x="329.3" y="192.7" font-size="11" font-weight="700" text-anchor="middle" fill="#ffffff">98.0%</text><text x="329.3" y="414" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">D10</text><text x="197" y="431" font-size="11.5" text-anchor="middle" fill="#c3c2b7">Tenths of Jev’s calls, least to most sure</text><line x1="16" y1="459" x2="344" y2="459" stroke-width="1" stroke="#2c2c2a"/><text x="16" y="473" font-size="11" fill="#9d9b93">Source: jev.openchamber.dev, 5,950 posts 16 to 23 Sep 2026</text><text x="16" y="487.5" font-size="11" fill="#9d9b93">(UTC), classified with Claude Opus 5.5, 1,681 posts audited</text><text x="16" y="502" font-size="11" fill="#9d9b93">blind by Grok; analysis by Matthew O'Riordan</text><text x="16" y="517" font-size="11" fill="#9d9b93">Disclosure: the author is CEO of Ably, a realtime</text><text x="16" y="531.5" font-size="11" fill="#9d9b93">infrastructure company.</text></svg>
