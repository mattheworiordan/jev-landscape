<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 490" width="360" height="490" role="img" aria-labeledby="12-ndark-t 12-ndark-d" font-family="Manrope, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="12-ndark-t">Of the 91 builds most likely to show something new, none did something that was unavailable before</title><desc id="12-ndark-d">91 builds (85 distinct), by what a team would have used before Jev. An LLM: 64 of 91. Rules or heuristics: 12 of 91. A vendor API: 11 of 91. A classic model: 4 of 91. Unavailable at any price: 0 of 91.</desc><rect x="0" y="0" width="360" height="490" fill="#1a1a19"/><text x="16" y="33" font-size="17" font-weight="700" fill="#ffffff">Of the 91 builds most likely to show</text><text x="16" y="54" font-size="17" font-weight="700" fill="#ffffff">something new, none did something</text><text x="16" y="75" font-size="17" font-weight="700" fill="#ffffff">that was unavailable before</text><text x="16" y="97" font-size="13" fill="#c3c2b7">91 builds (85 distinct), by what a team would have</text><text x="16" y="115" font-size="13" fill="#c3c2b7">used before Jev.</text><text x="16" y="149" font-size="12" font-weight="600" fill="#ffffff">An LLM</text><path d="M16 155h260a4 4 0 0 1 4 4v12a4 4 0 0 1 -4 4h-260z" fill="#3987e5"><title>An LLM: 64 of 91 posts</title></path><text x="287" y="170" font-size="13"><tspan font-weight="700" fill="#ffffff">64</tspan><tspan dx="6.7" font-size="11.5" fill="#c3c2b7">70%</tspan></text><text x="16" y="199" font-size="12" font-weight="600" fill="#ffffff">Rules or heuristics</text><path d="M16 205h45.5a4 4 0 0 1 4 4v12a4 4 0 0 1 -4 4h-45.5z" fill="#3987e5"><title>Rules or heuristics: 12 of 91 posts</title></path><text x="72.5" y="220" font-size="13"><tspan font-weight="700" fill="#ffffff">12</tspan><tspan dx="6.7" font-size="11.5" fill="#c3c2b7">13%</tspan></text><text x="16" y="249" font-size="12" font-weight="600" fill="#ffffff">A vendor API</text><path d="M16 255h41.4a4 4 0 0 1 4 4v12a4 4 0 0 1 -4 4h-41.4z" fill="#3987e5"><title>A vendor API: 11 of 91 posts</title></path><text x="68.4" y="270" font-size="13"><tspan font-weight="700" fill="#ffffff">11</tspan><tspan dx="6.7" font-size="11.5" fill="#c3c2b7">12%</tspan></text><text x="16" y="299" font-size="12" font-weight="600" fill="#ffffff">A classic model</text><path d="M16 305h12.5a4 4 0 0 1 4 4v12a4 4 0 0 1 -4 4h-12.5z" fill="#3987e5"><title>A classic model: 4 of 91 posts</title></path><text x="39.5" y="320" font-size="13"><tspan font-weight="700" fill="#ffffff">4</tspan><tspan dx="6.7" font-size="11.5" fill="#c3c2b7">4%</tspan></text><text x="16" y="349" font-size="12" font-weight="800" fill="#ffffff">Unavailable at any price</text><rect x="16.8" y="355.8" width="262.5" height="18.5" rx="3" fill="none" stroke-width="1.5" stroke-dasharray="5 4" stroke="#d95926"><title>Unavailable at any price: 0 of 91 posts</title></rect><text x="26" y="370" font-size="13.5"><tspan font-weight="800" fill="#ffffff">0</tspan><tspan dx="6.7" font-size="11.5" fill="#c3c2b7">of 91 posts</tspan></text><line x1="16" y1="403" x2="344" y2="403" stroke-width="1" stroke="#2c2c2a"/><text x="16" y="417" font-size="11" fill="#9d9b93">Source: jev.openchamber.dev, 5,950 posts 16 to 23 Sep 2026</text><text x="16" y="431.5" font-size="11" fill="#9d9b93">(UTC), classified with Claude Opus 5.5, 1,681 posts audited</text><text x="16" y="446" font-size="11" fill="#9d9b93">blind by Grok; analysis by Matthew O'Riordan</text><text x="16" y="461" font-size="11" fill="#9d9b93">Disclosure: the author is CEO of Ably, a realtime</text><text x="16" y="475.5" font-size="11" fill="#9d9b93">infrastructure company.</text></svg>
