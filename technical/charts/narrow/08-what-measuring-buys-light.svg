<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 572" width="360" height="572" role="img" aria-labeledby="08-nlight-t 08-nlight-d" font-family="Manrope, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="08-nlight-t">Measured demos averaged twice the views of demos with no numbers, but the typical post gained little</title><desc id="08-nlight-d">5,558 posts by evidence level, without the 37 labeled production. Measured demo: 1,723 posts, median 143, mean 12,755 views. Demo, no numbers: 3,672 posts, median 130, mean 5,752 views. Proposal or idea: 21 posts, median 55, mean 305 views. Commentary or meme: 142 posts, median 119, mean 7,246 views.</desc><rect x="0" y="0" width="360" height="572" fill="#fcfcfb"/><text x="16" y="33" font-size="17" font-weight="700" fill="#0b0b0b">Measured demos averaged twice the</text><text x="16" y="54" font-size="17" font-weight="700" fill="#0b0b0b">views of demos with no numbers, but</text><text x="16" y="75" font-size="17" font-weight="700" fill="#0b0b0b">the typical post gained little</text><text x="16" y="97" font-size="13" fill="#52514e">5,558 posts by evidence level, without the 37</text><text x="16" y="115" font-size="13" fill="#52514e">labeled production.</text><line x1="158" y1="155" x2="158" y2="273" stroke-width="1" stroke="#b9b8ae"/><text x="158" y="287" font-size="11" fill="#52514e">0</text><line x1="203.3" y1="155" x2="203.3" y2="273" stroke-width="1" stroke="#e6e5df"/><text x="203.3" y="287" font-size="11" text-anchor="middle" fill="#52514e">50</text><line x1="248.7" y1="155" x2="248.7" y2="273" stroke-width="1" stroke="#e6e5df"/><text x="248.7" y="287" font-size="11" text-anchor="middle" fill="#52514e">100</text><line x1="294" y1="155" x2="294" y2="273" stroke-width="1" stroke="#e6e5df"/><text x="294" y="287" font-size="11" text-anchor="middle" fill="#52514e">150</text><text x="158" y="145" font-size="12.5" font-weight="700" fill="#0b0b0b">Median views per post</text><text x="16" y="169" font-size="12" font-weight="600" fill="#0b0b0b">Measured demo</text><text x="16" y="183" font-size="11" fill="#52514e">1,723 posts</text><path d="M158 159h125.7a4 4 0 0 1 4 4v8a4 4 0 0 1 -4 4h-125.7z" fill="#2a78d6"><title>Measured demo: median 143 views per post, 1,723 posts</title></path><text x="293.7" y="172" font-size="12" font-weight="700" fill="#0b0b0b">143</text><text x="16" y="199" font-size="12" font-weight="600" fill="#0b0b0b">Demo, no numbers</text><text x="16" y="213" font-size="11" fill="#52514e">3,672 posts</text><path d="M158 189h113.9a4 4 0 0 1 4 4v8a4 4 0 0 1 -4 4h-113.9z" fill="#bdbcb2"><title>Demo, no numbers: median 130 views per post, 3,672 posts</title></path><text x="281.9" y="202" font-size="12" font-weight="700" fill="#0b0b0b">130</text><text x="16" y="229" font-size="12" font-weight="600" fill="#0b0b0b">Proposal or idea</text><text x="16" y="243" font-size="11" fill="#52514e">21 posts</text><path d="M158 219h45.9a4 4 0 0 1 4 4v8a4 4 0 0 1 -4 4h-45.9z" fill="#bdbcb2"><title>Proposal or idea: median 55 views per post, 21 posts</title></path><text x="213.9" y="232" font-size="12" font-weight="700" fill="#0b0b0b">55</text><text x="16" y="259" font-size="12" font-weight="600" fill="#0b0b0b">Commentary or meme</text><text x="16" y="273" font-size="11" fill="#52514e">142 posts</text><path d="M158 249h103.9a4 4 0 0 1 4 4v8a4 4 0 0 1 -4 4h-103.9z" fill="#bdbcb2"><title>Commentary or meme: median 119 views per post, 142 posts</title></path><text x="271.9" y="262" font-size="12" font-weight="700" fill="#0b0b0b">119</text><line x1="158" y1="327" x2="158" y2="445" stroke-width="1" stroke="#b9b8ae"/><text x="158" y="459" font-size="11" fill="#52514e">0</text><line x1="203.3" y1="327" x2="203.3" y2="445" stroke-width="1" stroke="#e6e5df"/><text x="203.3" y="459" font-size="11" text-anchor="middle" fill="#52514e">5k</text><line x1="248.7" y1="327" x2="248.7" y2="445" stroke-width="1" stroke="#e6e5df"/><text x="248.7" y="459" font-size="11" text-anchor="middle" fill="#52514e">10k</text><line x1="294" y1="327" x2="294" y2="445" stroke-width="1" stroke="#e6e5df"/><text x="294" y="459" font-size="11" text-anchor="middle" fill="#52514e">15k</text><text x="158" y="317" font-size="12.5" font-weight="700" fill="#0b0b0b">Mean views per post</text><text x="16" y="341" font-size="12" font-weight="600" fill="#0b0b0b">Measured demo</text><text x="16" y="355" font-size="11" fill="#52514e">1,723 posts</text><path d="M158 331h111.6a4 4 0 0 1 4 4v8a4 4 0 0 1 -4 4h-111.6z" fill="#2a78d6"><title>Measured demo: mean 12,755 views per post, 1,723 posts</title></path><text x="279.6" y="344" font-size="12" font-weight="700" fill="#0b0b0b">12,755</text><text x="16" y="371" font-size="12" font-weight="600" fill="#0b0b0b">Demo, no numbers</text><text x="16" y="385" font-size="11" fill="#52514e">3,672 posts</text><path d="M158 361h48.1a4 4 0 0 1 4 4v8a4 4 0 0 1 -4 4h-48.1z" fill="#bdbcb2"><title>Demo, no numbers: mean 5,752 views per post, 3,672 posts</title></path><text x="216.1" y="374" font-size="12" font-weight="700" fill="#0b0b0b">5,752</text><text x="16" y="401" font-size="12" font-weight="600" fill="#0b0b0b">Proposal or idea</text><text x="16" y="415" font-size="11" fill="#52514e">21 posts</text><path d="M158 391h0a2.8 2.8 0 0 1 2.8 2.8v10.5a2.8 2.8 0 0 1 -2.8 2.8h0z" fill="#bdbcb2"><title>Proposal or idea: mean 305 views per post, 21 posts</title></path><text x="166.8" y="404" font-size="12" font-weight="700" fill="#0b0b0b">305</text><text x="16" y="431" font-size="12" font-weight="600" fill="#0b0b0b">Commentary or meme</text><text x="16" y="445" font-size="11" fill="#52514e">142 posts</text><path d="M158 421h61.7a4 4 0 0 1 4 4v8a4 4 0 0 1 -4 4h-61.7z" fill="#bdbcb2"><title>Commentary or meme: mean 7,246 views per post, 142 posts</title></path><text x="229.7" y="434" font-size="12" font-weight="700" fill="#0b0b0b">7,246</text><line x1="16" y1="485" x2="344" y2="485" stroke-width="1" stroke="#e6e5df"/><text x="16" y="499" font-size="11" fill="#6f6e69">Source: jev.openchamber.dev, 5,950 posts 16 to 23 Sep 2026</text><text x="16" y="513.5" font-size="11" fill="#6f6e69">(UTC), classified with Claude Opus 5.5, 1,681 posts audited</text><text x="16" y="528" font-size="11" fill="#6f6e69">blind by Grok; analysis by Matthew O'Riordan</text><text x="16" y="543" font-size="11" fill="#6f6e69">Disclosure: the author is CEO of Ably, a realtime</text><text x="16" y="557.5" font-size="11" fill="#6f6e69">infrastructure company.</text></svg>
