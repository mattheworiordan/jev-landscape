<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 546" width="360" height="546" role="img" aria-labeledby="09-nauto-t 09-nauto-d" font-family="Manrope, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="09-nauto-t">When Jev was surest, it picked the same family as Opus 98.0% of the time</title><desc id="09-nauto-d">5,949 Jev calls in tenths. Audited: at 0.99 or more, Jev matched 98.1% of 464 posts. D1: 42.5%. D2: 49.1%. D3: 65.2%. D4: 76.5%. D5: 83.2%. D6: 86.9%. D7: 90.1%. D8: 95.8%. D9: 97.1%. D10: 98.0%.</desc><style>svg{--v-surface:#fcfcfb;--v-ink:#0b0b0b;--v-ink2:#52514e;--v-muted:#6f6e69;--v-grid:#e6e5df;--v-axis:#b9b8ae;--v-accent:#eb6834;--v-blue:#2a78d6;--v-blueLo:#86b6ef;--v-blueHi:#104281;--v-g1:#dcdbd3;--v-g2:#bdbcb2;--v-g3:#8a8981;--v-seq0:#f0efec;--v-seq1:#b7d3f6;--v-seq2:#86b6ef;--v-seq3:#5598e7;--v-seq4:#2a78d6;--v-seq5:#1c5cab;--v-seq6:#104281;--v-sqt1:#0b0b0b;--v-sqt2:#0b0b0b;--v-sqt3:#0b0b0b;--v-sqt4:#ffffff;--v-sqt5:#ffffff;--v-sqt6:#ffffff}@media (prefers-color-scheme: dark){svg{--v-surface:#1a1a19;--v-ink:#ffffff;--v-ink2:#c3c2b7;--v-muted:#9d9b93;--v-grid:#2c2c2a;--v-axis:#4a4a46;--v-accent:#d95926;--v-blue:#3987e5;--v-blueLo:#1c5cab;--v-blueHi:#b7d3f6;--v-g1:#3a3a37;--v-g2:#5a5954;--v-g3:#8a8880;--v-seq0:#242423;--v-seq1:#104281;--v-seq2:#1c5cab;--v-seq3:#2a78d6;--v-seq4:#5598e7;--v-seq5:#86b6ef;--v-seq6:#b7d3f6;--v-sqt1:#ffffff;--v-sqt2:#ffffff;--v-sqt3:#ffffff;--v-sqt4:#0b0b0b;--v-sqt5:#0b0b0b;--v-sqt6:#0b0b0b}}</style><rect x="0" y="0" width="360" height="546" style="fill:var(--v-surface)"/><text x="16" y="33" font-size="17" font-weight="700" style="fill:var(--v-ink)">When Jev was surest, it picked the</text><text x="16" y="54" font-size="17" font-weight="700" style="fill:var(--v-ink)">same family as Opus 98.0% of the</text><text x="16" y="75" font-size="17" font-weight="700" style="fill:var(--v-ink)">time</text><text x="16" y="97" font-size="13" style="fill:var(--v-ink2)">5,949 Jev calls in tenths. Audited: at 0.99 or more,</text><text x="16" y="115" font-size="13" style="fill:var(--v-ink2)">Jev matched 98.1% of 464 posts.</text><rect x="16" y="133.6" width="12" height="12" rx="2" style="fill:var(--v-accent)"/><text x="36" y="144" font-size="12" style="fill:var(--v-ink)">Jev agreed with Opus</text><rect x="179.9" y="133.6" width="12" height="12" rx="2" style="fill:var(--v-g2)"/><text x="199.9" y="144" font-size="12" style="fill:var(--v-ink)">Disagreed</text><line x1="15" y1="160.6" x2="31" y2="160.6" stroke-width="2.5" style="stroke:var(--v-ink)"/><text x="36" y="165" font-size="12" style="fill:var(--v-ink)">Jev’s average stated probability</text><text x="16" y="187" font-size="11.5" style="fill:var(--v-ink2)">Cards</text><line x1="50" y1="399" x2="344" y2="399" stroke-width="1" style="stroke:var(--v-axis)"/><text x="44" y="403" font-size="11" text-anchor="end" style="fill:var(--v-ink2)">0</text><line x1="50" y1="332.3" x2="344" y2="332.3" stroke-width="1" style="stroke:var(--v-grid)"/><text x="44" y="336.3" font-size="11" text-anchor="end" style="fill:var(--v-ink2)">200</text><line x1="50" y1="265.7" x2="344" y2="265.7" stroke-width="1" style="stroke:var(--v-grid)"/><text x="44" y="269.7" font-size="11" text-anchor="end" style="fill:var(--v-ink2)">400</text><line x1="50" y1="199" x2="344" y2="199" stroke-width="1" style="stroke:var(--v-grid)"/><text x="44" y="203" font-size="11" text-anchor="end" style="fill:var(--v-ink2)">600</text><path d="M55.9 399h17.6v-84.3h-17.6z" style="fill:var(--v-accent)"><title>D1 (stated 0.20–0.52): agreed on 253 of 595, 42.5%</title></path><path d="M55.9 312.7v-108a4 4 0 0 1 4 -4h9.6a4 4 0 0 1 4 4v108z" style="fill:var(--v-g2)"><title>D1: disagreed on 342 of 595</title></path><line x1="51.9" y1="311.8" x2="77.5" y2="311.8" stroke-width="2" style="stroke:var(--v-ink)"/><text x="64.7" y="192.7" font-size="11" font-weight="700" text-anchor="middle" style="fill:var(--v-ink)">42.5%</text><text x="64.7" y="414" font-s