<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 490" width="360" height="490" role="img" aria-labeledby="12-nlight-t 12-nlight-d" font-family="Manrope, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="12-nlight-t">Of the 91 most promising builds, none did something that was unavailable before</title><desc id="12-nlight-d">91 builds (85 distinct), by what a team would have used before Jev. An LLM: 64 of 91. Rules or heuristics: 12 of 91. A vendor API: 11 of 91. A classic model: 4 of 91. Unavailable at any price: 0 of 91.</desc><rect x="0" y="0" width="360" height="490" fill="#fcfcfb"/><text x="16" y="33" font-size="17" font-weight="700" fill="#0b0b0b">Of the 91 most promising builds, none</text><text x="16" y="54" font-size="17" font-weight="700" fill="#0b0b0b">did something that was unavailable</text><text x="16" y="75" font-size="17" font-weight="700" fill="#0b0b0b">before</text><text x="16" y="97" font-size="13" fill="#52514e">91 builds (85 distinct), by what a team would have</text><text x="16" y="115" font-size="13" fill="#52514e">used before Jev.</text><text x="16" y="149" font-size="12" font-weight="600" fill="#0b0b0b">An LLM</text><path d="M16 155h260a4 4 0 0 1 4 4v12a4 4 0 0 1 -4 4h-260z" fill="#2a78d6"><title>An LLM: 64 of 91 posts</title></path><text x="287" y="170" font-size="13"><tspan font-weight="700" fill="#0b0b0b">64</tspan><tspan dx="6.7" font-size="11.5" fill="#52514e">70%</tspan></text><text x="16" y="199" font-size="12" font-weight="600" fill="#0b0b0b">Rules or heuristics</text><path d="M16 205h45.5a4 4 0 0 1 4 4v12a4 4 0 0 1 -4 4h-45.5z" fill="#2a78d6"><title>Rules or heuristics: 12 of 91 posts</title></path><text x="72.5" y="220" font-size="13"><tspan font-weight="700" fill="#0b0b0b">12</tspan><tspan dx="6.7" font-size="11.5" fill="#52514e">13%</tspan></text><text x="16" y="249" font-size="12" font-weight="600" fill="#0b0b0b">A vendor API</text><path d="M16 255h41.4a4 4 0 0 1 4 4v12a4 4 0 0 1 -4 4h-41.4z" fill="#2a78d6"><title>A vendor API: 11 of 91 posts</title></path><text x="68.4" y="270" font-size="13"><tspan font-weight="700" fill="#0b0b0b">11</tspan><tspan dx="6.7" font-size="11.5" fill="#52514e">12%</tspan></text><text x="16" y="299" font-size="12" font-weight="600" fill="#0b0b0b">A classic model</text><path d="M16 305h12.5a4 4 0 0 1 4 4v12a4 4 0 0 1 -4 4h-12.5z" fill="#2a78d6"><title>A classic model: 4 of 91 posts</title></path><text x="39.5" y="320" font-size="13"><tspan font-weight="700" fill="#0b0b0b">4</tspan><tspan dx="6.7" font-size="11.5" fill="#52514e">4%</tspan></text><text x="16" y="349" font-size="12" font-weight="800" fill="#0b0b0b">Unavailable at any price</text><rect x="16.8" y="355.8" width="262.5" height="18.5" rx="3" fill="none" stroke-width="1.5" stroke-dasharray="5 4" stroke="#eb6834"><title>Unavailable at any price: 0 of 91 posts</title></rect><text x="26" y="370" font-size="13.5"><tspan font-weight="800" fill="#0b0b0b">0</tspan><tspan dx="6.7" font-size="11.5" fill="#52514e">of 91 posts</tspan></text><line x1="16" y1="403" x2="344" y2="403" stroke-width="1" stroke="#e6e5df"/><text x="16" y="417" font-size="11" fill="#6f6e69">Source: jev.openchamber.dev, 5,950 posts 16 to 23 Sep 2026</text><text x="16" y="431.5" font-size="11" fill="#6f6e69">(UTC), classified with Claude Opus 5.5, 1,681 posts audited</text><text x="16" y="446" font-size="11" fill="#6f6e69">blind by Grok; analysis by Matthew O'Riordan</text><text x="16" y="461" font-size="11" fill="#6f6e69">Disclosure: the author is CEO of Ably, a realtime</text><text x="16" y="475.5" font-size="11" fill="#6f6e69">infrastructure company.</text></svg>
