<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 693" width="360" height="693" role="img" aria-labeledby="11-nlight-t 11-nlight-d" font-family="Manrope, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="11-nlight-t">About a fifth of posts are meta, and memes and hot takes are under half a percent each</title><desc id="11-nlight-d">1,265 noise posts by sub-type. Audited: meta 21% (19 to 22) of all posts. Unrelated or unclear: 523 posts (41.3%), 33.1% of the noise's views. Benchmarks of the model: 360 posts (28.5%), 33.0% of the noise's views. Tooling or wrappers: 245 posts (19.4%), 19.6% of the noise's views. Explainers or tutorials: 59 posts (4.7%), 1.7% of the noise's views. News or reposts: 45 posts (3.6%), 10.6% of the noise's views. Hot takes: 18 posts (1.4%), 1.9% of the noise's views. Memes or jokes: 15 posts (1.2%), 0.1% of the noise's views.</desc><rect x="0" y="0" width="360" height="693" fill="#fcfcfb"/><text x="16" y="33" font-size="17" font-weight="700" fill="#0b0b0b">About a fifth of posts are meta, and</text><text x="16" y="54" font-size="17" font-weight="700" fill="#0b0b0b">memes and hot takes are under half a</text><text x="16" y="75" font-size="17" font-weight="700" fill="#0b0b0b">percent each</text><text x="16" y="97" font-size="13" fill="#52514e">1,265 noise posts by sub-type. Audited: meta 21%</text><text x="16" y="115" font-size="13" fill="#52514e">(19 to 22) of all posts.</text><line x1="16" y1="181" x2="16" y2="548" stroke-width="1" stroke="#b9b8ae"/><text x="16" y="563" font-size="11" fill="#52514e">0%</text><line x1="122" y1="181" x2="122" y2="548" stroke-width="1" stroke="#e6e5df"/><text x="122" y="563" font-size="11" text-anchor="middle" fill="#52514e">25%</text><line x1="228" y1="181" x2="228" y2="548" stroke-width="1" stroke="#e6e5df"/><text x="228" y="563" font-size="11" text-anchor="middle" fill="#52514e">50%</text><text x="122" y="579" font-size="11.5" text-anchor="middle" fi