<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 364" width="360" height="364" role="img" aria-labeledby="06-ndark-t 06-ndark-d" font-family="Manrope, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="06-ndark-t">About 11 percent of posts need a decision in under 300 ms, and about 9 in 10 of those are games</title><desc id="06-ndark-d">5,595 posts. Audited: under 300 ms 11.0% (9.5 to 12.5), games 91% of those (82 to 95). Under 300 ms: 11.0% of posts (9.5 to 12.5); games 90.8% of those.</desc><rect x="0" y="0" width="360" height="364" fill="#1a1a19"/><text x="16" y="33" font-size="17" font-weight="700" fill="#ffffff">About 11 percent of posts need a</text><text x="16" y="54" font-size="17" font-weight="700" fill="#ffffff">decision in under 300 ms, and about 9</text><text x="16" y="75" font-size="17" font-weight="700" fill="#ffffff">in 10 of those are games</text><text x="16" y="97" font-size="13" fill="#c3c2b7">5,595 posts. Audited: under 300 ms 11.0% (9.5 to</text><text x="16" y="115" font-size="13" fill="#c3c2b7">12.5), games 91% of those (82 to 95).</text><g><title>Under 300 ms: 11.0% of posts, 95% interval 9.5% to 12.5%</title><line x1="47.3" y1="139" x2="56.9" y2="139" stroke-width="1.5" stroke="#ffffff"/><line x1="47.3" y1="135" x2="47.3" y2="143" stroke-width="1.5" stroke="#ffffff"/><line x1="56.9" y1="135" x2="56.9" y2="143" stroke-width="1.5" stroke="#ffffff"/></g><rect x="16" y="148" width="32.8" height="24" fill="#3987e5"><title>Games under 300 ms: 10.0% of posts</title></rect><rect x="48.8" y="148" width="3.3" height="24" fill="#1c5cab"><title>Other posts under 300 ms: 1.0% of posts</title></rect><rect x="54.1" y="148" width="289.9" height="24" rx="3" fill="#3a3a37"><title>Everything else: 89.0% of posts</title></rect><line x1="16" y1="172" x2="16" y2="176" stroke-width="1" stroke="#4a4a46"/><text x="16" y="189" font-size="11" fill="#c3c2b7">0%</text><line x1="98" y1="172" x2="98" y2="176" stroke-width="1" stroke="#4a4a46"/><text x="98" y="189" font-size="11" text-anchor="middle" fill="#c3c2b7">25%</text><line x1="180" y1="172" x2="180" y2="176" stroke-width="1" stroke="#4a4a46"/><text x="180" y="189" font-size="11" text-anchor="middle" fill="#c3c2b7">50%</text><line x1="262" y1="172" x2="262" y2="176" stroke-width="1" stroke="#4a4a46"/><text x="262" y="189" font-size="11" text-anchor="middle" fill="#c3c2b7">75%</text><line x1="344" y1="172" x2="344" y2="176" stroke-width="1" stroke="#4a4a46"/><text x="344" y="189" font-size="11" text-anchor="end" fill="#c3c2b7">100%</text><text x="180" y="202" font-size="11.5" text-anchor="middle" fill="#c3c2b7">Share of the 5,595 posts</text><rect x="16" y="214.3" width="12" height="12" rx="2" fill="#3987e5"/><text x="36" y="224.5" font-size="11.5" fill="#ffffff">Games under 300 ms</text><rect x="170.3" y="214.3" width="12" height="12" rx="2" fill="#1c5cab"/><text x="190.3" y="224.5" font-size="11.5" fill="#ffffff">Other posts under 300 ms</text><rect x="16" y="234.8" width="12" height="12" rx="2" fill="#3a3a37"/><text x="36" y="245" font-size="11.5" fill="#ffffff">Everything else</text><line x1="138.9" y1="240.8" x2="154.9" y2="240.8" stroke-width="1.5" stroke="#ffffff"/><text x="159.9" y="245" font-size="11.5" fill="#ffffff">95% interval</text><line x1="16" y1="277" x2="344" y2="277" stroke-width="1" stroke="#2c2c2a"/><text x="16" y="291" font-size="11" fill="#9d9b93">Source: jev.openchamber.dev, 5,950 posts 16 to 23 Sep 2026</text><text x="16" y="305.5" font-size="11" fill="#9d9b93">(UTC), classified with Claude Opus 5.5, 1,681 posts audited</text><text x="16" y="320" font-size="11" fill="#9d9b93">blind by Grok; analysis by Matthew O'Riordan</text><text x="16" y="335" font-size="11" fill="#9d9b93">Disclosure: the author is CEO of Ably, a realtime</text><text x="16" y="349.5" font-size="11" fill="#9d9b93">infrastructure company.</text></svg>
