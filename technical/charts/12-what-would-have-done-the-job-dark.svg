<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 379" width="640" height="379" role="img" aria-labeledby="12-wdark-t 12-wdark-d" font-family="Manrope, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="12-wdark-t">Of the 91 most promising builds, none did something that was unavailable before</title><desc id="12-wdark-d">91 builds (85 distinct), by what a team would have used before Jev. An LLM: 64 of 91. Rules or heuristics: 12 of 91. A vendor API: 11 of 91. A classic model: 4 of 91. Unavailable at any price: 0 of 91.</desc><rect x="0" y="0" width="640" height="379" fill="#1a1a19"/><text x="24" y="44" font-size="20" font-weight="700" fill="#ffffff">Of the 91 most promising builds, none did something that</text><text x="24" y="69" font-size="20" font-weight="700" fill="#ffffff">was unavailable before</text><text x="24" y="91" font-size="13" fill="#c3c2b7">91 builds (85 distinct), by what a team would have used before Jev.</text><text x="24" y="127.5" font-size="12.5" font-weight="600" fill="#ffffff">An LLM</text><path d="M208 113h328a4 4 0 0 1 4 4v12a4 4 0 0 1 -4 4h-328z" fill="#3987e5"><title>An LLM: 64 of 91 posts</title></path><text x="547" y="128" font-size="13"><tspan font-weight="700" fill="#ffffff">64</tspan><tspan dx="6.7" font-size="11.5" fill="#c3c2b7">70%</tspan></text><text x="24" y="165.5" font-size="12.5" font-weight="600" fill="#ffffff">Rules or heuristics</text><path d="M208 151h58.3a4 4 0 0 1 4 4v12a4 4 0 0 1 -4 4h-58.2z" fill="#3987e5"><title>Rules or heuristics: 12 of 91 posts</title></path><text x="277.3" y="166" font-size="13"><tspan font-weight="700" fill="#ffffff">12</tspan><tspan dx="6.7" font-size="11.5" fill="#c3c2b7">13%</tspan></text><text x="24" y="203.5" font-size="12.5" font-weight="600" fill="#ffffff">A vendor API</text><path d="M208 189h53.1a4 4 0 0 1 4 4v12a4 4 0 0 1 -4 4h-53.1z" fill="#3987e5"><title>A vendor API: 11 of 91 posts</title></path><text x="272.1" y="204" font-si