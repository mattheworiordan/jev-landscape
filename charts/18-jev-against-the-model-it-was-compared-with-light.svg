<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 671" width="640" height="671" role="img" aria-labeledby="18-wlight-t 18-wlight-d" font-family="Manrope, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="18-wlight-t">Against small models the median gap is 7.3x on cost and 4.7x on latency; against frontier models it is 100x and more</title><desc id="18-wlight-d">Every published head-to-head found: how many times cheaper and faster Jev was than the model it was compared with, on the same task 16 comparisons from 12 sources. Blue: against a small model. Grey: against a frontier model.</desc><rect x="0" y="0" width="640" height="671" fill="#fcfcfb"/><text x="24" y="44" font-size="20" font-weight="700" fill="#0b0b0b">Against small models the median gap is 7.3x on cost and</text><text x="24" y="69" font-size="20" font-weight="700" fill="#0b0b0b">4.7x on latency; against frontier models it is 100x and</text><text x="24" y="94" font-size="20" font-weight="700" fill="#0b0b0b">more</text><text x="24" y="116" font-size="13" fill="#52514e">Every published head-to-head found: how many times cheaper and faster Jev was than the</text><text x="24" y="134" font-size="13" fill="#52514e">model it was compared with, on the same task</text><circle cx="30" cy="158.1" r="4.5" fill="#2a78d6"/><text x="44" y="162" font-size="11" fill="#0b0b0b">cheaper by (against a small model)</text><path d="M252.8 152.1l6 6l-6 6l-6 -6z" fill="#2a78d6"/><text x="266.8" y="162" font-size="11" fill="#0b0b0b">faster by</text><circle cx="338.2" cy="158.1" r="4.5" fill="#8a8981"/><text x="352.2" y="162" font-size="11" fill="#0b0b0b">against a frontier model</text><line x1="234" y1="182" x2="234" y2="530" stroke-width="1" stroke="#e6e5df"/><text x="234" y="176" font-size="10" text-anchor="middle" fill="#6f6e69">1x</text><line x1="357.3" y1="182" x2="357.3" y2="530" stroke-width="1" stroke="#e6e5df"/><text x="357.3" y="176" font-size="10" text-anchor="middle" fill="#6f6e69">10x</text><line x1="480.7" y1="182" x2="480.7" y2="530" stroke-width="1" stroke="#e6e5df"/><text x="480.7" y="176" font-size="10" text-anchor="middle" fill="#6f6e69">100x</text><line x1="604" y1="182" x2="604" y2="530" stroke-width="1" stroke="#e6e5df"/><text x="604" y="176" font-size="10" text-anchor="middle" fill="#6f6e69">1000x</text><text x="24" y="197.5" font-size="10.5" font-weight="500" fill="#0b0b0b">Jev Pong (me) vs Ministral 3B</text><line x1="265" y1="195" x2="289.1" y2="195" stroke-width="1.5" stroke="#e6e5df"/><circle cx="289.1" cy="195" r="4.5" fill="#2a78d6"><title>Jev Pong (me) vs Ministral 3B: 2.8x cheaper</title></circle><path d="M265 190l5 5l-5 5l-5 -5z" fill="#2a78d6"><title>Jev Pong (me) vs Ministral 3B: 1.8x faster</title></path><text x="24" y="219.5" font-size="10.5" font-weight="500" fill="#0b0b0b">Taishi Morinaga vs Gemini 3.5 Flash</text><path d="M296 212l5 5l-5 5l-5 -5z" fill="#2a78d6"><title>Taishi Morinaga, Classmethod vs Gemini 3.5 Flash: 3.2x faster</title></path><text x="24" y="241.5" font-size="10.5" font-weight="500" fill="#0b0b0b">CodeAlive vs gpt-oss-120b</text><line x1="308.3" y1="239" x2="317.4" y2="239" stroke-width="1.5" stroke="#e6e5df"/><circle cx="308.3" cy="239" r="4.5" fill="#2a78d6"><title>CodeAlive vs gpt-oss-120b: 4x cheaper</title></circle><path d="M317.4 234l5 5l-5 5l-5 -5z" fill="#2a78d6"><title>CodeAlive vs gpt-oss-120b: 4.7x faster</title></path><text x="24" y="263.5" font-size="10.5" font-weight="500" fill="#0b0b0b">Jalil Laaraichi vs GPT-5.6 Luna</text><circle cx="321.9" cy="261" r="4.5" fill="#2a78d6"><title>Jalil Laaraichi, OpenWork vs GPT-5.6 Luna: 5.2x cheaper</title></circle><text x="24" y="285.5" font-size="10.5" font-weight="500" fill="#0b0b0b">anessbelbati vs Cohere Rerank 4 Pro</text><line x1="271.1" y1="283" x2="326.1" y2="283" stroke-width="1.5" stroke="#e6e5df"/><circle cx="326.1" cy="283" r="4.5" fill="#2a78d6"><title>anessbelbati, rerank bench vs Cohere Rerank 4 Pro: 5.6x cheaper</title></circle><path d="M271.1 278l5 5l-5 5l-5 -5z" fill="#2a78d6"><title>anessbelbati, rerank bench vs Cohere Rerank 4 Pro: 2x faster</title></path><text x="24" y="307.5" font-size="10.5" font-weight="500" fill="#0b0b0b">Emil Lindfors vs DeepSeek V4.1 Flash</text><line x1="329.6" y1="305" x2="348.2" y2="305" stroke-width="1.5" stroke="#e6e5df"/><circle cx="329.6" cy="305" r="4.5" fill="#2a78d6"><title>Emil Lindfors vs DeepSeek V4.1 Flash: 6x cheaper</title></circle><path d="M348.2 300l5 5l-5 5l-5 -5z" fill="#2a78d6"><title>Emil Lindfors vs DeepSeek V4.1 Flash: 8.4x faster</title></path><text x="24" y="329.5" font-size="10.5" font-weight="500" fill="#0b0b0b">Jon Reed vs Mistral Small 4</text><line x1="319.3" y1="327" x2="349.3" y2="327" stroke-width="1.5" stroke="#e6e5df"/><circle cx="349.3" cy="327" r="4.5" fill="#2a78d6"><title>Jon Reed, Near Here vs Mistral Small 4: 8.6x cheaper</title></circle><path d="M319.3 322l5 5l-5 5l-5 -5z" fill="#2a78d6"><title>Jon Reed, Near Here vs Mistral Small 4: 4.9x faster</title></path><text x="24" y="351.5" font-size="10.5" font-weight="500" fill="#0b0b0b">anpicasso vs a small chat model</text><path d="M356.2 344l5 5l-5 5l-5 -5z" fill="#2a78d6"><title>anpicasso, Hermes approvals vs a small chat model: 9.8x faster</title></path><text x="24" y="373.5" font-size="10.5" font-weight="500" fill="#0b0b0b">Jev Pong (me) vs GPT-5.4 Nano</text><line x1="302.6" y1="371" x2="357.3" y2="371" stroke-width="1.5" stroke="#e6e5df"/><circle cx="357.3" cy="371" r="4.5" fill="#2a78d6"><title>Jev Pong (me) vs GPT-5.4 Nano: 10x cheaper</title></circle><path d="M302.6 366l5 5l-5 5l-5 -5z" fill="#2a78d6"><title>Jev Pong (me) vs GPT-5.4 Nano: 3.6x faster</title></path><text x="24" y="395.5" font-size="10.5" font-weight="500" fill="#0b0b0b">Dan Willoughby vs Claude Haiku 4.5</text><line x1="361.6" y1="393" x2="421.8" y2="393" stroke-width="1.5" stroke="#e6e5df"/><circle cx="421.8" cy="393" r="4.5" fill="#2a78d6"><title>Dan Willoughby, Sniff Test vs Claude Haiku 4.5: 33x cheaper</title></circle><path d="M361.6 388l5 5l-5 5l-5 -5z" fill="#2a78d6"><title>Dan Willoughby, Sniff Test vs Claude Haiku 4.5: 11x faster</title></path><text x="24" y="417.5" font-size="10.5" font-weight="500" fill="#0b0b0b">Jev Pong (me) vs Claude Haiku 4.5</text><line x1="302.1" y1="415" x2="436.7" y2="415" stroke-width="1.5" stroke="#e6e5df"/><circle cx="436.7" cy="415" r="4.5" fill="#2a78d6"><title>Jev Pong (me) vs Claude Haiku 4.5: 44x cheaper</title></circle><path d="M302.1 410l5 5l-5 5l-5 -5z" fill="#2a78d6"><title>Jev Pong (me) vs Claude Haiku 4.5: 3.6x faster</title></path><text x="24" y="439.5" font-size="10.5" font-weight="500" fill="#0b0b0b">Jon Reed vs Gemini 3.5 Flash-Lite</text><line x1="327.8" y1="437" x2="451.5" y2="437" stroke-width="1.5" stroke="#e6e5df"/><circle cx="451.5" cy="437" r="4.5" fill="#2a78d6"><title>Jon Reed, Near Here vs Gemini 3.5 Flash-Lite: 58x cheaper</title></circle><path d="M327.8 432l5 5l-5 5l-5 -5z" fill="#2a78d6"><title>Jon Reed, Near Here vs Gemini 3.5 Flash-Lite: 5.8x faster</title></path><text x="24" y="461.5" font-size="10.5" font-weight="500" fill="#0b0b0b">LangWatch vs Claude Opus 5</text><line x1="346.8" y1="459" x2="479.2" y2="459" stroke-width="1.5" stroke="#e6e5df"/><circle cx="479.2" cy="459" r="4.5" fill="#8a8981"><title>LangWatch vs Claude Opus 5: 97x cheaper</title></circle><path d="M346.8 454l5 5l-5 5l-5 -5z" fill="#8a8981"><title>LangWatch vs Claude Opus 5: 8.2x faster</title></path><text x="24" y="483.5" font-size="10.5" font-weight="500" fill="#0b0b0b">awlevin vs Claude Opus 5</text><line x1="374.1" y1="481" x2="505.8" y2="481" stroke-width="1.5" stroke="#e6e5df"/><circle cx="505.8" cy="481" r="4.5" fill="#8a8981"><title>awlevin, computer use vs Claude Opus 5: 160x cheaper</title></circle><path d="M374.1 476l5 5l-5 5l-5 -5z" fill="#8a8981"><title>awlevin, computer use vs Claude Opus 5: 14x faster</title></path><text x="24" y="505.5" font-size="10.5" font-weight="500" fill="#0b0b0b">Dan Willoughby vs Claude Opus 5</text><line x1="425.8" y1="503" x2="527.3" y2="503" stroke-width="1.5" stroke="#e6e5df"/><circle cx="527.3" cy="503" r="4.5" fill="#8a8981"><title>Dan Willoughby, Sniff Test vs Claude Opus 5: 239x cheaper</title></circle><path d="M425.8 498l5 5l-5 5l-5 -5z" fill="#8a8981"><title>Dan Willoughby, Sniff Test vs Claude Opus 5: 36x faster</title></path><text x="24" y="527.5" font-size="10.5" font-weight="500" fill="#0b0b0b">Dan Shipper vs Claude Fable 5.1</text><line x1="406.9" y1="525" x2="574.8" y2="525" stroke-width="1.5" stroke="#e6e5df"/><circle cx="574.8" cy="525" r="4.5" fill="#8a8981"><title>Dan Shipper, Every vs Claude Fable 5.1: 580x cheaper</title></circle><path d="M406.9 520l5 5l-5 5l-5 -5z" fill="#8a8981"><title>Dan Shipper, Every vs Claude Fable 5.1: 25x faster</title></path><text x="24" y="554.5" font-size="10.5" fill="#6f6e69">Small: the vendor's small or cheap tier. Each multiple is the comparison model's figure divided by Jev's, as the</text><text x="24" y="568.5" font-size="10.5" fill="#6f6e69">source published it; the table under the chart has the accuracy and the links.</text><line x1="24" y1="590.5" x2="616" y2="590.5" stroke-width="1" stroke="#e6e5df"/><text x="24" y="604.5" font-size="11" fill="#6f6e69">Source: the linked write-ups (Near Here, Lindfors, Sniff Test, OpenWork, CodeAlive, rerank bench, Classmethod,</text><text x="24" y="619" font-size="11" fill="#6f6e69">Hermes, LangWatch, Every, awlevin) and the Jev Pong runs; TypeSafe's launch post; the feed's claim chips;</text><text x="24" y="633.5" font-size="11" fill="#6f6e69">analysis by Matthew O'Riordan</text><text x="24" y="648.5" font-size="11" fill="#6f6e69">Disclosure: the author is CEO of Ably, a realtime infrastructure company.</text></svg>
