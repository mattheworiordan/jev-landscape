279.5" y="594" font-size="9.5" fill="#ffffff">model</text><rect x="359" y="549" width="84.5" height="62" fill="#104281" rx="3"><title>No decision stated, seconds or slower: 71 posts, 6% of the group</title></rect><text x="367" y="568" font-size="13"><tspan font-weight="700" fill="#ffffff">71</tspan><tspan dx="6.1" font-size="10.5" fill="#ffffff">6%</tspan></text><text x="367" y="583" font-size="9.5" fill="#ffffff">Talk about the</text><text x="367" y="594" font-size="9.5" fill="#ffffff">model</text><rect x="453.5" y="549" width="84.5" height="62" fill="#5a5954" rx="3"><title>No decision stated, unclear: 1,034 posts, 82% of the group</title></rect><text x="461.5" y="568" font-size="13"><tspan font-weight="700" fill="#ffffff">1,034</tspan><tspan dx="6.1" font-size="10.5" fill="#ffffff">82%</tspan></text><text x="461.5" y="583" font-size="9.5" fill="#ffffff">Talk about the</text><text x="461.5" y="594" font-size="9.5" fill="#ffffff">model</text><text x="554" y="568" font-size="12"><tspan font-weight="700" fill="#ffffff">1,254</tspan><tspan dx="6.1" font-size="10.5" fill="#c3c2b7">22%</tspan></text><rect x="554" y="576" width="37.6" height="8" fill="#5a5954" rx="2"><title>No decision stated: 1,254 posts, 22.4% of all posts</title></rect><text x="24" y="633" font-size="12" font-weight="700" fill="#ffffff">All groups</text><text x="192" y="633" font-size="12"><tspan font-weight="700" fill="#ffffff">809</tspan><tspan dx="6.1" font-size="10.5" fill="#c3c2b7">14%</tspan></text><text x="279.5" y="633" font-size="12"><tspan font-weight="700" fill="#ffffff">1,254</tspan><tspan dx="6.1" font-size="10.5" fill="#c3c2b7">22%</tspan></text><text x="367" y="633" font-size="12"><tspan font-weight="700" fill="#ffffff">2,234</tspan><tspan dx="6.1" font-size="10.5" fill="#c3c2b7">40%</tspan></text><text x="461.5" y="633" font-size="12"><tspan font-weight="700" fill="#ffffff">1,298</tspan><tspan dx="6.1" font-size="10.5" fill="#c3c2b7">23%</tspan></text><text x="554" y="633" font-size="12" font-weight="700" fill="#ffffff">5,595</text><text x="24" y="652.5" font-size="10.5" fill="#c3c2b7">Cells are the labelling model's calls, and how soon a decision is needed is the field the blind audit agrees with least</text><text x="24" y="666.5" font-size="10.5" fill="#c3c2b7">(75% at seven tiers). The audit puts 11.0% of posts under 300 ms (9.5 to 12.5), not the labels' 14.5%, and 91% of</text><text x="24" y="680.5" font-size="10.5" fill="#c3c2b7">those are games (82 to 95): the only two numbers here it confirms.</text><line x1="24" y1="702.5" x2="616" y2="702.5" stroke-width="1" stroke="#2c2c2a"/><text x="24" y="716.5" font-size="11" fill="#9d9b93">Source: jev.openchamber.dev, 5,950 posts 16 to 23 Sep 2026 (UTC), classified with Claude Opus 5.5, 1,681</text><text x="24" y="731" font-size="11" fill="#9d9b93">posts audited blind by Grok; analysis by Matthew O'Riordan</text><text x="24" y="746" font-size="11" fill="#9d9b93">Disclosure: the author is CEO of Ably, a realtime infrastructure company.</text></svg>
