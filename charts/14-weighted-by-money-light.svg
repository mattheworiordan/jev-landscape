<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 612" width="640" height="612" role="img" aria-labeledby="14-wlight-t 14-wlight-d" font-family="Manrope, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="14-wlight-t">More requests than GPT-5.6 Luna, for an eighth of the money</title><desc id="14-wlight-d">OpenRouter, week to 23 Sep: Jev against the busiest chat model; then one day's Jev tokens priced on other models Jev 437M requests, 1.39T tokens, $51,763; GPT-5.6 Luna 315M, 8.74T, $415,706. On 23 Sep Jev's 327B prompt tokens cost $13,655.</desc><rect x="0" y="0" width="640" height="612" fill="#fcfcfb"/><text x="24" y="44" font-size="20" font-weight="700" fill="#0b0b0b">More requests than GPT-5.6 Luna, for an eighth of the</text><text x="24" y="69" font-size="20" font-weight="700" fill="#0b0b0b">money</text><text x="24" y="91" font-size="13" fill="#52514e">OpenRouter, week to 23 Sep: Jev against the busiest chat model; then one day's Jev tokens</text><text x="24" y="109" font-size="13" fill="#52514e">priced on other models</text><text x="24" y="139.5" font-size="12.5" font-weight="700" fill="#0b0b0b">Week to 23 Sep on OpenRouter: Jev (blue) against GPT-5.6 Luna (grey)</text><text x="24" y="167" font-size="12" font-weight="600" fill="#0b0b0b">Requests</text><text x="24" y="185" font-size="10.5" fill="#6f6e69">Jev is 1.4x</text><path d="M104 153h449a3 3 0 0 1 3 3v7a3 3 0 0 1 -3 3h-449z" fill="#2a78d6"><title>Jev: 437M</title></path><text x="562" y="164" font-size="11" font-weight="600" fill="#0b0b0b">437M</text><path d="M104 169h323.3a3 3 0 0 1 3 3v7a3 3 0 0 1 -3 3h-323.3z" fill="#bdbcb2"><title>GPT-5.6 Luna: 315M</title></path><text x="436.3" y="180" font-size="11" fill="#52514e">315M</text><text x="24" y="210" font-size="12" font-weight="600" fill="#0b0b0b">Tokens</text><text x="24" y="228" font-size="10.5" fill="#6f6e69">Jev is 16%</text><path d="M104 196h68.9a3 3 0 0 1 3 3v7a3 3 0 0 1 -3 3h-68.9z" fill="#2a78d6"><title>Jev: 1.39T</title></path><text x="181.9" y="207" font-size="11" font-weight="600" fill="#0b0b0b">1.39T</text><path d="M104 212h449a3 3 0 0 1 3 3v7a3 3 0 0 1 -3 3h-449z" fill="#bdbcb2"><title>GPT-5.6 Luna: 8.74T</title></path><text x="562" y="223" font-size="11" fill="#52514e">8.74T</text><text x="24" y="253" font-size="12" font-weight="600" fill="#0b0b0b">Spend</text><text x="24" y="271" font-size="10.5" fill="#6f6e69">Jev is 12%</text><path d="M104 239h53.3a3 3 0 0 1 3 3v7a3 3 0 0 1 -3 3h-53.3z" fill="#2a78d6"><title>Jev: $51.8k</title></path><text x="166.3" y="250" font-size="11" font-weight="600" fill="#0b0b0b">$51.8k</text><path d="M104 255h449a3 3 0 0 1 3 3v7a3 3 0 0 1 -3 3h-449z" fill="#bdbcb2"><title>GPT-5.6 Luna: $416k</title></path><text x="562" y="266" font-size="11" fill="#52514e">$416k</text><text x="24" y="300.5" font-size="12.5" font-weight="700" fill="#0b0b0b">What 23 Sep's Jev tokens (327B prompt tokens) would cost on other models, at list price</text><line x1="156" y1="322" x2="156" y2="478" stroke-width="1" stroke="#e6e5df"/><text x="156" y="316" font-size="10.5" text-anchor="middle" fill="#6f6e69">$10k</text><line x1="277.3" y1="322" x2="277.3" y2="478" stroke-width="1" stroke="#e6e5df"/><text x="277.3" y="316" font-size="10.5" text-anchor="middle" fill="#6f6e69">$100k</text><line x1="398.7" y1="322" x2="398.7" y2="478" stroke-width="1" stroke="#e6e5df"/><text x="398.7" y="316" font-size="10.5" text-anchor="middle" fill="#6f6e69">$1M</text><line x1="520" y1="322" x2="520" y2="478" stroke-width="1" stroke="#e6e5df"/><text x="520" y="316" font-size="10.5" text-anchor="middle" fill="#6f6e69">$10M</text><text x="148" y="334" font-size="11.5" text-anchor="end" fill="#0b0b0b">DeepSeek V4 Flash 0731</text><line x1="156" y1="330" x2="157.1" y2="330" stroke-width="2" stroke="#86b6ef"/><circle cx="157.1" cy="330" r="5" fill="#2a78d6"><title>DeepSeek V4 Flash 0731: $10,209, 0.7x Jev's bill</title></circle><text x="166.1" y="334" font-size="11" fill="#52514e">$10.2k · 0.7x</text><text x="148" y="354" font-size="11.5" font-weight="700" text-anchor="end" fill="#0b0b0b">Jev</text><line x1="156" y1="350" x2="172.4" y2="350" stroke-width="2" stroke="#eb6834"/><circle cx="172.4" cy="350" r="5" fill="#eb6834"><title>Jev: $13,655, 1.0x Jev's bill</title></circle><text x="181.4" y="354" font-size="11" font-weight="700" fill="#0b0b0b">$13.7k · billed</text><text x="148" y="374" font-size="11.5" text-anchor="end" fill="#0b0b0b">GPT-5 Nano</text><line x1="156" y1="370" x2="183.5" y2="370" stroke-width="2" stroke="#86b6ef"/><circle cx="183.5" cy="370" r="5" fill="#2a78d6"><title>GPT-5 Nano: $16,848, 1.2x Jev's bill</title></circle><text x="192.5" y="374" font-size="11" fill="#52514e">$16.8k · 1.2x</text><text x="148" y="394" font-size="11.5" text-anchor="end" fill="#0b0b0b">Ministral 3B</text><line x1="156" y1="390" x2="218.6" y2="390" stroke-width="2" stroke="#86b6ef"/><circle cx="218.6" cy="390" r="5" fill="#2a78d6"><title>Ministral 3B: $32,816, 2.4x Jev's bill</title></circle><text x="227.6" y="394" font-size="11" fill="#52514e">$32.8k · 2.4x</text><text x="148" y="414" font-size="11.5" text-anchor="end" fill="#0b0b0b">Gemini 3.5 Flash-Lite</text><line x1="156" y1="410" x2="278" y2="410" stroke-width="2" stroke="#86b6ef"/><circle cx="278" cy="410" r="5" fill="#2a78d6"><title>Gemini 3.5 Flash-Lite: $101,211, 7.4x Jev's bill</title></circle><text x="287" y="414" font-size="11" fill="#52514e">$101k · 7.4x</text><text x="148" y="434" font-size="11.5" text-anchor="end" fill="#0b0b0b">Claude Haiku 4.5</text><line x1="156" y1="430" x2="340.8" y2="430" stroke-width="2" stroke="#86b6ef"/><circle cx="340.8" cy="430" r="5" fill="#2a78d6"><title>Claude Haiku 4.5: $333,183, 24.4x Jev's bill</title></circle><text x="349.8" y="434" font-size="11" fill="#52514e">$333k · 24x</text><text x="148" y="454" font-size="11.5" text-anchor="end" fill="#0b0b0b">GPT-5.6 Sol</text><line x1="156" y1="450" x2="377.3" y2="450" stroke-width="2" stroke="#86b6ef"/><circle cx="377.3" cy="450" r="5" fill="#2a78d6"><title>GPT-5.6 Sol: $666,365, 48.8x Jev's bill</title></circle><text x="386.3" y="454" font-size="11" fill="#52514e">$666k · 49x</text><text x="148" y="474" font-size="11.5" text-anchor="end" fill="#0b0b0b">Claude Fable 5.1</text><line x1="156" y1="470" x2="462.1" y2="470" stroke-width="2" stroke="#86b6ef"/><circle cx="462.1" cy="470" r="5" fill="#2a78d6"><title>Claude Fable 5.1: $3,331,826, 244.0x Jev's bill</title></circle><text x="471.1" y="474" font-size="11" fill="#52514e">$3.3M · 244x</text><text x="156" y="496.5" font-size="10.5" fill="#6f6e69">Same prompt tokens, plus 10 output tokens a request for the chat models: a floor for</text><text x="156" y="510.5" font-size="10.5" fill="#6f6e69">models that think before answering. A price comparison only; nobody has run these tasks</text><text x="156" y="524.5" font-size="10.5" fill="#6f6e69">on those models.</text><line x1="24" y1="546.5" x2="616" y2="546.5" stroke-width="1" stroke="#e6e5df"/><text x="24" y="560.5" font-size="11" fill="#6f6e69">Source: openrouter.ai/rankings and the Jev model page, list prices from openrouter.ai/api/v1/models and</text><text x="24" y="575" font-size="11" fill="#6f6e69">docs.typesafe.ai, read 24 Sep 2026; analysis by Matthew O'Riordan</text><text x="24" y="590" font-size="11" fill="#6f6e69">Disclosure: the author is CEO of Ably, a realtime infrastructure company.</text></svg>
