ude Opus 5: 36x faster</title></path><text x="24" y="502.5" font-size="10.5" font-weight="500" style="fill:var(--v-ink)">Dan Shipper vs Claude Fable 5.1</text><line x1="406.9" y1="500" x2="574.8" y2="500" stroke-width="1.5" style="stroke:var(--v-grid)"/><circle cx="574.8" cy="500" r="4.5" style="fill:var(--v-g3)"><title>Dan Shipper, Every vs Claude Fable 5.1: 580x cheaper</title></circle><path d="M406.9 495l5 5l-5 5l-5 -5z" style="fill:var(--v-g3)"><title>Dan Shipper, Every vs Claude Fable 5.1: 25x faster</title></path><text x="24" y="529.5" font-size="10.5" style="fill:var(--v-muted)">Small: the vendor's small or cheap tier. Each multiple is the comparison model's figure divided by Jev's, as the</text><text x="24" y="543.5" font-size="10.5" style="fill:var(--v-muted)">source published it; the table under the chart has the accuracy and the links.</text><line x1="24" y1="565.5" x2="616" y2="565.5" stroke-width="1" style="stroke:var(--v-grid)"/><text x="24" y="579.5" font-size="11" style="fill:var(--v-muted)">Source: the linked write-ups (Near Here, Lindfors, Sniff Test, OpenWork, CodeAlive, rerank bench, Classmethod,</text><text x="24" y="594" font-size="11" style="fill:var(--v-muted)">Hermes, LangWatch, Every, awlevin) and the Jev Pong runs; TypeSafe's launch post; the feed's claim chips;</text><text x="24" y="608.5" font-size="11" style="fill:var(--v-muted)">analysis by Matthew O'Riordan</text><text x="24" y="623.5" font-size="11" style="fill:var(--v-muted)">Disclosure: the author is CEO of Ably, a realtime infrastructure company.</text></svg>
