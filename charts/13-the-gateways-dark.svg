<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" role="img" aria-labeledby="13-wdark-t 13-wdark-d" font-family="Manrope, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="13-wdark-t">Jev became a quarter of Vercel's gateway requests in a week, and 2% of its tokens</title><desc id="13-wdark-d">OpenRouter requests a day, 18 to 23 Sep; Vercel AI Gateway share of all requests and of all tokens, 17 to 23 Sep OpenRouter served 126M Jev requests on 23 Sep. Jev was 25% of Vercel AI Gateway requests and 1.8% of its tokens that day.</desc><rect x="0" y="0" width="640" height="640" fill="#1a1a19"/><text x="24" y="44" font-size="20" font-weight="700" fill="#ffffff">Jev became a quarter of Vercel's gateway requests in a</text><text x="24" y="69" font-size="20" font-weight="700" fill="#ffffff">week, and 2% of its tokens</text><text x="24" y="91" font-size="13" fill="#c3c2b7">OpenRouter requests a day, 18 to 23 Sep; Vercel AI Gateway share of all requests and of all</text><text x="24" y="109" font-size="13" fill="#c3c2b7">tokens, 17 to 23 Sep</text><text x="24" y="139.5" font-size="12.5" font-weight="700" fill="#ffffff">OpenRouter: Jev requests a day, in millions</text><line x1="68" y1="301" x2="616" y2="301" stroke-width="1" stroke="#2c2c2a"/><text x="62" y="305" font-size="10.5" text-anchor="end" fill="#9d9b93">0M</text><line x1="68" y1="251" x2="616" y2="251" stroke-width="1" stroke="#2c2c2a"/><text x="62" y="255" font-size="10.5" text-anchor="end" fill="#9d9b93">50M</text><line x1="68" y1="201" x2="616" y2="201" stroke-width="1" stroke="#2c2c2a"/><text x="62" y="205" font-size="10.5" text-anchor="end" fill="#9d9b93">100M</text><line x1="68" y1="151" x2="616" y2="151" stroke-width="1" stroke="#2c2c2a"/><text x="62" y="155" font-size="10.5" text-anchor="end" fill="#9d9b93">150M</text><path d="M68 301v-25.2a3 3 0 0 1 3 -3h77a3 3 0 0 1 3 3v25.2z" fill="#3987e5"><title>18 Sep: 28M</title></path><text x="109.5" y="267.8" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">28M</text><text x="109.5" y="315" font-size="11" text-anchor="middle" fill="#c3c2b7">18 Sep</text><path d="M161 301v-49.6a3 3 0 0 1 3 -3h77a3 3 0 0 1 3 3v49.6z" fill="#3987e5"><title>19 Sep: 53M</title></path><text x="202.5" y="243.4" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">53M</text><text x="202.5" y="315" font-size="11" text-anchor="middle" fill="#c3c2b7">19 Sep</text><path d="M254 301v-61.4a3 3 0 0 1 3 -3h77a3 3 0 0 1 3 3v61.4z" fill="#3987e5"><title>20 Sep: 64M</title></path><text x="295.5" y="231.6" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">64M</text><text x="295.5" y="315" font-size="11" text-anchor="middle" fill="#c3c2b7">20 Sep</text><path d="M347 301v-79.4a3 3 0 0 1 3 -3h77a3 3 0 0 1 3 3v79.4z" fill="#3987e5"><title>21 Sep: 82M</title></path><text x="388.5" y="213.6" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">82M</text><text x="388.5" y="315" font-size="11" text-anchor="middle" fill="#c3c2b7">21 Sep</text><path d="M440 301v-80.6a3 3 0 0 1 3 -3h77a3 3 0 0 1 3 3v80.6z" fill="#3987e5"><title>22 Sep: 84M</title></path><text x="481.5" y="212.4" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">84M</text><text x="481.5" y="315" font-size="11" text-anchor="middle" fill="#c3c2b7">22 Sep</text><path d="M533 301v-122.6a3 3 0 0 1 3 -3h77a3 3 0 0 1 3 3v122.6z" fill="#3987e5"><title>23 Sep: 126M</title></path><text x="574.5" y="170.4" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">126M</text><text x="574.5" y="315" font-size="11" text-anchor="middle" fill="#c3c2b7">23 Sep</text><line x1="68" y1="301" x2="616" y2="301" stroke-width="1" stroke="#4a4a46"/><text x="68" y="333.5" font-size="10.5" fill="#9d9b93">Requests are API calls, not decisions; one call can carry several questions.</text><text x="24" y="364" font-size="12.5" font-weight="700" fill="#ffffff">Vercel AI Gateway: Jev's share of all requests, and of all tokens</text><line x1="68" y1="505.5" x2="512" y2="505.5" stroke-width="1" stroke="#2c2c2a"/><text x="62" y="509.5" font-size="10.5" text-anchor="end" fill="#9d9b93">0%</text><line x1="68" y1="462.2" x2="512" y2="462.2" stroke-width="1" stroke="#2c2c2a"/><text x="62" y="466.2" font-size="10.5" text-anchor="end" fill="#9d9b93">10%</text><line x1="68" y1="418.8" x2="512" y2="418.8" stroke-width="1" stroke="#2c2c2a"/><text x="62" y="422.8" font-size="10.5" text-anchor="end" fill="#9d9b93">20%</text><line x1="68" y1="375.5" x2="512" y2="375.5" stroke-width="1" stroke="#2c2c2a"/><text x="62" y="379.5" font-size="10.5" text-anchor="end" fill="#9d9b93">30%</text><path d="M68 479.7L142 446.7L216 391.6L290 415.3L364 413.5L438 410.1L512 396.2" fill="none" stroke-width="2.5" stroke-linejoin="round" stroke="#3987e5"/><circle cx="68" cy="479.7" r="3" fill="#3987e5"><title>17 Sep: 5.9% of requests</title></circle><circle cx="142" cy="446.7" r="3" fill="#3987e5"><title>18 Sep: 13.6% of requests</title></circle><circle cx="216" cy="391.6" r="3" fill="#3987e5"><title>19 Sep: 26.3% of requests</title></circle><circle cx="290" cy="415.3" r="3" fill="#3987e5"><title>20 Sep: 20.8% of requests</title></circle><circle cx="364" cy="413.5" r="3" fill="#3987e5"><title>21 Sep: 21.2% of requests</title></circle><circle cx="438" cy="410.1" r="3" fill="#3987e5"><title>22 Sep: 22.0% of requests</title></circle><circle cx="512" cy="396.2" r="3" fill="#3987e5"><title>23 Sep: 25.2% of requests</title></circle><text x="518" y="400.2" font-size="11" font-weight="600" fill="#ffffff">25% of requests</text><path d="M68 504L142 502.2L216 497.8L290 496.8L364 496.7L438 497.9L512 497.7" fill="none" stroke-width="2.5" stroke-linejoin="round" stroke="#8a8880"/><circle cx="68" cy="504" r="3" fill="#8a8880"><title>17 Sep: 0.3% of tokens</title></circle><circle cx="142" cy="502.2" r="3" fill="#8a8880"><title>18 Sep: 0.8% of tokens</title></circle><circle cx="216" cy="497.8" r="3" fill="#8a8880"><title>19 Sep: 1.8% of tokens</title></circle><circle cx="290" cy="496.8" r="3" fill="#8a8880"><title>20 Sep: 2.0% of tokens</title></circle><circle cx="364" cy="496.7" r="3" fill="#8a8880"><title>21 Sep: 2.0% of tokens</title></circle><circle cx="438" cy="497.9" r="3" fill="#8a8880"><title>22 Sep: 1.8% of tokens</title></circle><circle cx="512" cy="497.7" r="3" fill="#8a8880"><title>23 Sep: 1.8% of tokens</title></circle><text x="518" y="501.7" font-size="11" font-weight="600" fill="#c3c2b7">1.8% of tokens</text><text x="68" y="519.5" font-size="11" text-anchor="middle" fill="#c3c2b7">17 Sep</text><text x="142" y="519.5" font-size="11" text-anchor="middle" fill="#c3c2b7">18 Sep</text><text x="216" y="519.5" font-size="11" text-anchor="middle" fill="#c3c2b7">19 Sep</text><text x="290" y="519.5" font-size="11" text-anchor="middle" fill="#c3c2b7">20 Sep</text><text x="364" y="519.5" font-size="11" text-anchor="middle" fill="#c3c2b7">21 Sep</text><text x="438" y="519.5" font-size="11" text-anchor="middle" fill="#c3c2b7">22 Sep</text><text x="512" y="519.5" font-size="11" text-anchor="middle" fill="#c3c2b7">23 Sep</text><line x1="68" y1="505.5" x2="512" y2="505.5" stroke-width="1" stroke="#4a4a46"/><text x="68" y="538" font-size="10.5" fill="#9d9b93">Jev was free on Vercel until 25 Sep, which flatters its share there. Vercel publishes shares, not</text><text x="68" y="552" font-size="10.5" fill="#9d9b93">counts.</text><line x1="24" y1="574" x2="616" y2="574" stroke-width="1" stroke="#2c2c2a"/><text x="24" y="588" font-size="11" fill="#9d9b93">Source: openrouter.ai/typesafe/jev-1.13 and Vercel's AI Gateway leaderboard export (CC BY 4.0), read 24 Sep</text><text x="24" y="602.5" font-size="11" fill="#9d9b93">2026; analysis by Matthew O'Riordan</text><text x="24" y="617.5" font-size="11" fill="#9d9b93">Disclosure: the author is CEO of Ably, a realtime infrastructure company.</text></svg>
