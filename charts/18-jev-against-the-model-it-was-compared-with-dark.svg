<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 646" width="640" height="646" role="img" aria-labeledby="18-wdark-t 18-wdark-d" font-family="Manrope, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="18-wdark-t">Against small models the gap is single digits; against frontier models it is hundreds</title><desc id="18-wdark-d">Every published head-to-head found: how many times cheaper and faster Jev was than the model it was compared with, on the same task 16 comparisons from 12 sources. Blue: against a small model. Grey: against a frontier model.</desc><rect x="0" y="0" width="640" height="646" fill="#1a1a19"/><text x="24" y="44" font-size="20" font-weight="700" fill="#ffffff">Against small models the gap is single digits; against</text><text x="24" y="69" font-size="20" font-weight="700" fill="#ffffff">frontier models it is hundreds</text><text x="24" y="91" font-size="13" fill="#c3c2b7">Every published head-to-head found: how many times cheaper and faster Jev was than the</text><text x="24" y="109" font-size="13" fill="#c3c2b7">model it was compared with, on the same task</text><circle cx="30" cy="133.1" r="4.5" fill="#3987e5"/><text x="44" y="137" font-size="11" fill="#ffffff">cheaper by (against a small model)</text><path d="M252.8 127.1l6 6l-6 6l-6 -6z" fill="#3987e5"/><text x="266.8" y="137" font-size="11" fill="#ffffff">faster by</text><circle cx="338.2" cy="133.1" r="4.5" fill="#8a8880"/><text x="352.2" y="137" font-size="11" fill="#ffffff">against a frontier model</text><line x1="234" y1="157" x2="234" y2="505" stroke-width="1" stroke="#2c2c2a"/><text x="234" y="151" font-size="10" text-anchor="middle" fill="#9d9b93">1x</text><line x1="357.3" y1="157" x2="357.3" y2="505" stroke-width="1" stroke="#2c2c2a"/><text x="357.3" y="151" font-size="10" text-anchor="middle" fill="#9d9b93">10x</text><line x1="480.7" y1="157" x2="480.7" y2="505" stroke-width="1" stroke="#2c2c2a"/><text x="480.7" y="151" font-size="10" text-anchor="middle" fill="#9d9b93">100x</text><line x1="604" y1="157" x2="604" y2="505" stroke-width="1" stroke="#2c2c2a"/><text x="604" y="151" font-size="10" text-anchor="middle" fill="#9d9b93">1000x</text><text x="24" y="172.5" font-size="10.5" font-weight="500" fill="#ffffff">Jev Pong (me) vs Ministral 3B</text><line x1="265" y1="170" x2="289.1" y2="170" stroke-width="1.5" stroke="#2c2c2a"/><circle cx="289.1" cy="170" r="4.5" fill="#3987e5"><title>Jev Pong (me) vs Ministral 3B: 2.8x cheaper</title></circle><path d="M265 165l5 5l-5 5l-5 -5z" fill="#3987e5"><title>Jev Pong (me) vs Ministral 3B: 1.8x faster</title></path><text x="24" y="194.5" font-size="10.5" font-weight="500" fill="#ffffff">Taishi Morinaga vs Gemini 3.5 Flash</text><path d="M296 187l5 5l-5 5l-5 -5z" fill="#3987e5"><title>Taishi Morinaga, Classmethod vs Gemini 3.5 Flash: 3.2x faster</title></path><text x="24" y="216.5" font-size="10.5" font-weight="500" fill="#ffffff">CodeAlive vs gpt-oss-120b</text><line x1="308.3" y1="214" x2="317.4" y2="214" stroke-width="1.5" stroke="#2c2c2a"/><circle cx="308.3" cy="214" r="4.5" fill="#3987e5"><title>CodeAlive vs gpt-oss-120b: 4x cheaper</title></circle><path d="M317.4 209l5 5l-5 5l-5 -5z" fill="#3987e5"><title>CodeAlive vs gpt-oss-120b: 4.7x faster</title></path><text x="24" y="238.5" font-size="10.5" font-weight="500" fill="#ffffff">Jalil Laaraichi vs GPT-5.6 Luna</text><circle cx="321.9" cy="236" r="4.5" fill="#3987e5"><title>Jalil Laaraichi, OpenWork vs GPT-5.6 Luna: 5.2x cheaper</title></circle><text x="24" y="260.5" font-size="10.5" font-weight="500" fill="#ffffff">anessbelbati vs Cohere Rerank 4 Pro</text><line x1="271.1" y1="258" x2="326.1" y2="258" stroke-width="1.5" stroke="#2c2c2a"/><circle cx="326.1" cy="258" r="4.5" fill="#3987e5"><title>anessbelbati, rerank bench vs Cohere Rerank 4 Pro: 5.6x cheaper</title></circle><path d="M271.1 253l5 5l-5 5l-5 -5z" fill="#3987e5"><title>anessbelbati, rerank bench vs Cohere Rerank 4 Pro: 2x faster</title></path><text x="24" y="282.5" font-size="10.5" font-weight="500" fill="#ffffff">Emil Lindfors vs DeepSeek V4.1 Flash</text><line x1="329.6" y1="280" x2="348.2" y2="280" stroke-width="1.5" stroke="#2c2c2a"/><circle cx="329.6" cy="280" r="4.5" fill="#3987e5"><title>Emil Lindfors vs DeepSeek V4.1 Flash: 6x cheaper</title></circle><path d="M348.2 275l5 5l-5 5l-5 -5z" fill="#3987e5"><title>Emil Lindfors vs DeepSeek V4.1 Flash: 8.4x faster</title></path><text x="24" y="304.5" font-size="10.5" font-weight="500" fill="#ffffff">Jon Reed vs Mistral Small 4</text><line x1="319.3" y1="302" x2="349.3" y2="302" stroke-width="1.5" stroke="#2c2c2a"/><circle cx="349.3" cy="302" r="4.5" fill="#3987e5"><title>Jon Reed, Near Here vs Mistral Small 4: 8.6x cheaper</title></circle><path d="M319.3 297l5 5l-5 5l-5 -5z" fill="#3987e5"><title>Jon Reed, Near Here vs Mistral Small 4: 4.9x faster</title></path><text x="24" y="326.5" font-size="10.5" font-weight="500" fill="#ffffff">anpicasso vs a small chat model</text><path d="M356.2 319l5 5l-5 5l-5 -5z" fill="#3987e5"><title>anpicasso, Hermes approvals vs a small chat model: 9.8x faster</title></path><text x="24" y="348.5" font-size="10.5" font-weight="500" fill="#ffffff">Jev Pong (me) vs GPT-5.4 Nano</text><line x1="302.6" y1="346" x2="357.3" y2="346" stroke-width="1.5" stroke="#2c2c2a"/><circle cx="357.3" cy="346" r="4.5" fill="#3987e5"><title>Jev Pong (me) vs GPT-5.4 Nano: 10x cheaper</title></circle><path d="M302.6 341l5 5l-5 5l-5 -5z" fill="#3987e5"><title>Jev Pong (me) vs GPT-5.4 Nano: 3.6x faster</title></path><text x="24" y="370.5" font-size="10.5" font-weight="500" fill="#ffffff">Dan Willoughby vs Claude Haiku 4.5</text><line x1="361.6" y1="368" x2="421.8" y2="368" stroke-width="1.5" stroke="#2c2c2a"/><circle cx="421.8" cy="368" r="4.5" fill="#3987e5"><title>Dan Willoughby, Sniff Test vs Claude Haiku 4.5: 33x cheaper</title></circle><path d="M361.6 363l5 5l-5 5l-5 -5z" fill="#3987e5"><title>Dan Willoughby, Sniff Test vs Claude Haiku 4.5: 11x faster</title></path><text x="24" y="392.5" font-size="10.5" font-weight="500" fill="#ffffff">Jev Pong (me) vs Claude Haiku 4.5</text><line x1="302.1" y1="390" x2="436.7" y2="390" stroke-width="1.5" stroke="#2c2c2a"/><circle cx="436.7" cy="390" r="4.5" fill="#3987e5"><title>Jev Pong (me) vs Claude Haiku 4.5: 44x cheaper</title></circle><path d="M302.1 385l5 5l-5 5l-5 -5z" fill="#3987e5"><title>Jev Pong (me) vs Claude Haiku 4.5: 3.6x faster</title></path><text x="24" y="414.5" font-size="10.5" font-weight="500" fill="#ffffff">Jon Reed vs Gemini 3.5 Flash-Lite</text><line x1="327.8" y1="412" x2="451.5" y2="412" stroke-width="1.5" stroke="#2c2c2a"/><circle cx="451.5" cy="412" r="4.5" fill="#3987e5"><title>Jon Reed, Near Here vs Gemini 3.5 Flash-Lite: 58x cheaper</title></circle><path d="M327.8 407l5 5l-5 5l-5 -5z" fill="#3987e5"><title>Jon Reed, Near Here vs Gemini 3.5 Flash-Lite: 5.8x faster</title></path><text x="24" y="436.5" font-size="10.5" font-weight="500" fill="#ffffff">LangWatch vs Claude Opus 5</text><line x1="346.8" y1="434" x2="479.2" y2="434" stroke-width="1.5" stroke="#2c2c2a"/><circle cx="479.2" cy="434" r="4.5" fill="#8a8880"><title>LangWatch vs Claude Opus 5: 97x cheaper</title></circle><path d="M346.8 429l5 5l-5 5l-5 -5z" fill="#8a8880"><title>LangWatch vs Claude Opus 5: 8.2x faster</title></path><text x="24" y="458.5" font-size="10.5" font-weight="500" fill="#ffffff">awlevin vs Claude Opus 5</text><line x1="374.1" y1="456" x2="505.8" y2="456" stroke-width="1.5" stroke="#2c2c2a"/><circle cx="505.8" cy="456" r="4.5" fill="#8a8880"><title>awlevin, computer use vs Claude Opus 5: 160x cheaper</title></circle><path d="M374.1 451l5 5l-5 5l-5 -5z" fill="#8a8880"><title>awlevin, computer use vs Claude Opus 5: 14x faster</title></path><text x="24" y="480.5" font-size="10.5" font-weight="500" fill="#ffffff">Dan Willoughby vs Claude Opus 5</text><line x1="425.8" y1="478" x2="527.3" y2="478" stroke-width="1.5" stroke="#2c2c2a"/><circle cx="527.3" cy="478" r="4.5" fill="#8a8880"><title>Dan Willoughby, Sniff Test vs Claude Opus 5: 239x cheaper</title></circle><path d="M425.8 473l5 5l-5 5l-5 -5z" fill="#8a8880"><title>Dan Willoughby, Sniff Test vs Claude Opus 5: 36x faster</title></path><text x="24" y="502.5" font-size="10.5" font-weight="500" fill="#ffffff">Dan Shipper vs Claude Fable 5.1</text><line x1="406.9" y1="500" x2="574.8" y2="500" stroke-width="1.5" stroke="#2c2c2a"/><circle cx="574.8" cy="500" r="4.5" fill="#8a8880"><title>Dan Shipper, Every vs Claude Fable 5.1: 580x cheaper</title></circle><path d="M406.9 495l5 5l-5 5l-5 -5z" fill="#8a8880"><title>Dan Shipper, Every vs Claude Fable 5.1: 25x faster</title></path><text x="24" y="529.5" font-size="10.5" fill="#9d9b93">Small: the vendor's small or cheap tier. Each multiple is the comparison model's figure divided by Jev's, as the</text><text x="24" y="543.5" font-size="10.5" fill="#9d9b93">source published it; the table under the chart has the accuracy and the links.</text><line x1="24" y1="565.5" x2="616" y2="565.5" stroke-width="1" stroke="#2c2c2a"/><text x="24" y="579.5" font-size="11" fill="#9d9b93">Source: the linked write-ups (Near Here, Lindfors, Sniff Test, OpenWork, CodeAlive, rerank bench, Classmethod,</text><text x="24" y="594" font-size="11" fill="#9d9b93">Hermes, LangWatch, Every, awlevin) and the Jev Pong runs; TypeSafe's launch post; the feed's claim chips;</text><text x="24" y="608.5" font-size="11" fill="#9d9b93">analysis by Matthew O'Riordan</text><text x="24" y="623.5" font-size="11" fill="#9d9b93">Disclosure: the author is CEO of Ably, a realtime infrastructure company.</text></svg>
