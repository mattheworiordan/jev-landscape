 x="279.5" y="594" font-size="9.5" fill="#0b0b0b">model</text><rect x="359" y="549" width="84.5" height="62" fill="#b7d3f6" rx="3"><title>No decision stated, seconds or slower: 71 posts, 6% of the group</title></rect><text x="367" y="568" font-size="13"><tspan font-weight="700" fill="#0b0b0b">71</tspan><tspan dx="6.1" font-size="10.5" fill="#0b0b0b">6%</tspan></text><text x="367" y="583" font-size="9.5" fill="#0b0b0b">Talk about the</text><text x="367" y="594" font-size="9.5" fill="#0b0b0b">model</text><rect x="453.5" y="549" width="84.5" height="62" fill="#bdbcb2" rx="3"><title>No decision stated, unclear: 1,034 posts, 82% of the group</title></rect><text x="461.5" y="568" font-size="13"><tspan font-weight="700" fill="#0b0b0b">1,034</tspan><tspan dx="6.1" font-size="10.5" fill="#0b0b0b">82%</tspan></text><text x="461.5" y="583" font-size="9.5" fill="#0b0b0b">Talk about the</text><text x="461.5" y="594" font-size="9.5" fill="#0b0b0b">model</text><text x="554" y="568" font-size="12"><tspan font-weight="700" fill="#0b0b0b">1,254</tspan><tspan dx="6.1" font-size="10.5" fill="#52514e">22%</tspan></text><rect x="554" y="576" width="37.6" height="8" fill="#bdbcb2" rx="2"><title>No decision stated: 1,254 posts, 22.4% of all posts</title></rect><text x="24" y="633" font-size="12" font-weight="700" fill="#0b0b0b">All groups</text><text x="192" y="633" font-size="12"><tspan font-weight="700" fill="#0b0b0b">809</tspan><tspan dx="6.1" font-size="10.5" fill="#52514e">14%</tspan></text><text x="279.5" y="633" font-size="12"><tspan font-weight="700" fill="#0b0b0b">1,254</tspan><tspan dx="6.1" font-size="10.5" fill="#52514e">22%</tspan></text><text x="367" y="633" font-size="12"><tspan font-weight="700" fill="#0b0b0b">2,234</tspan><tspan dx="6.1" font-size="10.5" fill="#52514e">40%</tspan></text><text x="461.5" y="633" font-size="12"><tspan font-weight="700" fill="#0b0b0b">1,298</tspan><tspan dx="6.1" font-size="10.5" fill="#52514e">23%</tspan></text><text x="554" y="633" font-size="12" font-weight="700" fill="#0b0b0b">5,595</text><text x="24" y="652.5" font-size="10.5" fill="#52514e">Cells are the labelling model's calls, and how soon a decision is needed is the field the blind audit agrees with least</text><text x="24" y="666.5" font-size="10.5" fill="#52514e">(75% at seven tiers). The audit puts 11.0% of posts under 300 ms (9.5 to 12.5), not the labels' 14.5%, and 91% of</text><text x="24" y="680.5" font-size="10.5" fill="#52514e">those are games (82 to 95): the only two numbers here it confirms.</text><line x1="24" y1="702.5" x2="616" y2="702.5" stroke-width="1" stroke="#e6e5df"/><text x="24" y="716.5" font-size="11" fill="#6f6e69">Source: jev.openchamber.dev, 5,950 posts 16 to 23 Sep 2026 (UTC), classified with Claude Opus 5.5, 1,681</text><text x="24" y="731" font-size="11" fill="#6f6e69">posts audited blind by Grok; analysis by Matthew O'Riordan</text><text x="24" y="746" font-size="11" fill="#6f6e69">Disclosure: the author is CEO of Ably, a realtime infrastructure company.</text></svg>
