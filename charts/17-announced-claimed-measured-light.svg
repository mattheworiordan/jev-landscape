<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 728" width="640" height="728" role="img" aria-labeledby="17-wlight-t 17-wlight-d" font-family="Manrope, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="17-wlight-t">TypeSafe announced 40 to 400x cheaper. The posts claimed 28x. Measured against comparable models, the median is 7.3x.</title><desc id="17-wlight-d">Cost and speed multiples: the launch claim, what the posts claimed, and what the published head-to-heads measured Launch claim 40 to 400x cheaper and 20 to 200x faster against frontier models. Posts: median 28x and 6x. Head-to-heads against small models: cost 2.8x to 58x, median 7.3x; latency 1.8x to 11x, median 4.7x.</desc><rect x="0" y="0" width="640" height="728" fill="#fcfcfb"/><text x="24" y="44" font-size="20" font-weight="700" fill="#0b0b0b">TypeSafe announced 40 to 400x cheaper. The posts</text><text x="24" y="69" font-size="20" font-weight="700" fill="#0b0b0b">claimed 28x. Measured against comparable models, the</text><text x="24" y="94" font-size="20" font-weight="700" fill="#0b0b0b">median is 7.3x.</text><text x="24" y="116" font-size="13" fill="#52514e">Cost and speed multiples: the launch claim, what the posts claimed, and what the published</text><text x="24" y="134" font-size="13" fill="#52514e">head-to-heads measured</text><text x="24" y="164" font-size="12.5" font-weight="700" fill="#0b0b0b">Cheaper by</text><line x1="204" y1="174" x2="204" y2="314" stroke-width="1" stroke="#e6e5df"/><text x="204" y="170" font-size="10" text-anchor="middle" fill="#6f6e69">1x</text><line x1="294.7" y1="174" x2="294.7" y2="314" stroke-width="1" stroke="#e6e5df"/><text x="294.7" y="170" font-size="10" text-anchor="middle" fill="#6f6e69">10x</text><line x1="385.3" y1="174" x2="385.3" y2="314" stroke-width="1" stroke="#e6e5df"/><text x="385.3" y="170" font-size="10" text-anchor="middle" fill="#6f6e69">100x</text><line x1="476" y1="174" x2="476" y2="314" stroke-width="1" stroke="#e6e5df"/><text x="476" y="170" font-size="10" text-anchor="middle" fill="#6f6e69">1000x</text><text x="24" y="194.5" font-size="11.5" font-weight="600" fill="#0b0b0b">TypeSafe, launch post</text><rect x="349.3" y="186" width="90.7" height="10" rx="5" fill="#bdbcb2"><title>TypeSafe, launch post: 40x to 400x</title></rect><text x="447.9" y="195" font-size="11" fill="#52514e">40x to 400x</text><text x="24" y="206.5" font-size="10" fill="#6f6e69">against frontier LLMs</text><text x="24" y="236.5" font-size="11.5" font-weight="600" fill="#0b0b0b">The posts' claims (126</text><text x="24" y="249.5" font-size="11.5" font-weight="600" fill="#0b0b0b">chips)</text><rect x="269.3" y="228" width="116" height="10" rx="5" fill="#86b6ef"><title>The posts' claims (126 chips): 5.3x to 100x, median 28x</title></rect><circle cx="335.2" cy="233" r="4.5" fill="#0b0b0b"><title>median 28x</title></circle><text x="393.3" y="237" font-size="11" fill="#52514e">5.3x to 100x, median 28x</text><text x="24" y="261.5" font-size="10" fill="#6f6e69">middle half and median; mostly against frontier LLMs</text><text x="24" y="291" font-size="11.5" font-weight="600" fill="#0b0b0b">Measured, against a frontier</text><text x="24" y="304" font-size="11.5" font-weight="600" fill="#0b0b0b">model (4)</text><rect x="384.2" y="282.5" width="70.3" height="10" rx="5" fill="#8a8981"><title>Measured, against a frontier model (4): 97x to 580x</title></rect><text x="462.6" y="291.5" font-size="11" fill="#52514e">97x to 580x</text><text x="24" y="331.5" font-size="11.5" font-weight="600" fill="#0b0b0b">Measured, against a small</text><text x="24" y="344.5" font-size="11.5" font-weight="600" fill="#0b0b0b">model (10)</text><rect x="244.5" y="323" width="119.4" height="10" rx="5" fill="#2a78d6"><title>Measured, against a small model (10): 2.8x to 58x, median 7.3x</title></rect><circle cx="282.2" cy="328" r="4.5" fill="#0b0b0b"><title>median 7.3x</title></circle><text x="371.9" y="332" font-size="11" fill="#52514e">2.8x to 58x, median 7.3x</text><text x="24" y="381.5" font-size="12.5" font-weight="700" fill="#0b0b0b">Faster by</text><line x1="204" y1="391.5" x2="204" y2="531.5" stroke-width="1" stroke="#e6e5df"/><text x="204" y="387.5" font-size="10" text-anchor="middle" fill="#6f6e69">1x</text><line x1="294.7" y1="391.5" x2="294.7" y2="531.5" stroke-width="1" stroke="#e6e5df"/><text x="294.7" y="387.5" font-size="10" text-anchor="middle" fill="#6f6e69">10x</text><line x1="385.3" y1="391.5" x2="385.3" y2="531.5" stroke-width="1" stroke="#e6e5df"/><text x="385.3" y="387.5" font-size="10" text-anchor="middle" fill="#6f6e69">100x</text><line x1="476" y1="391.5" x2="476" y2="531.5" stroke-width="1" stroke="#e6e5df"/><text x="476" y="387.5" font-size="10" text-anchor="middle" fill="#6f6e69">1000x</text><text x="24" y="412" font-size="11.5" font-weight="600" fill="#0b0b0b">TypeSafe, launch post</text><rect x="322" y="403.5" width="90.7" height="10" rx="5" fill="#bdbcb2"><title>TypeSafe, launch post: 20x to 200x</title></rect><text x="420.6" y="412.5" font-size="11" fill="#52514e">20x to 200x</text><text x="24" y="424" font-size="10" fill="#6f6e69">against frontier LLMs</text><text x="24" y="454" font-size="11.5" font-weight="600" fill="#0b0b0b">The posts' claims (297</text><text x="24" y="467" font-size="11.5" font-weight="600" fill="#0b0b0b">chips)</text><rect x="231.3" y="445.5" width="81.9" height="10" rx="5" fill="#86b6ef"><title>The posts' claims (297 chips): 2x to 16x, median 6x</title></rect><circle cx="274.6" cy="450.5" r="4.5" fill="#0b0b0b"><title>median 6x</title></circle><text x="321.2" y="454.5" font-size="11" fill="#52514e">2x to 16x, median 6x</text><text x="24" y="479" font-size="10" fill="#6f6e69">middle half and median</text><text x="24" y="508.5" font-size="11.5" font-weight="600" fill="#0b0b0b">Measured, against a frontier</text><text x="24" y="521.5" font-size="11.5" font-weight="600" fill="#0b0b0b">model (4)</text><rect x="286.9" y="500" width="58" height="10" rx="5" fill="#8a8981"><title>Measured, against a frontier model (4): 8.2x to 36x</title></rect><text x="353" y="509" font-size="11" fill="#52514e">8.2x to 36x</text><text x="24" y="549" font-size="11.5" font-weight="600" fill="#0b0b0b">Measured, against a small</text><text x="24" y="562" font-size="11.5" font-weight="600" fill="#0b0b0b">model (11)</text><rect x="226.8" y="540.5" width="71" height="10" rx="5" fill="#2a78d6"><title>Measured, against a small model (11): 1.8x to 11x, median 4.7x</title></rect><circle cx="265.3" cy="545.5" r="4.5" fill="#0b0b0b"><title>median 4.7x</title></circle><text x="305.8" y="549.5" font-size="11" fill="#52514e">1.8x to 11x, median 4.7x</text><text x="24" y="597.5" font-size="10.5" fill="#6f6e69">The launch claim and most chips compare with frontier models; the measured rows are every head-to-head with</text><text x="24" y="611.5" font-size="10.5" fill="#6f6e69">published numbers I could find, listed under the chart. Accuracy is in the table: Jev was at or above the small model</text><text x="24" y="625.5" font-size="10.5" fill="#6f6e69">on most bounded questions.</text><line x1="24" y1="647.5" x2="616" y2="647.5" stroke-width="1" stroke="#e6e5df"/><text x="24" y="661.5" font-size="11" fill="#6f6e69">Source: the linked write-ups (Near Here, Lindfors, Sniff Test, OpenWork, CodeAlive, rerank bench, Classmethod,</text><text x="24" y="676" font-size="11" fill="#6f6e69">Hermes, LangWatch, Every, awlevin) and the Jev Pong runs; TypeSafe's launch post; the feed's claim chips;</text><text x="24" y="690.5" font-size="11" fill="#6f6e69">analysis by Matthew O'Riordan</text><text x="24" y="705.5" font-size="11" fill="#6f6e69">Disclosure: the author is CEO of Ably, a realtime infrastructure company.</text></svg>
