<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 612" width="640" height="612" role="img" aria-labeledby="14-wauto-t 14-wauto-d" font-family="Manrope, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="14-wauto-t">More requests than GPT-5.6 Luna, for an eighth of the money</title><desc id="14-wauto-d">OpenRouter, week to 23 Sep: Jev against GPT-5.6 Luna; then one day's Jev tokens priced on other models Jev 437M requests, 1.39T tokens, $51,763; GPT-5.6 Luna 315M, 8.74T, $415,706. On 23 Sep Jev's 327B prompt tokens cost $13,655.</desc><style>svg{--v-surface:#fcfcfb;--v-ink:#0b0b0b;--v-ink2:#52514e;--v-muted:#6f6e69;--v-grid:#e6e5df;--v-axis:#b9b8ae;--v-accent:#eb6834;--v-blue:#2a78d6;--v-blueLo:#86b6ef;--v-blueHi:#104281;--v-g1:#dcdbd3;--v-g2:#bdbcb2;--v-g3:#8a8981;--v-seq0:#f0efec;--v-seq1:#b7d3f6;--v-seq2:#86b6ef;--v-seq3:#5598e7;--v-seq4:#2a78d6;--v-seq5:#1c5cab;--v-seq6:#104281;--v-sqt1:#0b0b0b;--v-sqt2:#0b0b0b;--v-sqt3:#0b0b0b;--v-sqt4:#ffffff;--v-sqt5:#ffffff;--v-sqt6:#ffffff}@media (prefers-color-scheme: dark){svg{--v-surface:#1a1a19;--v-ink:#ffffff;--v-ink2:#c3c2b7;--v-muted:#9d9b93;--v-grid:#2c2c2a;--v-axis:#4a4a46;--v-accent:#d95926;--v-blue:#3987e5;--v-blueLo:#1c5cab;--v-blueHi:#b7d3f6;--v-g1:#3a3a37;--v-g2:#5a5954;--v-g3:#8a8880;--v-seq0:#242423;--v-seq1:#104281;--v-seq2:#1c5cab;--v-seq3:#2a78d6;--v-seq4:#5598e7;--v-seq5:#86b6ef;--v-seq6:#b7d3f6;--v-sqt1:#ffffff;--v-sqt2:#ffffff;--v-sqt3:#ffffff;--v-sqt4:#0b0b0b;--v-sqt5:#0b0b0b;--v-sqt6:#0b0b0b}}</style><rect x="0" y="0" width="640" height="612" style="fill:var(--v-surface)"/><text x="24" y="44" font-size="20" font-weight="700" style="fill:var(--v-ink)">More requests than GPT-5.6 Luna, for an eighth of the</text><text x="24" y="69" font-size="20" font-weight="700" style="fill:var(--v-ink)">money</text><text x="24" y="91" font-size="13" style="fill:var(--v-ink2)">OpenRouter, week to 23 Sep: Jev against GPT-5.6 Luna; then one day's Jev tokens priced