:var(--v-blueLo)"/><circle cx="183.5" cy="370" r="5" style="fill:var(--v-blue)"><title>GPT-5 Nano: $16,848, 1.2x Jev's bill</title></circle><text x="192.5" y="374" font-size="11" style="fill:var(--v-ink2)">$16.8k · 1.2x</text><text x="148" y="394" font-size="11.5" text-anchor="end" style="fill:var(--v-ink)">Ministral 3B</text><line x1="156" y1="390" x2="218.6" y2="390" stroke-width="2" style="stroke:var(--v-blueLo)"/><circle cx="218.6" cy="390" r="5" style="fill:var(--v-blue)"><title>Ministral 3B: $32,816, 2.4x Jev's bill</title></circle><text x="227.6" y="394" font-size="11" style="fill:var(--v-ink2)">$32.8k · 2.4x</text><text x="148" y="414" font-size="11.5" text-anchor="end" style="fill:var(--v-ink)">Gemini 3.5 Flash-Lite</text><line x1="156" y1="410" x2="278" y2="410" stroke-width="2" style="stroke:var(--v-blueLo)"/><circle cx="278" cy="410" r="5" style="fill:var(--v-blue)"><title>Gemini 3.5 Flash-Lite: $101,211, 7.4x Jev's bill</title></circle><text x="287" y="414" font-size="11" style="fill:var(--v-ink2)">$101k · 7.4x</text><text x="148" y="434" font-size="11.5" text-anchor="end" style="fill:var(--v-ink)">Claude Haiku 4.5</text><line x1="156" y1="430" x2="340.8" y2="430" stroke-width="2" style="stroke:var(--v-blueLo)"/><circle cx="340.8" cy="430" r="5" style="fill:var(--v-blue)"><title>Claude Haiku 4.5: $333,183, 24.4x Jev's bill</title></circle><text x="349.8" y="434" font-size="11" style="fill:var(--v-ink2)">$333k · 24x</text><text x="148" y="454" font-size="11.5" text-anchor="end" style="fill:var(--v-ink)">GPT-5.6 Sol</text><line x1="156" y1="450" x2="377.3" y2="450" stroke-width="2" style="stroke:var(--v-blueLo)"/><circle cx="377.3" cy="450" r="5" style="fill:var(--v-blue)"><title>GPT-5.6 Sol: $666,365, 48.8x Jev's bill</title></circle><text x="386.3" y="454" font-size="11" style="fill:var(--v-ink2)">$666k · 49x</text><text x="148" y="474" font-size="11.5" text-anchor="end" style="fill:var(--v-ink)">Claude Fable 5.1</text><line x1="156" y1="470" x2="462.1" y2="470" stroke-width="2" style="stroke:var(--v-blueLo)"/><circle cx="462.1" cy="470" r="5" style="fill:var(--v-blue)"><title>Claude Fable 5.1: $3,331,826, 244.0x Jev's bill</title></circle><text x="471.1" y="474" font-size="11" style="fill:var(--v-ink2)">$3.3M · 244x</text><text x="156" y="496.5" font-size="10.5" style="fill:var(--v-muted)">Same prompt tokens, plus 10 output tokens a request for the chat models: a floor for</text><text x="156" y="510.5" font-size="10.5" style="fill:var(--v-muted)">models that think before answering. A price comparison only; nobody has run these tasks</text><text x="156" y="524.5" font-size="10.5" style="fill:var(--v-muted)">on those models.</text><line x1="24" y1="546.5" x2="616" y2="546.5" stroke-width="1" style="stroke:var(--v-grid)"/><text x="24" y="560.5" font-size="11" style="fill:var(--v-muted)">Source: openrouter.ai/rankings and the Jev model page, list prices from openrouter.ai/api/v1/models and</text><text x="24" y="575" font-size="11" style="fill:var(--v-muted)">docs.typesafe.ai, read 24 Sep 2026; analysis by Matthew O'Riordan</text><text x="24" y="590" font-size="11" style="fill:var(--v-muted)">Disclosure: the author is CEO of Ably, a realtime infrastructure company.</text></svg>
