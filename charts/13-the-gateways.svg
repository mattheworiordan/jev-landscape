<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" role="img" aria-labeledby="13-wauto-t 13-wauto-d" font-family="Manrope, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="13-wauto-t">Jev became a quarter of Vercel's gateway requests in a week, and 2% of its tokens</title><desc id="13-wauto-d">OpenRouter requests a day, 18 to 23 Sep; Vercel AI Gateway share of all requests and of all tokens, 17 to 23 Sep OpenRouter served 126M Jev requests on 23 Sep. Jev was 25% of Vercel AI Gateway requests and 1.8% of its tokens that day.</desc><style>svg{--v-surface:#fcfcfb;--v-ink:#0b0b0b;--v-ink2:#52514e;--v-muted:#6f6e69;--v-grid:#e6e5df;--v-axis:#b9b8ae;--v-accent:#eb6834;--v-blue:#2a78d6;--v-blueLo:#86b6ef;--v-blueHi:#104281;--v-g1:#dcdbd3;--v-g2:#bdbcb2;--v-g3:#8a8981;--v-seq0:#f0efec;--v-seq1:#b7d3f6;--v-seq2:#86b6ef;--v-seq3:#5598e7;--v-seq4:#2a78d6;--v-seq5:#1c5cab;--v-seq6:#104281;--v-sqt1:#0b0b0b;--v-sqt2:#0b0b0b;--v-sqt3:#0b0b0b;--v-sqt4:#ffffff;--v-sqt5:#ffffff;--v-sqt6:#ffffff}@media (prefers-color-scheme: dark){svg{--v-surface:#1a1a19;--v-ink:#ffffff;--v-ink2:#c3c2b7;--v-muted:#9d9b93;--v-grid:#2c2c2a;--v-axis:#4a4a46;--v-accent:#d95926;--v-blue:#3987e5;--v-blueLo:#1c5cab;--v-blueHi:#b7d3f6;--v-g1:#3a3a37;--v-g2:#5a5954;--v-g3:#8a8880;--v-seq0:#242423;--v-seq1:#104281;--v-seq2:#1c5cab;--v-seq3:#2a78d6;--v-seq4:#5598e7;--v-seq5:#86b6ef;--v-seq6:#b7d3f6;--v-sqt1:#ffffff;--v-sqt2:#ffffff;--v-sqt3:#ffffff;--v-sqt4:#0b0b0b;--v-sqt5:#0b0b0b;--v-sqt6:#0b0b0b}}</style><rect x="0" y="0" width="640" height="640" style="fill:var(--v-surface)"/><text x="24" y="44" font-size="20" font-weight="700" style="fill:var(--v-ink)">Jev became a quarter of Vercel's gateway requests in a</text><text x="24" y="69" font-size="20" font-weight="700" style="fill:var(--v-ink)">week, and 2% of its tokens</text><text x="24" y="91" font-size="13" style="fill:var(--v-ink2)">OpenRouter requests a day, 18 to 23 S