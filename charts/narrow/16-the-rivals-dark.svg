 y="518" font-size="10.5" fill="#9d9b93">All Jev posting fell from 1,027 a day on 19 Sep to 336</text><text x="60" y="532" font-size="10.5" fill="#9d9b93">on 23 Sep, so the rivals took a growing share of a</text><text x="60" y="546" font-size="10.5" fill="#9d9b93">shrinking conversation.</text><line x1="16" y1="572" x2="344" y2="572" stroke-width="1" stroke="#2c2c2a"/><text x="16" y="586" font-size="11" fill="#9d9b93">Source: huggingface.co model search by creation date and</text><text x="16" y="600.5" font-size="11" fill="#9d9b93">jev.openchamber.dev, read 24 Sep 2026; analysis by Matthew</text><text x="16" y="615" font-size="11" fill="#9d9b93">O'Riordan</text><text x="16" y="630" font-size="11" fill="#9d9b93">Disclosure: the author is CEO of Ably, a realtime</text><text x="16" y="644.5" font-size="11" fill="#9d9b93">infrastructure company.</text></svg>
