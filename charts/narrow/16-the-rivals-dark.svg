<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 659" width="360" height="659" role="img" aria-labeledby="16-ndark-t 16-ndark-d" font-family="Manrope, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="16-ndark-t">Twenty rivals in a week, and the rate is still rising</title><desc id="16-ndark-d">New Hugging Face models named jev or laya a day, 17 to 23 Sep; posts in the feed showing a rival model, 16 to 23 Sep. The twenty are listed under the chart. 20 distinct models and endpoints plus 2 benchmarks by 22 Sep. Hugging Face: 1, 8, 17, 42, 57, 68, 77 a day.</desc><rect x="0" y="0" width="360" height="659" fill="#1a1a19"/><text x="16" y="33" font-size="17" font-weight="700" fill="#ffffff">Twenty rivals in a week, and the rate</text><text x="16" y="54" font-size="17" font-weight="700" fill="#ffffff">is still rising</text><text x="16" y="76" font-size="13" fill="#c3c2b7">New Hugging Face models named jev or laya a day,</text><text x="16" y="94" font-size="13" fill="#c3c2b7">17 to 23 Sep; posts in the feed showing a rival</text><text x="16" y="112" font-size="13" fill="#c3c2b7">model, 16 to 23 Sep. The twenty are listed under the</text><text x="16" y="130" font-size="13" fill="#c3c2b7">chart.</text><text x="16" y="160" font-size="12" font-weight="700" fill="#ffffff">Hugging Face: new models named jev or laya, per day</text><line x1="60" y1="282" x2="344" y2="282" stroke-width="1" stroke="#2c2c2a"/><text x="54" y="286" font-size="10.5" text-anchor="end" fill="#9d9b93">0</text><line x1="60" y1="254.5" x2="344" y2="254.5" stroke-width="1" stroke="#2c2c2a"/><text x="54" y="258.5" font-size="10.5" text-anchor="end" fill="#9d9b93">20</text><line x1="60" y1="227" x2="344" y2="227" stroke-width="1" stroke="#2c2c2a"/><text x="54" y="231" font-size="10.5" text-anchor="end" fill="#9d9b93">40</text><line x1="60" y1="199.5" x2="344" y2="199.5" stroke-width="1" stroke="#2c2c2a"/><text x="54" y="203.5" font-size="10.5" text-anch