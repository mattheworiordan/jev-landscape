<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 691" width="360" height="691" role="img" aria-labeledby="14-ndark-t 14-ndark-d" font-family="Manrope, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="14-ndark-t">More requests than GPT-5.6 Luna, for an eighth of the money</title><desc id="14-ndark-d">OpenRouter, week to 23 Sep: Jev against the busiest chat model; then one day's Jev tokens priced on other models Jev 437M requests, 1.39T tokens, $51,763; GPT-5.6 Luna 315M, 8.74T, $415,706. On 23 Sep Jev's 327B prompt tokens cost $13,655.</desc><rect x="0" y="0" width="360" height="691" fill="#1a1a19"/><text x="16" y="33" font-size="17" font-weight="700" fill="#ffffff">More requests than GPT-5.6 Luna, for</text><text x="16" y="54" font-size="17" font-weight="700" fill="#ffffff">an eighth of the money</text><text x="16" y="76" font-size="13" fill="#c3c2b7">OpenRouter, week to 23 Sep: Jev against the</text><text x="16" y="94" font-size="13" fill="#c3c2b7">busiest chat model; then one day's Jev tokens</text><text x="16" y="112" font-size="13" fill="#c3c2b7">priced on other models</text><text x="16" y="142" font-size="12" font-weight="700" fill="#ffffff">Week to 23 Sep on OpenRouter: Jev (blue) against</text><text x="16" y="157" font-size="12" font-weight="700" fill="#ffffff">GPT-5.6 Luna (grey)</text><text x="16" y="183" font-size="12" font-weight="600" fill="#ffffff">Requests</text><text x="16" y="199" font-size="10.5" fill="#9d9b93">Jev is 1.4x</text><path d="M80 171h217a3 3 0 0 1 3 3v5a3 3 0 0 1 -3 3h-217z" fill="#3987e5"><title>Jev: 437M</title></path><text x="306" y="180" font-size="11" font-weight="600" fill="#ffffff">437M</text><path d="M80 185h155.8a3 3 0 0 1 3 3v5a3 3 0 0 1 -3 3h-155.8z" fill="#5a5954"><title>GPT-5.6 Luna: 315M</title></path><text x="244.8" y="194" font-size="11" fill="#c3c2b7">315M</text><text x="16" y="220" font-size="12" font-weight="600" fill="#ffffff">Tokens</text><text x="16" y="236" font-size="10.5" fill="#9d9b93">Jev is 16%</text><path d="M80 208h32a3 3 0 0 1 3 3v5a3 3 0 0 1 -3 3h-32z" fill="#3987e5"><title>Jev: 1.39T</title></path><text x="121" y="217" font-size="11" font-weight="600" fill="#ffffff">1.39T</text><path d="M80 222h217a3 3 0 0 1 3 3v5a3 3 0 0 1 -3 3h-217z" fill="#5a5954"><title>GPT-5.6 Luna: 8.74T</title></path><text x="306" y="231" font-size="11" fill="#c3c2b7">8.74T</text><text x="16" y="257" font-size="12" font-weight="600" fill="#ffffff">Spend</text><text x="16" y="273" font-size="10.5" fill="#9d9b93">Jev is 12%</text><path d="M80 245h24.4a3 3 0 0 1 3 3v5a3 3 0 0 1 -3 3h-24.4z" fill="#3987e5"><title>Jev: $51.8k</title></path><text x="113.4" y="254" font-size="11" font-weight="600" fill="#ffffff">$51.8k</text><path d="M80 259h217a3 3 0 0 1 3 3v5a3 3 0 0 1 -3 3h-217z" fill="#5a5954"><title>GPT-5.6 Luna: $416k</title></path><text x="306" y="268" font-size="11" fill="#c3c2b7">$416k</text><text x="16" y="300" font-size="12" font-weight="700" fill="#ffffff">What 23 Sep's Jev tokens (327B prompt tokens)</text><text x="16" y="315" font-size="12" font-weight="700" fill="#ffffff">would cost on other models, at list price</text><line x1="120" y1="337" x2="120" y2="493" stroke-width="1" stroke="#2c2c2a"/><text x="120" y="331" font-size="10.5" text-anchor="middle" fill="#9d9b93">$10k</text><line x1="170" y1="337" x2="170" y2="493" stroke-width="1" stroke="#2c2c2a"/><text x="170" y="331" font-size="10.5" text-anchor="middle" fill="#9d9b93">$100k</text><line x1="220" y1="337" x2="220" y2="493" stroke-width="1" stroke="#2c2c2a"/><text x="220" y="331" font-size="10.5" text-anchor="middle" fill="#9d9b93">$1M</text><line x1="270" y1="337" x2="270" y2="493" stroke-width="1" stroke="#2c2c2a"/><text x="270" y="331" font-size="10.5" text-anchor="middle" fill="#9d9b93">$10M</text><text x="112" y="349" font-size="10.5" text-anchor="end" fill="#ffffff">DeepSeek V4 Flash</text><line x1="120" y1="345" x2="120.4" y2="345" stroke-width="2" stroke="#1c5cab"/><circle cx="120.4" cy="345" r="5" fill="#3987e5"><title>DeepSeek V4 Flash 0731: $10,209, 0.7x Jev's bill</title></circle><text x="129.4" y="349" font-size="10" fill="#c3c2b7">$10.2k · 0.7x</text><text x="112" y="369" font-size="10.5" font-weight="700" text-anchor="end" fill="#ffffff">Jev</text><line x1="120" y1="365" x2="126.8" y2="365" stroke-width="2" stroke="#d95926"/><circle cx="126.8" cy="365" r="5" fill="#d95926"><title>Jev: $13,655, 1.0x Jev's bill</title></circle><text x="135.8" y="369" font-size="10" font-weight="700" fill="#ffffff">$13.7k · billed</text><text x="112" y="389" font-size="10.5" text-anchor="end" fill="#ffffff">GPT-5 Nano</text><line x1="120" y1="385" x2="131.3" y2="385" stroke-width="2" stroke="#1c5cab"/><circle cx="131.3" cy="385" r="5" fill="#3987e5"><title>GPT-5 Nano: $16,848, 1.2x Jev's bill</title></circle><text x="140.3" y="389" font-size="10" fill="#c3c2b7">$16.8k · 1.2x</text><text x="112" y="409" font-size="10.5" text-anchor="end" fill="#ffffff">Ministral 3B</text><line x1="120" y1="405" x2="145.8" y2="405" stroke-width="2" stroke="#1c5cab"/><circle cx="145.8" cy="405" r="5" fill="#3987e5"><title>Ministral 3B: $32,816, 2.4x Jev's bill</title></circle><text x="154.8" y="409" font-size="10" fill="#c3c2b7">$32.8k · 2.4x</text><text x="112" y="429" font-size="10.5" text-anchor="end" fill="#ffffff">Gemini Flash-Lite</text><line x1="120" y1="425" x2="170.3" y2="425" stroke-width="2" stroke="#1c5cab"/><circle cx="170.3" cy="425" r="5" fill="#3987e5"><title>Gemini 3.5 Flash-Lite: $101,211, 7.4x Jev's bill</title></circle><text x="179.3" y="429" font-size="10" fill="#c3c2b7">$101k · 7.4x</text><text x="112" y="449" font-size="10.5" text-anchor="end" fill="#ffffff">Haiku 4.5</text><line x1="120" y1="445" x2="196.1" y2="445" stroke-width="2" stroke="#1c5cab"/><circle cx="196.1" cy="445" r="5" fill="#3987e5"><title>Claude Haiku 4.5: $333,183, 24.4x Jev's bill</title></circle><text x="205.1" y="449" font-size="10" fill="#c3c2b7">$333k · 24x</text><text x="112" y="469" font-size="10.5" text-anchor="end" fill="#ffffff">GPT-5.6 Sol</text><line x1="120" y1="465" x2="211.2" y2="465" stroke-width="2" stroke="#1c5cab"/><circle cx="211.2" cy="465" r="5" fill="#3987e5"><title>GPT-5.6 Sol: $666,365, 48.8x Jev's bill</title></circle><text x="220.2" y="469" font-size="10" fill="#c3c2b7">$666k · 49x</text><text x="112" y="489" font-size="10.5" text-anchor="end" fill="#ffffff">Fable 5.1</text><line x1="120" y1="485" x2="246.1" y2="485" stroke-width="2" stroke="#1c5cab"/><circle cx="246.1" cy="485" r="5" fill="#3987e5"><title>Claude Fable 5.1: $3,331,826, 244.0x Jev's bill</title></circle><text x="255.1" y="489" font-size="10" fill="#c3c2b7">$3.3M · 244x</text><text x="120" y="511.5" font-size="10.5" fill="#9d9b93">Same prompt tokens, plus 10 output tokens</text><text x="120" y="525.5" font-size="10.5" fill="#9d9b93">a request for the chat models: a floor for</text><text x="120" y="539.5" font-size="10.5" fill="#9d9b93">models that think before answering. A price</text><text x="120" y="553.5" font-size="10.5" fill="#9d9b93">comparison only; nobody has run these</text><text x="120" y="567.5" font-size="10.5" fill="#9d9b93">tasks on those models.</text><line x1="16" y1="589.5" x2="344" y2="589.5" stroke-width="1" stroke="#2c2c2a"/><text x="16" y="603.5" font-size="11" fill="#9d9b93">Source: openrouter.ai/rankings and the Jev model page, list</text><text x="16" y="618" font-size="11" fill="#9d9b93">prices from openrouter.ai/api/v1/models and</text><text x="16" y="632.5" font-size="11" fill="#9d9b93">docs.typesafe.ai, read 24 Sep 2026; analysis by Matthew</text><text x="16" y="647" font-size="11" fill="#9d9b93">O'Riordan</text><text x="16" y="662" font-size="11" fill="#9d9b93">Disclosure: the author is CEO of Ably, a realtime</text><text x="16" y="676.5" font-size="11" fill="#9d9b93">infrastructure company.</text></svg>
