<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 678" width="360" height="678" role="img" aria-labeledby="13-nauto-t 13-nauto-d" font-family="Manrope, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="13-nauto-t">Jev became a quarter of Vercel's gateway requests in a week, and 2% of its tokens</title><desc id="13-nauto-d">OpenRouter requests a day, 18 to 23 Sep; Vercel AI Gateway share of all requests and of all tokens, 17 to 23 Sep OpenRouter served 126M Jev requests on 23 Sep. Jev was 25% of Vercel AI Gateway requests and 1.8% of its tokens that day.</desc><style>svg{--v-surface:#fcfcfb;--v-ink:#0b0b0b;--v-ink2:#52514e;--v-muted:#6f6e69;--v-grid:#e6e5df;--v-axis:#b9b8ae;--v-accent:#eb6834;--v-blue:#2a78d6;--v-blueLo:#86b6ef;--v-blueHi:#104281;--v-g1:#dcdbd3;--v-g2:#bdbcb2;--v-g3:#8a8981;--v-seq0:#f0efec;--v-seq1:#b7d3f6;--v-seq2:#86b6ef;--v-seq3:#5598e7;--v-seq4:#2a78d6;--v-seq5:#1c5cab;--v-seq6:#104281;--v-sqt1:#0b0b0b;--v-sqt2:#0b0b0b;--v-sqt3:#0b0b0b;--v-sqt4:#ffffff;--v-sqt5:#ffffff;--v-sqt6:#ffffff}@media (prefers-color-scheme: dark){svg{--v-surface:#1a1a19;--v-ink:#ffffff;--v-ink2:#c3c2b7;--v-muted:#9d9b93;--v-grid:#2c2c2a;--v-axis:#4a4a46;--v-accent:#d95926;--v-blue:#3987e5;--v-blueLo:#1c5cab;--v-blueHi:#b7d3f6;--v-g1:#3a3a37;--v-g2:#5a5954;--v-g3:#8a8880;--v-seq0:#242423;--v-seq1:#104281;--v-seq2:#1c5cab;--v-seq3:#2a78d6;--v-seq4:#5598e7;--v-seq5:#86b6ef;--v-seq6:#b7d3f6;--v-sqt1:#ffffff;--v-sqt2:#ffffff;--v-sqt3:#ffffff;--v-sqt4:#0b0b0b;--v-sqt5:#0b0b0b;--v-sqt6:#0b0b0b}}</style><rect x="0" y="0" width="360" height="678" style="fill:var(--v-surface)"/><text x="16" y="33" font-size="17" font-weight="700" style="fill:var(--v-ink)">Jev became a quarter of Vercel's</text><text x="16" y="54" font-size="17" font-weight="700" style="fill:var(--v-ink)">gateway requests in a week, and 2%</text><text x="16" y="75" font-size="17" font-weight="700" style="fill:var(--v-ink)">of its tokens</text><text x="16" y="97" font-size="13" style="fill:var(--v-ink2)">OpenRouter requests a day, 18 to 23 Sep; Vercel AI</text><text x="16" y="115" font-size="13" style="fill:var(--v-ink2)">Gateway share of all requests and of all tokens, 17</text><text x="16" y="133" font-size="13" style="fill:var(--v-ink2)">to 23 Sep</text><text x="16" y="163" font-size="12" font-weight="700" style="fill:var(--v-ink)">OpenRouter: Jev requests a day, in millions</text><line x1="60" y1="295" x2="344" y2="295" stroke-width="1" style="stroke:var(--v-grid)"/><text x="54" y="299" font-size="10.5" text-anchor="end" style="fill:var(--v-muted)">0M</text><line x1="60" y1="255" x2="344" y2="255" stroke-width="1" style="stroke:var(--v-grid)"/><text x="54" y="259" font-size="10.5" text-anchor="end" style="fill:var(--v-muted)">50M</text><line x1="60" y1="215" x2="344" y2="215" stroke-width="1" style="stroke:var(--v-grid)"/><text x="54" y="219" font-size="10.5" text-anchor="end" style="fill:var(--v-muted)">100M</text><line x1="60" y1="175" x2="344" y2="175" stroke-width="1" style="stroke:var(--v-grid)"/><text x="54" y="179" font-size="10.5" text-anchor="end" style="fill:var(--v-muted)">150M</text><path d="M60 295v-19.6a3 3 0 0 1 3 -3h36.3a3 3 0 0 1 3 3v19.6z" style="fill:var(--v-blue)"><title>18 Sep: 28M</title></path><text x="81.2" y="267.4" font-size="10" font-weight="600" text-anchor="middle" style="fill:var(--v-ink)">28M</text><text x="81.2" y="309" font-size="10" text-anchor="middle" style="fill:var(--v-ink2)">18 Sep</text><path d="M108.3 295v-39.1a3 3 0 0 1 3 -3h36.3a3 3 0 0 1 3 3v39.1z" style="fill:var(--v-blue)"><title>19 Sep: 53M</title></path><text x="129.5" y="247.9" font-size="10" font-weight="600" text-anchor="middle" style="fill:var(--v-ink)">53M</text><text x="129.5" y="309" font-size="10" text-anchor="middle" style="fill:var(--v-ink2)">19 Sep</text><path d="M156.7 295v-48.5a3 3 0 0 1 3 -3h36.3a3 3 0 0 1 3 3v48.5z" style="fill:var(--v-blue)"><title>20 Sep: 64M</title></path><text x="177.8" y="238.5" fo