e-width="1" style="stroke:var(--v-grid)"/><text x="54" y="475.8" font-size="10.5" text-anchor="end" style="fill:var(--v-muted)">10%</text><line x1="60" y1="435.2" x2="260" y2="435.2" stroke-width="1" style="stroke:var(--v-grid)"/><text x="54" y="439.2" font-size="10.5" text-anchor="end" style="fill:var(--v-muted)">20%</text><line x1="60" y1="398.5" x2="260" y2="398.5" stroke-width="1" style="stroke:var(--v-grid)"/><text x="54" y="402.5" font-size="10.5" text-anchor="end" style="fill:var(--v-muted)">30%</text><path d="M60 486.7L93.3 458.8L126.7 412.1L160 432.2L193.3 430.7L226.7 427.8L260 416" fill="none" stroke-width="2.5" stroke-linejoin="round" style="stroke:var(--v-blue)"/><circle cx="60" cy="486.7" r="3" style="fill:var(--v-blue)"><title>17 Sep: 5.9% of requests</title></circle><circle cx="93.3" cy="458.8" r="3" style="fill:var(--v-blue)"><title>18 Sep: 13.6% of requests</title></circle><circle cx="126.7" cy="412.1" r="3" style="fill:var(--v-blue)"><title>19 Sep: 26.3% of requests</title></circle><circle cx="160" cy="432.2" r="3" style="fill:var(--v-blue)"><title>20 Sep: 20.8% of requests</title></circle><circle cx="193.3" cy="430.7" r="3" style="fill:var(--v-blue)"><title>21 Sep: 21.2% of requests</title></circle><circle cx="226.7" cy="427.8" r="3" style="fill:var(--v-blue)"><title>22 Sep: 22.0% of requests</title></circle><circle cx="260" cy="416" r="3" style="fill:var(--v-blue)"><title>23 Sep: 25.2% of requests</title></circle><text x="266" y="420" font-size="10" font-weight="600" style="fill:var(--v-ink)">25% requests</text><path d="M60 507.3L93.3 505.7L126.7 501.9L160 501.2L193.3 501L226.7 502.1L260 501.9" fill="none" stroke-width="2.5" stroke-linejoin="round" style="stroke:var(--v-g3)"/><circle cx="60" cy="507.3" r="3" style="fill:var(--v-g3)"><title>17 Sep: 0.3% of tokens</title></circle><circle cx="93.3" cy="505.7" r="3" style="fill:var(--v-g3)"><title>18 Sep: 0.8% of tokens</title></circle><circle cx="126.7" cy="501.9" r="3" style="fill:var(--v-g3)"><title>19 Sep: 1.8% of tokens</title></circle><circle cx="160" cy="501.2" r="3" style="fill:var(--v-g3)"><title>20 Sep: 2.0% of tokens</title></circle><circle cx="193.3" cy="501" r="3" style="fill:var(--v-g3)"><title>21 Sep: 2.0% of tokens</title></circle><circle cx="226.7" cy="502.1" r="3" style="fill:var(--v-g3)"><title>22 Sep: 1.8% of tokens</title></circle><circle cx="260" cy="501.9" r="3" style="fill:var(--v-g3)"><title>23 Sep: 1.8% of tokens</title></circle><text x="266" y="505.9" font-size="10" font-weight="600" style="fill:var(--v-ink2)">1.8% tokens</text><text x="60" y="522.5" font-size="10" text-anchor="middle" style="fill:var(--v-ink2)">17 Sep</text><text x="126.7" y="522.5" font-size="10" text-anchor="middle" style="fill:var(--v-ink2)">19 Sep</text><text x="193.3" y="522.5" font-size="10" text-anchor="middle" style="fill:var(--v-ink2)">21 Sep</text><text x="260" y="522.5" font-size="10" text-anchor="middle" style="fill:var(--v-ink2)">23 Sep</text><line x1="60" y1="508.5" x2="260" y2="508.5" stroke-width="1" style="stroke:var(--v-axis)"/><text x="60" y="541" font-size="10.5" style="fill:var(--v-muted)">Jev was free on Vercel until 25 Sep, which</text><text x="60" y="555" font-size="10.5" style="fill:var(--v-muted)">flatters its share there. Vercel publishes</text><text x="60" y="569" font-size="10.5" style="fill:var(--v-muted)">shares, not counts.</text><line x1="16" y1="591" x2="344" y2="591" stroke-width="1" style="stroke:var(--v-grid)"/><text x="16" y="605" font-size="11" style="fill:var(--v-muted)">Source: openrouter.ai/typesafe/jev-1.13 and Vercel's AI</text><text x="16" y="619.5" font-size="11" style="fill:var(--v-muted)">Gateway leaderboard export (CC BY 4.0), read 24 Sep 2026;</text><text x="16" y="634" font-size="11" style="fill:var(--v-muted)">analysis by Matthew O'Riordan</text><text x="16" y="649" font-size="11" style="fill:var(--v-muted)">Disclosure: the author is CEO of Ably, a realtime</text><text x="16" y="663.5" font-size="11" style="fill:var(--v-muted)">infrastructure company.</text></svg>
