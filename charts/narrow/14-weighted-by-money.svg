 style="fill:var(--v-ink)">$13.7k · billed</text><text x="112" y="389" font-size="10.5" text-anchor="end" style="fill:var(--v-ink)">GPT-5 Nano</text><line x1="120" y1="385" x2="131.3" y2="385" stroke-width="2" style="stroke:var(--v-blueLo)"/><circle cx="131.3" cy="385" r="5" style="fill:var(--v-blue)"><title>GPT-5 Nano: $16,848, 1.2x Jev's bill</title></circle><text x="140.3" y="389" font-size="10" style="fill:var(--v-ink2)">$16.8k · 1.2x</text><text x="112" y="409" font-size="10.5" text-anchor="end" style="fill:var(--v-ink)">Ministral 3B</text><line x1="120" y1="405" x2="145.8" y2="405" stroke-width="2" style="stroke:var(--v-blueLo)"/><circle cx="145.8" cy="405" r="5" style="fill:var(--v-blue)"><title>Ministral 3B: $32,816, 2.4x Jev's bill</title></circle><text x="154.8" y="409" font-size="10" style="fill:var(--v-ink2)">$32.8k · 2.4x</text><text x="112" y="429" font-size="10.5" text-anchor="end" style="fill:var(--v-ink)">Gemini Flash-Lite</text><line x1="120" y1="425" x2="170.3" y2="425" stroke-width="2" style="stroke:var(--v-blueLo)"/><circle cx="170.3" cy="425" r="5" style="fill:var(--v-blue)"><title>Gemini 3.5 Flash-Lite: $101,211, 7.4x Jev's bill</title></circle><text x="179.3" y="429" font-size="10" style="fill:var(--v-ink2)">$101k · 7.4x</text><text x="112" y="449" font-size="10.5" text-anchor="end" style="fill:var(--v-ink)">Haiku 4.5</text><line x1="120" y1="445" x2="196.1" y2="445" stroke-width="2" style="stroke:var(--v-blueLo)"/><circle cx="196.1" cy="445" r="5" style="fill:var(--v-blue)"><title>Claude Haiku 4.5: $333,183, 24.4x Jev's bill</title></circle><text x="205.1" y="449" font-size="10" style="fill:var(--v-ink2)">$333k · 24x</text><text x="112" y="469" font-size="10.5" text-anchor="end" style="fill:var(--v-ink)">GPT-5.6 Sol</text><line x1="120" y1="465" x2="211.2" y2="465" stroke-width="2" style="stroke:var(--v-blueLo)"/><circle cx="211.2" cy="465" r="5" style="fill:var(--v-blue)"><title>GPT-5.6 Sol: $666,365, 48.8x Jev's bill</title></circle><text 