 x="22" y="578" font-size="9.5" fill="#0b0b0b">0%</text><rect x="98" y="548" width="79" height="38" fill="#86b6ef" rx="3"><title>No decision stated, under a second: 146 posts, 12% of the group</title></rect><text x="104" y="564" font-size="11.5"><tspan font-weight="700" fill="#0b0b0b">146</tspan></text><text x="104" y="578" font-size="9.5" fill="#0b0b0b">12%</text><rect x="180" y="548" width="79" height="38" fill="#b7d3f6" rx="3"><title>No decision stated, seconds or slower: 71 posts, 6% of the group</title></rect><text x="186" y="564" font-size="11.5"><tspan font-weight="700" fill="#0b0b0b">71</tspan></text><text x="186" y="578" font-size="9.5" fill="#0b0b0b">6%</text><rect x="265" y="548" width="79" height="38" fill="#bdbcb2" rx="3"><title>No decision stated, unclear: 1,034 posts, 82% of the group</title></rect><text x="271" y="564" font-size="11.5"><tspan font-weight="700" fill="#0b0b0b">1,034</tspan></text><text x="271" y="578" font-size="9.5" fill="#0b0b0b">82%</text><text x="16" y="606" font-size="10.5" font-weight="700" fill="#0b0b0b">All groups  5,595</text><text x="22" y="624" font-size="11"><tspan font-weight="700" fill="#0b0b0b">809</tspan><tspan dx="5.5" font-size="9.5" fill="#52514e">14%</tspan></text><text x="104" y="624" font-size="11"><tspan font-weight="700" fill="#0b0b0b">1,254</tspan><tspan dx="5.5" font-size="9.5" fill="#52514e">22%</tspan></text><text x="186" y="624" font-size="11"><tspan font-weight="700" fill="#0b0b0b">2,234</tspan><tspan dx="5.5" font-size="9.5" fill="#52514e">40%</tspan></text><text x="271" y="624" font-size="11"><tspan font-weight="700" fill="#0b0b0b">1,298</tspan><tspan dx="5.5" font-size="9.5" fill="#52514e">23%</tspan></text><text x="16" y="643" font-size="10" fill="#52514e">Cells are the labelling model's calls, and how soon a decision is</text><text x="16" y="656.5" font-size="10" fill="#52514e">needed is the field the blind audit agrees with least (75% at seven</text><text x="16" y="670" font-size="10" fill="#52514e">tiers). The audit puts 11.0% of posts under 300 ms (9.5 to 12.5), not</text><text x="16" y="683.5" font-size="10" fill="#52514e">the labels' 14.5%, and 91% of those are games (82 to 95): the only</text><text x="16" y="697" font-size="10" fill="#52514e">two numbers here it confirms.</text><line x1="16" y1="719" x2="344" y2="719" stroke-width="1" stroke="#e6e5df"/><text x="16" y="733" font-size="11" fill="#6f6e69">Source: jev.openchamber.dev, 5,950 posts 16 to 23 Sep 2026</text><text x="16" y="747.5" font-size="11" fill="#6f6e69">(UTC), classified with Claude Opus 5.5, 1,681 posts audited</text><text x="16" y="762" font-size="11" fill="#6f6e69">blind by Grok; analysis by Matthew O'Riordan</text><text x="16" y="777" font-size="11" fill="#6f6e69">Disclosure: the author is CEO of Ably, a realtime</text><text x="16" y="791.5" font-size="11" fill="#6f6e69">infrastructure company.</text></svg>
