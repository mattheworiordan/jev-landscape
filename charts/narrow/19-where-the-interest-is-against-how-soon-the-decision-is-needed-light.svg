<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 806" width="360" height="806" role="img" aria-labeledby="19-nlight-t 19-nlight-d" font-family="Manrope, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="19-nlight-t">The need for a decision in under 300 ms has one hot spot: games</title><desc id="19-nlight-d">5,595 posts by what the decision is about and how soon it is needed, on the labels. Shade is the number of posts; the audit estimated only the under-300 ms column and its games share. Decisions about data: under 300 ms 4, under a second 540, seconds or slower 1,239, unclear 153. Decisions inside games and control loops: under 300 ms 707, under a second 230, seconds or slower 74, unclear 60. Decisions inside agent loops: under 300 ms 5, under a second 39, seconds or slower 557, unclear 2. Decisions about what a person just said or typed: under 300 ms 84, under a second 255, seconds or slower 99, unclear 25. Decisions about money: under 300 ms 6, under a second 44, seconds or slower 194, unclear 24. No decision stated: under 300 ms 3, under a second 146, seconds or slower 71, unclear 1,034. Audited: 11.0% of posts need under 300 ms (9.5 to 12.5), 91% of them games (82 to 95).</desc><rect x="0" y="0" width="360" height="806" fill="#fcfcfb"/><text x="16" y="33" font-size="17" font-weight="700" fill="#0b0b0b">The need for a decision in under 300</text><text x="16" y="54" font-size="17" font-weight="700" fill="#0b0b0b">ms has one hot spot: games</text><text x="16" y="76" font-size="13" fill="#52514e">5,595 posts by what the decision is about and how</text><text x="16" y="94" font-size="13" fill="#52514e">soon it is needed, on the labels. Shade is the number</text><text x="16" y="112" font-size="13" fill="#52514e">of posts; the audit estimated only the under-300 ms</text><text x="16" y="130" font-size="13" fill="#52514e">column and its games share.</text><rect x="16" y="147.5" width="12" height="12" rx="2" fil