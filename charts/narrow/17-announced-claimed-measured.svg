<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 828" width="360" height="828" role="img" aria-labeledby="17-nauto-t 17-nauto-d" font-family="Manrope, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="17-nauto-t">TypeSafe announced 40 to 400x cheaper. The posts claimed 28x. Measured against comparable models, the median is 7.3x.</title><desc id="17-nauto-d">Cost and speed multiples: the launch claim, what the posts claimed, and what the published head-to-heads measured Launch claim 40 to 400x cheaper and 20 to 200x faster against frontier models. Posts: median 28x and 6x. Head-to-heads against small models: cost 2.8x to 58x, median 7.3x; latency 1.8x to 11x, median 4.7x.</desc><style>svg{--v-surface:#fcfcfb;--v-ink:#0b0b0b;--v-ink2:#52514e;--v-muted:#6f6e69;--v-grid:#e6e5df;--v-axis:#b9b8ae;--v-accent:#eb6834;--v-blue:#2a78d6;--v-blueLo:#86b6ef;--v-blueHi:#104281;--v-g1:#dcdbd3;--v-g2:#bdbcb2;--v-g3:#8a8981;--v-seq0:#f0efec;--v-seq1:#b7d3f6;--v-seq2:#86b6ef;--v-seq3:#5598e7;--v-seq4:#2a78d6;--v-seq5:#1c5cab;--v-seq6:#104281;--v-sqt1:#0b0b0b;--v-sqt2:#0b0b0b;--v-sqt3:#0b0b0b;--v-sqt4:#ffffff;--v-sqt5:#ffffff;--v-sqt6:#ffffff}@media (prefers-color-scheme: dark){svg{--v-surface:#1a1a19;--v-ink:#ffffff;--v-ink2:#c3c2b7;--v-muted:#9d9b93;--v-grid:#2c2c2a;--v-axis:#4a4a46;--v-accent:#d95926;--v-blue:#3987e5;--v-blueLo:#1c5cab;--v-blueHi:#b7d3f6;--v-g1:#3a3a37;--v-g2:#5a5954;--v-g3:#8a8880;--v-seq0:#242423;--v-seq1:#104281;--v-seq2:#1c5cab;--v-seq3:#2a78d6;--v-seq4:#5598e7;--v-seq5:#86b6ef;--v-seq6:#b7d3f6;--v-sqt1:#ffffff;--v-sqt2:#ffffff;--v-sqt3:#ffffff;--v-sqt4:#0b0b0b;--v-sqt5:#0b0b0b;--v-sqt6:#0b0b0b}}</style><rect x="0" y="0" width="360" height="828" style="fill:var(--v-surface)"/><text x="16" y="33" font-size="17" font-weight="700" style="fill:var(--v-ink)">TypeSafe announced 40 to 400x</text><text x="16" y="54" font-size="17" font-weight="700" style="fill:var(--v-ink)">cheaper. The posts claimed 28x.</text><text x="16" y="75" font-size="17" font-weight="700" style="fill:var(--v-ink)">Measured against comparable</text><text x="16" y="96" font-size="17" font-weight="700" style="fill:var(--v-ink)">models, the median is 7.3x.</text><text x="16" y="118" font-size="13" style="fill:var(--v-ink2)">Cost and speed multiples: the launch claim, what</text><text x="16" y="136" font-size="13" style="fill:var(--v-ink2)">the posts claimed, and what the published</text><text x="16" y="154" font-size="13" style="fill:var(--v-ink2)">head-to-heads measured</text><text x="16" y="184" font-size="12" font-weight="700" style="fill:var(--v-ink)">Cheaper by</text><line x1="134" y1="194" x2="134" y2="334" stroke-width="1" style="stroke:var(--v-grid)"/><text x="134" y="190" font-size="10" text-anchor="middle" style="fill:var(--v-muted)">1x</text><line x1="172" y1="194" x2="172" y2="334" stroke-width="1" style="stroke:var(--v-grid)"/><text x="172" y="190" font-size="10" text-anchor="middle" style="fill:var(--v-muted)">10x</text><line x1="210" y1="194" x2="210" y2="334" stroke-width="1" style="stroke:var(--v-grid)"/><text x="210" y="190" font-size="10" text-anchor="middle" style="fill:var(--v-muted)">100x</text><line x1="248" y1="194" x2="248" y2="334" stroke-width="1" style="stroke:var(--v-grid)"/><text x="248" y="190" font-size="10" text-anchor="middle" style="fill:var(--v-muted)">1000x</text><text x="16" y="213.5" font-size="10.5" font-weight="600" style="fill:var(--v-ink)">TypeSafe, launch</text><text x="16" y="226.5" font-size="10.5" font-weight="600" style="fill:var(--v-ink)">post</text><rect x="194.9" y="206" width="38" height="10" rx="5" style="fill:var(--v-g2)"><title>TypeSafe, launch post: 40x to 400x</title></rect><text x="240.9" y="215" font-size="10" style="fill:var(--v-ink2)">40x to 400x</text><text x="16" y="238.5" font-size="10" style="fill:var(--v-muted)">against frontier LLMs</text><text x="16" y="267" font-size="10.5" font-weight="600" style="fill:var(--v-ink)">The posts' claims</text><text x="16" y="280" font-size="10.5" font-weight="600" style="fill:var(--v-ink)">(126 chips)</text><rect x="161.4" y="259.5" width="48.6" height="10" rx="5" style="fill:var(--v-blueLo)"><title>The posts' claims (126 chips): 5.3x to 100x, median 28x</title></rect><circle cx="189" cy="264.5" r="4.5" style="fill:var(--v-ink)"><title>median 28x</title></circle><text x="218" y="268.5" font-size="10" style="fill:var(--v-ink2)">5.3x to 100x, median 28x</text><text x="16" y="292" font-size="10" style="fill:var(--v-muted)">middle half and median; mostly against frontier LLMs</text><text x="16" y="320.5" font-size="10.5" font-weight="600" style="fill:var(--v-ink)">Measured, against a</text><text x="16" y="333.5" font-size="10.5" font-weight="600" style="fill:var(--v-ink)">frontier model (4)</text><rect x="209.5" y="313" width="29.5" height="10" rx="5" style="fill:var(--v-g3)"><title>Measured, against a frontier model (4): 97x to 580x</title></rect><text x="247" y="322" font-size="10" style="fill:var(--v-ink2)">97x to 580x</text><text x="16" y="360" font-size="10.5" font-weight="600" style="fill:var(--v-ink)">Measured, against a</text><text x="16" y="373" font-size="10.5" font-weight="600" style="fill:var(--v-ink)">small model (10)</text><rect x="151" y="352.5" width="50" height="10" rx="5" style="fill:var(--v-blue)"><title>Measured, against a small model (10): 2.8x to 58x, median 7.3x</title></rect><circle cx="166.8" cy="357.5" r="4.5" style="fill:var(--v-ink)"><title>median 7.3x</title></circle><text x="209" y="361.5" font-size="10" style="fill:var(--v-ink2)">2.8x to 58x, median 7.3x</text><text x="16" y="410" font-size="12" font-weight="700" style="fill:var(--v-ink)">Faster by</text><line x1="134" y1="420" x2="134" y2="560" stroke-width="1" style="stroke:var(--v-grid)"/><text x="134" y="416" font-size="10" text-anchor="middle" style="fill:var(--v-muted)">1x</text><line x1="172" y1="420" x2="172" y2="560" stroke-width="1" style="stroke:var(--v-grid)"/><text x="172" y="416" font-size="10" text-anchor="middle" style="fill:var(--v-muted)">10x</text><line x1="210" y1="420" x2="210" y2="560" stroke-width="1" style="stroke:var(--v-grid)"/><text x="210" y="416" font-size="10" text-anchor="middle" style="fill:var(--v-muted)">100x</text><line x1="248" y1="420" x2="248" y2="560" stroke-width="1" style="stroke:var(--v-grid)"/><text x="248" y="416" font-size="10" text-anchor="middle" style="fill:var(--v-muted)">1000x</text><text x="16" y="439.5" font-size="10.5" font-weight="600" style="fill:var(--v-ink)">TypeSafe, launch</text><text x="16" y="452.5" font-size="10.5" font-weight="600" style="fill:var(--v-ink)">post</text><rect x="183.4" y="432" width="38" height="10" rx="5" style="fill:var(--v-g2)"><title>TypeSafe, launch post: 20x to 200x</title></rect><text x="229.4" y="441" font-size="10" style="fill:var(--v-ink2)">20x to 200x</text><text x="16" y="464.5" font-size="10" style="fill:var(--v-muted)">against frontier LLMs</text><text x="16" y="493" font-size="10.5" font-weight="600" style="fill:var(--v-ink)">The posts' claims</text><text x="16" y="506" font-size="10.5" font-weight="600" style="fill:var(--v-ink)">(297 chips)</text><rect x="145.4" y="485.5" width="34.3" height="10" rx="5" style="fill:var(--v-blueLo)"><title>The posts' claims (297 chips): 2x to 16x, median 6x</title></rect><circle cx="163.6" cy="490.5" r="4.5" style="fill:var(--v-ink)"><title>median 6x</title></circle><text x="187.8" y="494.5" font-size="10" style="fill:var(--v-ink2)">2x to 16x, median 6x</text><text x="16" y="518" font-size="10" style="fill:var(--v-muted)">middle half and median</text><text x="16" y="546.5" font-size="10.5" font-weight="600" style="fill:var(--v-ink)">Measured, against a</text><text x="16" y="559.5" font-size="10.5" font-weight="600" style="fill:var(--v-ink)">frontier model (4)</text><rect x="168.8" y="539" width="24.3" height="10" rx="5" style="fill:var(--v-g3)"><title>Measured, against a frontier model (4): 8.2x to 36x</title></rect><text x="201.1" y="548" font-size="10" style="fill:var(--v-ink2)">8.2x to 36x</text><text x="16" y="586" font-size="10.5" font-weight="600" style="fill:var(--v-ink)">Measured, against a</text><text x="16" y="599" font-size="10.5" font-weight="600" style="fill:var(--v-ink)">small model (11)</text><rect x="143.6" y="578.5" width="29.8" height="10" rx="5" style="fill:var(--v-blue)"><title>Measured, against a small model (11): 1.8x to 11x, median 4.7x</title></rect><circle cx="159.7" cy="583.5" r="4.5" style="fill:var(--v-ink)"><title>median 4.7x</title></circle><text x="181.3" y="587.5" font-size="10" style="fill:var(--v-ink2)">1.8x to 11x, median 4.7x</text><text x="16" y="634.5" font-size="10.5" style="fill:var(--v-muted)">The launch claim and most chips compare with frontier models;</text><text x="16" y="648.5" font-size="10.5" style="fill:var(--v-muted)">the measured rows are every head-to-head with published</text><text x="16" y="662.5" font-size="10.5" style="fill:var(--v-muted)">numbers I could find, listed under the chart. Accuracy is in the</text><text x="16" y="676.5" font-size="10.5" style="fill:var(--v-muted)">table: Jev was at or above the small model on most bounded</text><text x="16" y="690.5" font-size="10.5" style="fill:var(--v-muted)">questions.</text><line x1="16" y1="712.5" x2="344" y2="712.5" stroke-width="1" style="stroke:var(--v-grid)"/><text x="16" y="726.5" font-size="11" style="fill:var(--v-muted)">Source: the linked write-ups (Near Here, Lindfors, Sniff Test,</text><text x="16" y="741" font-size="11" style="fill:var(--v-muted)">OpenWork, CodeAlive, rerank bench, Classmethod, Hermes,</text><text x="16" y="755.5" font-size="11" style="fill:var(--v-muted)">LangWatch, Every, awlevin) and the Jev Pong runs;</text><text x="16" y="770" font-size="11" style="fill:var(--v-muted)">TypeSafe's launch post; the feed's claim chips; analysis by</text><text x="16" y="784.5" font-size="11" style="fill:var(--v-muted)">Matthew O'Riordan</text><text x="16" y="799.5" font-size="11" style="fill:var(--v-muted)">Disclosure: the author is CEO of Ably, a realtime</text><text x="16" y="814" font-size="11" style="fill:var(--v-muted)">infrastructure company.</text></svg>
