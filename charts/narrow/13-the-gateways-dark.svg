<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 678" width="360" height="678" role="img" aria-labeledby="13-ndark-t 13-ndark-d" font-family="Manrope, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="13-ndark-t">Jev became a quarter of Vercel's gateway requests in a week, and 2% of its tokens</title><desc id="13-ndark-d">OpenRouter requests a day, 18 to 23 Sep; Vercel AI Gateway share of all requests and of all tokens, 17 to 23 Sep OpenRouter served 126M Jev requests on 23 Sep. Jev was 25% of Vercel AI Gateway requests and 1.8% of its tokens that day.</desc><rect x="0" y="0" width="360" height="678" fill="#1a1a19"/><text x="16" y="33" font-size="17" font-weight="700" fill="#ffffff">Jev became a quarter of Vercel's</text><text x="16" y="54" font-size="17" font-weight="700" fill="#ffffff">gateway requests in a week, and 2%</text><text x="16" y="75" font-size="17" font-weight="700" fill="#ffffff">of its tokens</text><text x="16" y="97" font-size="13" fill="#c3c2b7">OpenRouter requests a day, 18 to 23 Sep; Vercel AI</text><text x="16" y="115" font-size="13" fill="#c3c2b7">Gateway share of all requests and of all tokens, 17</text><text x="16" y="133" font-size="13" fill="#c3c2b7">to 23 Sep</text><text x="16" y="163" font-size="12" font-weight="700" fill="#ffffff">OpenRouter: Jev requests a day, in millions</text><line x1="60" y1="295" x2="344" y2="295" stroke-width="1" stroke="#2c2c2a"/><text x="54" y="299" font-size="10.5" text-anchor="end" fill="#9d9b93">0M</text><line x1="60" y1="255" x2="344" y2="255" stroke-width="1" stroke="#2c2c2a"/><text x="54" y="259" font-size="10.5" text-anchor="end" fill="#9d9b93">50M</text><line x1="60" y1="215" x2="344" y2="215" stroke-width="1" stroke="#2c2c2a"/><text x="54" y="219" font-size="10.5" text-anchor="end" fill="#9d9b93">100M</text><line x1="60" y1="175" x2="344" y2="175" stroke-width="1" stroke="#2c2c2a"/><text x="54" y="179" font-size="10.5" text-anchor="end" fill="#9d9b93">150M</text><path d="M60 295v-19.6a3 3 0 0 1 3 -3h36.3a3 3 0 0 1 3 3v19.6z" fill="#3987e5"><title>18 Sep: 28M</title></path><text x="81.2" y="267.4" font-size="10" font-weight="600" text-anchor="middle" fill="#ffffff">28M</text><text x="81.2" y="309" font-size="10" text-anchor="middle" fill="#c3c2b7">18 Sep</text><path d="M108.3 295v-39.1a3 3 0 0 1 3 -3h36.3a3 3 0 0 1 3 3v39.1z" fill="#3987e5"><title>19 Sep: 53M</title></path><text x="129.5" y="247.9" font-size="10" font-weight="600" text-anchor="middle" fill="#ffffff">53M</text><text x="129.5" y="309" font-size="10" text-anchor="middle" fill="#c3c2b7">19 Sep</text><path d="M156.7 295v-48.5a3 3 0 0 1 3 -3h36.3a3 3 0 0 1 3 3v48.5z" fill="#3987e5"><title>20 Sep: 64M</title></path><text x="177.8" y="238.5" font-size="10" font-weight="600" text-anchor="middle" fill="#ffffff">64M</text><text x="177.8" y="309" font-size="10" text-anchor="middle" fill="#c3c2b7">20 Sep</text><path d="M205 295v-62.9a3 3 0 0 1 3 -3h36.3a3 3 0 0 1 3 3v62.9z" fill="#3987e5"><title>21 Sep: 82M</title></path><text x="226.2" y="224.1" font-size="10" font-weight="600" text-anchor="middle" fill="#ffffff">82M</text><text x="226.2" y="309" font-size="10" text-anchor="middle" fill="#c3c2b7">21 Sep</text><path d="M253.3 295v-63.9a3 3 0 0 1 3 -3h36.3a3 3 0 0 1 3 3v63.9z" fill="#3987e5"><title>22 Sep: 84M</title></path><text x="274.5" y="223.1" font-size="10" font-weight="600" text-anchor="middle" fill="#ffffff">84M</text><text x="274.5" y="309" font-size="10" text-anchor="middle" fill="#c3c2b7">22 Sep</text><path d="M301.7 295v-97.5a3 3 0 0 1 3 -3h36.3a3 3 0 0 1 3 3v97.5z" fill="#3987e5"><title>23 Sep: 126M</title></path><text x="322.8" y="189.5" font-size="10" font-weight="600" text-anchor="middle" fill="#ffffff">126M</text><text x="322.8" y="309" font-size="10" text-anchor="middle" fill="#c3c2b7">23 Sep</text><line x1="60" y1="295" x2="344" y2="295" stroke-width="1" stroke="#4a4a46"/><text x="60" y="327.5" font-size="10.5" fill="#9d9b93">Requests are API calls, not decisions; one call can carry</text><text x="60" y="341.5" font-size="10.5" fill="#9d9b93">several questions.</text><text x="16" y="371.5" font-size="12" font-weight="700" fill="#ffffff">Vercel AI Gateway: Jev's share of requests and of</text><text x="16" y="386.5" font-size="12" font-weight="700" fill="#ffffff">tokens</text><line x1="60" y1="508.5" x2="260" y2="508.5" stroke-width="1" stroke="#2c2c2a"/><text x="54" y="512.5" font-size="10.5" text-anchor="end" fill="#9d9b93">0%</text><line x1="60" y1="471.8" x2="260" y2="471.8" stroke-width="1" stroke="#2c2c2a"/><text x="54" y="475.8" font-size="10.5" text-anchor="end" fill="#9d9b93">10%</text><line x1="60" y1="435.2" x2="260" y2="435.2" stroke-width="1" stroke="#2c2c2a"/><text x="54" y="439.2" font-size="10.5" text-anchor="end" fill="#9d9b93">20%</text><line x1="60" y1="398.5" x2="260" y2="398.5" stroke-width="1" stroke="#2c2c2a"/><text x="54" y="402.5" font-size="10.5" text-anchor="end" fill="#9d9b93">30%</text><path d="M60 486.7L93.3 458.8L126.7 412.1L160 432.2L193.3 430.7L226.7 427.8L260 416" fill="none" stroke-width="2.5" stroke-linejoin="round" stroke="#3987e5"/><circle cx="60" cy="486.7" r="3" fill="#3987e5"><title>17 Sep: 5.9% of requests</title></circle><circle cx="93.3" cy="458.8" r="3" fill="#3987e5"><title>18 Sep: 13.6% of requests</title></circle><circle cx="126.7" cy="412.1" r="3" fill="#3987e5"><title>19 Sep: 26.3% of requests</title></circle><circle cx="160" cy="432.2" r="3" fill="#3987e5"><title>20 Sep: 20.8% of requests</title></circle><circle cx="193.3" cy="430.7" r="3" fill="#3987e5"><title>21 Sep: 21.2% of requests</title></circle><circle cx="226.7" cy="427.8" r="3" fill="#3987e5"><title>22 Sep: 22.0% of requests</title></circle><circle cx="260" cy="416" r="3" fill="#3987e5"><title>23 Sep: 25.2% of requests</title></circle><text x="266" y="420" font-size="10" font-weight="600" fill="#ffffff">25% requests</text><path d="M60 507.3L93.3 505.7L126.7 501.9L160 501.2L193.3 501L226.7 502.1L260 501.9" fill="none" stroke-width="2.5" stroke-linejoin="round" stroke="#8a8880"/><circle cx="60" cy="507.3" r="3" fill="#8a8880"><title>17 Sep: 0.3% of tokens</title></circle><circle cx="93.3" cy="505.7" r="3" fill="#8a8880"><title>18 Sep: 0.8% of tokens</title></circle><circle cx="126.7" cy="501.9" r="3" fill="#8a8880"><title>19 Sep: 1.8% of tokens</title></circle><circle cx="160" cy="501.2" r="3" fill="#8a8880"><title>20 Sep: 2.0% of tokens</title></circle><circle cx="193.3" cy="501" r="3" fill="#8a8880"><title>21 Sep: 2.0% of tokens</title></circle><circle cx="226.7" cy="502.1" r="3" fill="#8a8880"><title>22 Sep: 1.8% of tokens</title></circle><circle cx="260" cy="501.9" r="3" fill="#8a8880"><title>23 Sep: 1.8% of tokens</title></circle><text x="266" y="505.9" font-size="10" font-weight="600" fill="#c3c2b7">1.8% tokens</text><text x="60" y="522.5" font-size="10" text-anchor="middle" fill="#c3c2b7">17 Sep</text><text x="126.7" y="522.5" font-size="10" text-anchor="middle" fill="#c3c2b7">19 Sep</text><text x="193.3" y="522.5" font-size="10" text-anchor="middle" fill="#c3c2b7">21 Sep</text><text x="260" y="522.5" font-size="10" text-anchor="middle" fill="#c3c2b7">23 Sep</text><line x1="60" y1="508.5" x2="260" y2="508.5" stroke-width="1" stroke="#4a4a46"/><text x="60" y="541" font-size="10.5" fill="#9d9b93">Jev was free on Vercel until 25 Sep, which</text><text x="60" y="555" font-size="10.5" fill="#9d9b93">flatters its share there. Vercel publishes</text><text x="60" y="569" font-size="10.5" fill="#9d9b93">shares, not counts.</text><line x1="16" y1="591" x2="344" y2="591" stroke-width="1" stroke="#2c2c2a"/><text x="16" y="605" font-size="11" fill="#9d9b93">Source: openrouter.ai/typesafe/jev-1.13 and Vercel's AI</text><text x="16" y="619.5" font-size="11" fill="#9d9b93">Gateway leaderboard export (CC BY 4.0), read 24 Sep 2026;</text><text x="16" y="634" font-size="11" fill="#9d9b93">analysis by Matthew O'Riordan</text><text x="16" y="649" font-size="11" fill="#9d9b93">Disclosure: the author is CEO of Ably, a realtime</text><text x="16" y="663.5" font-size="11" fill="#9d9b93">infrastructure company.</text></svg>
