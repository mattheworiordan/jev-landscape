1.5" font-size="10.5" style="fill:var(--v-muted)">Small: the vendor's small or cheap tier. Each multiple is the</text><text x="16" y="775.5" font-size="10.5" style="fill:var(--v-muted)">comparison model's figure divided by Jev's, as the source</text><text x="16" y="789.5" font-size="10.5" style="fill:var(--v-muted)">published it; the table under the chart has the accuracy and the</text><text x="16" y="803.5" font-size="10.5" style="fill:var(--v-muted)">links.</text><line x1="16" y1="825.5" x2="344" y2="825.5" stroke-width="1" style="stroke:var(--v-grid)"/><text x="16" y="839.5" font-size="11" style="fill:var(--v-muted)">Source: the linked write-ups (Near Here, Lindfors, Sniff Test,</text><text x="16" y="854" font-size="11" style="fill:var(--v-muted)">OpenWork, CodeAlive, rerank bench, Classmethod, Hermes,</text><text x="16" y="868.5" font-size="11" style="fill:var(--v-muted)">LangWatch, Every, awlevin) and the Jev Pong runs;</text><text x="16" y="883" font-size="11" style="fill:var(--v-muted)">TypeSafe's launch post; the feed's claim chips; analysis by</text><text x="16" y="897.5" font-size="11" style="fill:var(--v-muted)">Matthew O'Riordan</text><text x="16" y="912.5" font-size="11" style="fill:var(--v-muted)">Disclosure: the author is CEO of Ably, a realtime</text><text x="16" y="927" font-size="11" style="fill:var(--v-muted)">infrastructure company.</text></svg>
