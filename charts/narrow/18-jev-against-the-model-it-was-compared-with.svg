<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 962" width="360" height="962" role="img" aria-labeledby="18-nauto-t 18-nauto-d" font-family="Manrope, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="18-nauto-t">Against small models the median gap is 7.3x on cost and 4.7x on latency; against frontier models it is 100x and more</title><desc id="18-nauto-d">Every published head-to-head found: how many times cheaper and faster Jev was than the model it was compared with, on the same task 16 comparisons from 12 sources. Blue: against a small model. Grey: against a frontier model.</desc><style>svg{--v-surface:#fcfcfb;--v-ink:#0b0b0b;--v-ink2:#52514e;--v-muted:#6f6e69;--v-grid:#e6e5df;--v-axis:#b9b8ae;--v-accent:#eb6834;--v-blue:#2a78d6;--v-blueLo:#86b6ef;--v-blueHi:#104281;--v-g1:#dcdbd3;--v-g2:#bdbcb2;--v-g3:#8a8981;--v-seq0:#f0efec;--v-seq1:#b7d3f6;--v-seq2:#86b6ef;--v-seq3:#5598e7;--v-seq4:#2a78d6;--v-seq5:#1c5cab;--v-seq6:#104281;--v-sqt1:#0b0b0b;--v-sqt2:#0b0b0b;--v-sqt3:#0b0b0b;--v-sqt4:#ffffff;--v-sqt5:#ffffff;--v-sqt6:#ffffff}@media (prefers-color-scheme: dark){svg{--v-surface:#1a1a19;--v-ink:#ffffff;--v-ink2:#c3c2b7;--v-muted:#9d9b93;--v-grid:#2c2c2a;--v-axis:#4a4a46;--v-accent:#d95926;--v-blue:#3987e5;--v-blueLo:#1c5cab;--v-blueHi:#b7d3f6;--v-g1:#3a3a37;--v-g2:#5a5954;--v-g3:#8a8880;--v-seq0:#242423;--v-seq1:#104281;--v-seq2:#1c5cab;--v-seq3:#2a78d6;--v-seq4:#5598e7;--v-seq5:#86b6ef;--v-seq6:#b7d3f6;--v-sqt1:#ffffff;--v-sqt2:#ffffff;--v-sqt3:#ffffff;--v-sqt4:#0b0b0b;--v-sqt5:#0b0b0b;--v-sqt6:#0b0b0b}}</style><rect x="0" y="0" width="360" height="962" style="fill:var(--v-surface)"/><text x="16" y="33" font-size="17" font-weight="700" style="fill:var(--v-ink)">Against small models the median gap</text><text x="16" y="54" font-size="17" font-weight="700" style="fill:var(--v-ink)">is 7.3x on cost and 4.7x on latency;</text><text x="16" y="75" font-size="17" font-weight="700" style="fill:var(--v-ink)">agai