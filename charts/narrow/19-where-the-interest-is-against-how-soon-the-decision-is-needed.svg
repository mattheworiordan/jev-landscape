<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 806" width="360" height="806" role="img" aria-labeledby="19-nauto-t 19-nauto-d" font-family="Manrope, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="19-nauto-t">The need for a decision in under 300 ms has one hot spot: games</title><desc id="19-nauto-d">5,595 posts by what the decision is about and how soon it is needed, on the labels. Shade is the number of posts; the audit estimated only the under-300 ms column and its games share. Decisions about data: under 300 ms 4, under a second 540, seconds or slower 1,239, unclear 153. Decisions inside games and control loops: under 300 ms 707, under a second 230, seconds or slower 74, unclear 60. Decisions inside agent loops: under 300 ms 5, under a second 39, seconds or slower 557, unclear 2. Decisions about what a person just said or typed: under 300 ms 84, under a second 255, seconds or slower 99, unclear 25. Decisions about money: under 300 ms 6, under a second 44, seconds or slower 194, unclear 24. No decision stated: under 300 ms 3, under a second 146, seconds or slower 71, unclear 1,034. Audited: 11.0% of posts need under 300 ms (9.5 to 12.5), 91% of them games (82 to 95).</desc><style>svg{--v-surface:#fcfcfb;--v-ink:#0b0b0b;--v-ink2:#52514e;--v-muted:#6f6e69;--v-grid:#e6e5df;--v-axis:#b9b8ae;--v-accent:#eb6834;--v-blue:#2a78d6;--v-blueLo:#86b6ef;--v-blueHi:#104281;--v-g1:#dcdbd3;--v-g2:#bdbcb2;--v-g3:#8a8981;--v-seq0:#f0efec;--v-seq1:#b7d3f6;--v-seq2:#86b6ef;--v-seq3:#5598e7;--v-seq4:#2a78d6;--v-seq5:#1c5cab;--v-seq6:#104281;--v-sqt1:#0b0b0b;--v-sqt2:#0b0b0b;--v-sqt3:#0b0b0b;--v-sqt4:#ffffff;--v-sqt5:#ffffff;--v-sqt6:#ffffff}@media (prefers-color-scheme: dark){svg{--v-surface:#1a1a19;--v-ink:#ffffff;--v-ink2:#c3c2b7;--v-muted:#9d9b93;--v-grid:#2c2c2a;--v-axis:#4a4a46;--v-accent:#d95926;--v-blue:#3987e5;--v-blueLo:#1c5cab;--v-blueHi:#b7d3f6;--v-g1:#3a3a37;--v-g2:#5a5954;--v-g3:#8a8880;--v-seq0:#242423;--v-