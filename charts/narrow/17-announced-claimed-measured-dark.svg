<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 828" width="360" height="828" role="img" aria-labeledby="17-ndark-t 17-ndark-d" font-family="Manrope, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="17-ndark-t">TypeSafe announced 40 to 400x cheaper. The posts claimed 28x. Measured against comparable models, the median is 7.3x.</title><desc id="17-ndark-d">Cost and speed multiples: the launch claim, what the posts claimed, and what the published head-to-heads measured Launch claim 40 to 400x cheaper and 20 to 200x faster against frontier models. Posts: median 28x and 6x. Head-to-heads against small models: cost 2.8x to 58x, median 7.3x; latency 1.8x to 11x, median 4.7x.</desc><rect x="0" y="0" width="360" height="828" fill="#1a1a19"/><text x="16" y="33" font-size="17" font-weight="700" fill="#ffffff">TypeSafe announced 40 to 400x</text><text x="16" y="54" font-size="17" font-weight="700" fill="#ffffff">cheaper. The posts claimed 28x.</text><text x="16" y="75" font-size="17" font-weight="700" fill="#ffffff">Measured against comparable</text><text x="16" y="96" font-size="17" font-weight="700" fill="#ffffff">models, the median is 7.3x.</text><text x="16" y="118" font-size="13" fill="#c3c2b7">Cost and speed multiples: the launch claim, what</text><text x="16" y="136" font-size="13" fill="#c3c2b7">the posts claimed, and what the published</text><text x="16" y="154" font-size="13" fill="#c3c2b7">head-to-heads measured</text><text x="16" y="184" font-size="12" font-weight="700" fill="#ffffff">Cheaper by</text><line x1="134" y1="194" x2="134" y2="334" stroke-width="1" stroke="#2c2c2a"/><text x="134" y="190" font-size="10" text-anchor="middle" fill="#9d9b93">1x</text><line x1="172" y1="194" x2="172" y2="334" stroke-width="1" stroke="#2c2c2a"/><text x="172" y="190" font-size="10" text-anchor="middle" fill="#9d9b93">10x</text><line x1="210" y1="194" x2="210" y2="334" stroke-width="1" stroke="#2c2c2a"/><text x="210" y="190" font-size="10" text-anchor="middle" fill="#9d9b93">100x</text><line x1="248" y1="194" x2="248" y2="334" stroke-width="1" stroke="#2c2c2a"/><text x="248" y="190" font-size="10" text-anchor="middle" fill="#9d9b93">1000x</text><text x="16" y="213.5" font-size="10.5" font-weight="600" fill="#ffffff">TypeSafe, launch</text><text x="16" y="226.5" font-size="10.5" font-weight="600" fill="#ffffff">post</text><rect x="194.9" y="206" width="38" height="10" rx="5" fill="#5a5954"><title>TypeSafe, launch post: 40x to 400x</title></rect><text x="240.9" y="215" font-size="10" fill="#c3c2b7">40x to 400x</text><text x="16" y="238.5" font-size="10" fill="#9d9b93">against frontier LLMs</text><text x="16" y="267" font-size="10.5" font-weight="600" fill="#ffffff">The posts' claims</text><text x="16" y="280" font-size="10.5" font-weight="600" fill="#ffffff">(126 chips)</text><rect x="161.4" y="259.5" width="48.6" height="10" rx="5" fill="#1c5cab"><title>The posts' claims (126 chips): 5.3x to 100x, median 28x</title></rect><circle cx="189" cy="264.5" r="4.5" fill="#ffffff"><title>median 28x</title></circle><text x="218" y="268.5" font-size="10" fill="#c3c2b7">5.3x to 100x, median 28x</text><text x="16" y="292" font-size="10" fill="#9d9b93">middle half and median; mostly against frontier LLMs</text><text x="16" y="320.5" font-size="10.5" font-weight="600" fill="#ffffff">Measured, against a</text><text x="16" y="333.5" font-size="10.5" font-weight="600" fill="#ffffff">frontier model (4)</text><rect x="209.5" y="313" width="29.5" height="10" rx="5" fill="#8a8880"><title>Measured, against a frontier model (4): 97x to 580x</title></rect><text x="247" y="322" font-size="10" fill="#c3c2b7">97x to 580x</text><text x="16" y="360" font-size="10.5" font-weight="600" fill="#ffffff">Measured, against a</text><text x="16" y="373" font-size="10.5" font-weight="600" fill="#ffffff">small model (10)</text><rect x="151" y="352.5" width="50" height="10" rx="5" fill="#3987e5"><title>Measured, against a small model (10): 2.8x to 58x, median 7.3x</title></rect><circle cx="166.8" cy="357.5" r="4.5" fill="#ffffff"><title>median 7.3x</title></circle><text x="209" y="361.5" font-size="10" fill="#c3c2b7">2.8x to 58x, median 7.3x</text><text x="16" y="410" font-size="12" font-weight="700" fill="#ffffff">Faster by</text><line x1="134" y1="420" x2="134" y2="560" stroke-width="1" stroke="#2c2c2a"/><text x="134" y="416" font-size="10" text-anchor="middle" fill="#9d9b93">1x</text><line x1="172" y1="420" x2="172" y2="560" stroke-width="1" stroke="#2c2c2a"/><text x="172" y="416" font-size="10" text-anchor="middle" fill="#9d9b93">10x</text><line x1="210" y1="420" x2="210" y2="560" stroke-width="1" stroke="#2c2c2a"/><text x="210" y="416" font-size="10" text-anchor="middle" fill="#9d9b93">100x</text><line x1="248" y1="420" x2="248" y2="560" stroke-width="1" stroke="#2c2c2a"/><text x="248" y="416" font-size="10" text-anchor="middle" fill="#9d9b93">1000x</text><text x="16" y="439.5" font-size="10.5" font-weight="600" fill="#ffffff">TypeSafe, launch</text><text x="16" y="452.5" font-size="10.5" font-weight="600" fill="#ffffff">post</text><rect x="183.4" y="432" width="38" height="10" rx="5" fill="#5a5954"><title>TypeSafe, launch post: 20x to 200x</title></rect><text x="229.4" y="441" font-size="10" fill="#c3c2b7">20x to 200x</text><text x="16" y="464.5" font-size="10" fill="#9d9b93">against frontier LLMs</text><text x="16" y="493" font-size="10.5" font-weight="600" fill="#ffffff">The posts' claims</text><text x="16" y="506" font-size="10.5" font-weight="600" fill="#ffffff">(297 chips)</text><rect x="145.4" y="485.5" width="34.3" height="10" rx="5" fill="#1c5cab"><title>The posts' claims (297 chips): 2x to 16x, median 6x</title></rect><circle cx="163.6" cy="490.5" r="4.5" fill="#ffffff"><title>median 6x</title></circle><text x="187.8" y="494.5" font-size="10" fill="#c3c2b7">2x to 16x, median 6x</text><text x="16" y="518" font-size="10" fill="#9d9b93">middle half and median</text><text x="16" y="546.5" font-size="10.5" font-weight="600" fill="#ffffff">Measured, against a</text><text x="16" y="559.5" font-size="10.5" font-weight="600" fill="#ffffff">frontier model (4)</text><rect x="168.8" y="539" width="24.3" height="10" rx="5" fill="#8a8880"><title>Measured, against a frontier model (4): 8.2x to 36x</title></rect><text x="201.1" y="548" font-size="10" fill="#c3c2b7">8.2x to 36x</text><text x="16" y="586" font-size="10.5" font-weight="600" fill="#ffffff">Measured, against a</text><text x="16" y="599" font-size="10.5" font-weight="600" fill="#ffffff">small model (11)</text><rect x="143.6" y="578.5" width="29.8" height="10" rx="5" fill="#3987e5"><title>Measured, against a small model (11): 1.8x to 11x, median 4.7x</title></rect><circle cx="159.7" cy="583.5" r="4.5" fill="#ffffff"><title>median 4.7x</title></circle><text x="181.3" y="587.5" font-size="10" fill="#c3c2b7">1.8x to 11x, median 4.7x</text><text x="16" y="634.5" font-size="10.5" fill="#9d9b93">The launch claim and most chips compare with frontier models;</text><text x="16" y="648.5" font-size="10.5" fill="#9d9b93">the measured rows are every head-to-head with published</text><text x="16" y="662.5" font-size="10.5" fill="#9d9b93">numbers I could find, listed under the chart. Accuracy is in the</text><text x="16" y="676.5" font-size="10.5" fill="#9d9b93">table: Jev was at or above the small model on most bounded</text><text x="16" y="690.5" font-size="10.5" fill="#9d9b93">questions.</text><line x1="16" y1="712.5" x2="344" y2="712.5" stroke-width="1" stroke="#2c2c2a"/><text x="16" y="726.5" font-size="11" fill="#9d9b93">Source: the linked write-ups (Near Here, Lindfors, Sniff Test,</text><text x="16" y="741" font-size="11" fill="#9d9b93">OpenWork, CodeAlive, rerank bench, Classmethod, Hermes,</text><text x="16" y="755.5" font-size="11" fill="#9d9b93">LangWatch, Every, awlevin) and the Jev Pong runs;</text><text x="16" y="770" font-size="11" fill="#9d9b93">TypeSafe's launch post; the feed's claim chips; analysis by</text><text x="16" y="784.5" font-size="11" fill="#9d9b93">Matthew O'Riordan</text><text x="16" y="799.5" font-size="11" fill="#9d9b93">Disclosure: the author is CEO of Ably, a realtime</text><text x="16" y="814" font-size="11" fill="#9d9b93">infrastructure company.</text></svg>
