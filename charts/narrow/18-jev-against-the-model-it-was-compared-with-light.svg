<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 962" width="360" height="962" role="img" aria-labeledby="18-nlight-t 18-nlight-d" font-family="Manrope, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="18-nlight-t">Against small models the median gap is 7.3x on cost and 4.7x on latency; against frontier models it is 100x and more</title><desc id="18-nlight-d">Every published head-to-head found: how many times cheaper and faster Jev was than the model it was compared with, on the same task 16 comparisons from 12 sources. Blue: against a small model. Grey: against a frontier model.</desc><rect x="0" y="0" width="360" height="962" fill="#fcfcfb"/><text x="16" y="33" font-size="17" font-weight="700" fill="#0b0b0b">Against small models the median gap</text><text x="16" y="54" font-size="17" font-weight="700" fill="#0b0b0b">is 7.3x on cost and 4.7x on latency;</text><text x="16" y="75" font-size="17" font-weight="700" fill="#0b0b0b">against frontier models it is 100x and</text><text x="16" y="96" font-size="17" font-weight="700" fill="#0b0b0b">more</text><text x="16" y="118" font-size="13" fill="#52514e">Every published head-to-head found: how many</text><text x="16" y="136" font-size="13" fill="#52514e">times cheaper and faster Jev was than the model it</text><text x="16" y="154" font-size="13" fill="#52514e">was compared with, on the same task</text><circle cx="22" cy="178.1" r="4.5" fill="#2a78d6"/><text x="36" y="182" font-size="11" fill="#0b0b0b">cheaper by (against a small model)</text><path d="M244.8 172.1l6 6l-6 6l-6 -6z" fill="#2a78d6"/><text x="258.8" y="182" font-size="11" fill="#0b0b0b">faster by</text><circle cx="22" cy="198.1" r="4.5" fill="#8a8981"/><text x="36" y="202" font-size="11" fill="#0b0b0b">against a frontier model</text><line x1="144" y1="222" x2="144" y2="758" stroke-width="1" stroke="#e6e5df"/><text x="144" y="216" font-size="10" text-anchor="middle" fill="#6f6e69">1x</text><line x1="206.7" y1="222" x2="206.7" y2="758" stroke-width="1" stroke="#e6e5df"/><text x="206.7" y="216" font-size="10" text-anchor="middle" fill="#6f6e69">10x</text><line x1="269.3" y1="222" x2="269.3" y2="758" stroke-width="1" stroke="#e6e5df"/><text x="269.3" y="216" font-size="10" text-anchor="middle" fill="#6f6e69">100x</text><line x1="332" y1="222" x2="332" y2="758" stroke-width="1" stroke="#e6e5df"/><text x="332" y="216" font-size="10" text-anchor="middle" fill="#6f6e69">1000x</text><text x="16" y="236.5" font-size="9.5" font-weight="500" fill="#0b0b0b">Jev Pong (me) vs</text><text x="16" y="248.5" font-size="9.5" font-weight="500" fill="#0b0b0b">Ministral 3B</text><line x1="159.8" y1="241" x2="172" y2="241" stroke-width="1.5" stroke="#e6e5df"/><circle cx="172" cy="241" r="4.5" fill="#2a78d6"><title>Jev Pong (me) vs Ministral 3B: 2.8x cheaper</title></circle><path d="M159.8 236l5 5l-5 5l-5 -5z" fill="#2a78d6"><title>Jev Pong (me) vs Ministral 3B: 1.8x faster</title></path><text x="16" y="270.5" font-size="9.5" font-weight="500" fill="#0b0b0b">Taishi Morinaga vs</text><text x="16" y="282.5" font-size="9.5" font-weight="500" fill="#0b0b0b">Gemini 3.5 Flash</text><path d="M175.5 270l5 5l-5 5l-5 -5z" fill="#2a78d6"><title>Taishi Morinaga, Classmethod vs Gemini 3.5 Flash: 3.2x faster</title></path><text x="16" y="304.5" font-size="9.5" font-weight="500" fill="#0b0b0b">CodeAlive vs</text><text x="16" y="316.5" font-size="9.5" font-weight="500" fill="#0b0b0b">gpt-oss-120b</text><line x1="181.7" y1="309" x2="186.4" y2="309" stroke-width="1.5" stroke="#e6e5df"/><circle cx="181.7" cy="309" r="4.5" fill="#2a78d6"><title>CodeAlive vs gpt-oss-120b: 4x cheaper</title></circle><path d="M186.4 304l5 5l-5 5l-5 -5z" fill="#2a78d6"><title>CodeAlive vs gpt-oss-120b: 4.7x faster</title></path><text x="16" y="338.5" font-size="9.5" font-weight="500" fill="#0b0b0b">Jalil Laaraichi vs</text><text x="16" y="350.5" font-size="9.5" font-weight="500" fill="#0b0b0b">GPT-5.6 Luna</text><circle cx="188.7" cy="343" r="4.5" fill="#2a78d6"><title>Jalil Laaraichi, OpenWork vs GPT-5.6 Luna: 5.2x cheaper</title></circle><text x="16" y="372.5" font-size="9.5" font-weight="500" fill="#0b0b0b">anessbelbati vs Cohere</text><text x="16" y="384.5" font-size="9.5" font-weight="500" fill="#0b0b0b">Rerank 4 Pro</text><line x1="162.9" y1="377" x2="190.8" y2="377" stroke-width="1.5" stroke="#e6e5df"/><circle cx="190.8" cy="377" r="4.5" fill="#2a78d6"><title>anessbelbati, rerank bench vs Cohere Rerank 4 Pro: 5.6x cheaper</title></circle><path d="M162.9 372l5 5l-5 5l-5 -5z" fill="#2a78d6"><title>anessbelbati, rerank bench vs Cohere Rerank 4 Pro: 2x faster</title></path><text x="16" y="406.5" font-size="9.5" font-weight="500" fill="#0b0b0b">Emil Lindfors vs</text><text x="16" y="418.5" font-size="9.5" font-weight="500" fill="#0b0b0b">DeepSeek V4.1 Flash</text><line x1="192.6" y1="411" x2="202" y2="411" stroke-width="1.5" stroke="#e6e5df"/><circle cx="192.6" cy="411" r="4.5" fill="#2a78d6"><title>Emil Lindfors vs DeepSeek V4.1 Flash: 6x cheaper</title></circle><path d="M202 406l5 5l-5 5l-5 -5z" fill="#2a78d6"><title>Emil Lindfors vs DeepSeek V4.1 Flash: 8.4x faster</title></path><text x="16" y="440.5" font-size="9.5" font-weight="500" fill="#0b0b0b">Jon Reed vs Mistral</text><text x="16" y="452.5" font-size="9.5" font-weight="500" fill="#0b0b0b">Small 4</text><line x1="187.3" y1="445" x2="202.6" y2="445" stroke-width="1.5" stroke="#e6e5df"/><circle cx="202.6" cy="445" r="4.5" fill="#2a78d6"><title>Jon Reed, Near Here vs Mistral Small 4: 8.6x cheaper</title></circle><path d="M187.3 440l5 5l-5 5l-5 -5z" fill="#2a78d6"><title>Jon Reed, Near Here vs Mistral Small 4: 4.9x faster</title></path><text x="16" y="474.5" font-size="9.5" font-weight="500" fill="#0b0b0b">anpicasso vs a small</text><text x="16" y="486.5" font-size="9.5" font-weight="500" fill="#0b0b0b">chat model</text><path d="M206.1 474l5 5l-5 5l-5 -5z" fill="#2a78d6"><title>anpicasso, Hermes approvals vs a small chat model: 9.8x faster</title></path><text x="16" y="508.5" font-size="9.5" font-weight="500" fill="#0b0b0b">Jev Pong (me) vs</text><text x="16" y="520.5" font-size="9.5" font-weight="500" fill="#0b0b0b">GPT-5.4 Nano</text><line x1="178.9" y1="513" x2="206.7" y2="513" stroke-width="1.5" stroke="#e6e5df"/><circle cx="206.7" cy="513" r="4.5" fill="#2a78d6"><title>Jev Pong (me) vs GPT-5.4 Nano: 10x cheaper</title></circle><path d="M178.9 508l5 5l-5 5l-5 -5z" fill="#2a78d6"><title>Jev Pong (me) vs GPT-5.4 Nano: 3.6x faster</title></path><text x="16" y="542.5" font-size="9.5" font-weight="500" fill="#0b0b0b">Dan Willoughby vs Claude</text><text x="16" y="554.5" font-size="9.5" font-weight="500" fill="#0b0b0b">Haiku 4.5</text><line x1="208.8" y1="547" x2="239.4" y2="547" stroke-width="1.5" stroke="#e6e5df"/><circle cx="239.4" cy="547" r="4.5" fill="#2a78d6"><title>Dan Willoughby, Sniff Test vs Claude Haiku 4.5: 33x cheaper</title></circle><path d="M208.8 542l5 5l-5 5l-5 -5z" fill="#2a78d6"><title>Dan Willoughby, Sniff Test vs Claude Haiku 4.5: 11x faster</title></path><text x="16" y="576.5" font-size="9.5" font-weight="500" fill="#0b0b0b">Jev Pong (me) vs Claude</text><text x="16" y="588.5" font-size="9.5" font-weight="500" fill="#0b0b0b">Haiku 4.5</text><line x1="178.6" y1="581" x2="247" y2="581" stroke-width="1.5" stroke="#e6e5df"/><circle cx="247" cy="581" r="4.5" fill="#2a78d6"><title>Jev Pong (me) vs Claude Haiku 4.5: 44x cheaper</title></circle><path d="M178.6 576l5 5l-5 5l-5 -5z" fill="#2a78d6"><title>Jev Pong (me) vs Claude Haiku 4.5: 3.6x faster</title></path><text x="16" y="610.5" font-size="9.5" font-weight="500" fill="#0b0b0b">Jon Reed vs Gemini 3.5</text><text x="16" y="622.5" font-size="9.5" font-weight="500" fill="#0b0b0b">Flash-Lite</text><line x1="191.7" y1="615" x2="254.5" y2="615" stroke-width="1.5" stroke="#e6e5df"/><circle cx="254.5" cy="615" r="4.5" fill="#2a78d6"><title>Jon Reed, Near Here vs Gemini 3.5 Flash-Lite: 58x cheaper</title></circle><path d="M191.7 610l5 5l-5 5l-5 -5z" fill="#2a78d6"><title>Jon Reed, Near Here vs Gemini 3.5 Flash-Lite: 5.8x faster</title></path><text x="16" y="644.5" font-size="9.5" font-weight="500" fill="#0b0b0b">LangWatch vs Claude</text><text x="16" y="656.5" font-size="9.5" font-weight="500" fill="#0b0b0b">Opus 5</text><line x1="201.3" y1="649" x2="268.6" y2="649" stroke-width="1.5" stroke="#e6e5df"/><circle cx="268.6" cy="649" r="4.5" fill="#8a8981"><title>LangWatch vs Claude Opus 5: 97x cheaper</title></circle><path d="M201.3 644l5 5l-5 5l-5 -5z" fill="#8a8981"><title>LangWatch vs Claude Opus 5: 8.2x faster</title></path><text x="16" y="678.5" font-size="9.5" font-weight="500" fill="#0b0b0b">awlevin vs Claude Opus 5</text><line x1="215.2" y1="681" x2="282.1" y2="681" stroke-width="1.5" stroke="#e6e5df"/><circle cx="282.1" cy="681" r="4.5" fill="#8a8981"><title>awlevin, computer use vs Claude Opus 5: 160x cheaper</title></circle><path d="M215.2 676l5 5l-5 5l-5 -5z" fill="#8a8981"><title>awlevin, computer use vs Claude Opus 5: 14x faster</title></path><text x="16" y="708.5" font-size="9.5" font-weight="500" fill="#0b0b0b">Dan Willoughby vs Claude</text><text x="16" y="720.5" font-size="9.5" font-weight="500" fill="#0b0b0b">Opus 5</text><line x1="241.4" y1="713" x2="293" y2="713" stroke-width="1.5" stroke="#e6e5df"/><circle cx="293" cy="713" r="4.5" fill="#8a8981"><title>Dan Willoughby, Sniff Test vs Claude Opus 5: 239x cheaper</title></circle><path d="M241.4 708l5 5l-5 5l-5 -5z" fill="#8a8981"><title>Dan Willoughby, Sniff Test vs Claude Opus 5: 36x faster</title></path><text x="16" y="742.5" font-size="9.5" font-weight="500" fill="#0b0b0b">Dan Shipper vs Claude</text><text x="16" y="754.5" font-size="9.5" font-weight="500" fill="#0b0b0b">Fable 5.1</text><line x1="231.9" y1="747" x2="317.2" y2="747" stroke-width="1.5" stroke="#e6e5df"/><circle cx="317.2" cy="747" r="4.5" fill="#8a8981"><title>Dan Shipper, Every vs Claude Fable 5.1: 580x cheaper</title></circle><path d="M231.9 742l5 5l-5 5l-5 -5z" fill="#8a8981"><title>Dan Shipper, Every vs Claude Fable 5.1: 25x faster</title></path><text x="16" y="782.5" font-size="10.5" fill="#6f6e69">Small: the vendor's small or cheap tier. Each multiple is the</text><text x="16" y="796.5" font-size="10.5" fill="#6f6e69">comparison model's figure divided by Jev's, as the source</text><text x="16" y="810.5" font-size="10.5" fill="#6f6e69">published it; the table under the chart has the accuracy and the</text><text x="16" y="824.5" font-size="10.5" fill="#6f6e69">links.</text><line x1="16" y1="846.5" x2="344" y2="846.5" stroke-width="1" stroke="#e6e5df"/><text x="16" y="860.5" font-size="11" fill="#6f6e69">Source: the linked write-ups (Near Here, Lindfors, Sniff Test,</text><text x="16" y="875" font-size="11" fill="#6f6e69">OpenWork, CodeAlive, rerank bench, Classmethod, Hermes,</text><text x="16" y="889.5" font-size="11" fill="#6f6e69">LangWatch, Every, awlevin) and the Jev Pong runs;</text><text x="16" y="904" font-size="11" fill="#6f6e69">TypeSafe's launch post; the feed's claim chips; analysis by</text><text x="16" y="918.5" font-size="11" fill="#6f6e69">Matthew O'Riordan</text><text x="16" y="933.5" font-size="11" fill="#6f6e69">Disclosure: the author is CEO of Ably, a realtime</text><text x="16" y="948" font-size="11" fill="#6f6e69">infrastructure company.</text></svg>
