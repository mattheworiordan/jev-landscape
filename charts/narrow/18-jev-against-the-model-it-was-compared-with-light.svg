<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 941" width="360" height="941" role="img" aria-labeledby="18-nlight-t 18-nlight-d" font-family="Manrope, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="18-nlight-t">Against small models the gap is single digits; against frontier models it is hundreds</title><desc id="18-nlight-d">Every published head-to-head found: how many times cheaper and faster Jev was than the model it was compared with, on the same task 16 comparisons from 12 sources. Blue: against a small model. Grey: against a frontier model.</desc><rect x="0" y="0" width="360" height="941" fill="#fcfcfb"/><text x="16" y="33" font-size="17" font-weight="700" fill="#0b0b0b">Against small models the gap is</text><text x="16" y="54" font-size="17" font-weight="700" fill="#0b0b0b">single digits; against frontier models</text><text x="16" y="75" font-size="17" font-weight="700" fill="#0b0b0b">it is hundreds</text><text x="16" y="97" font-size="13" fill="#52514e">Every published head-to-head found: how many</text><text x="16" y="115" font-size="13" fill="#52514e">times cheaper and faster Jev was than the model it</text><text x="16" y="133" font-size="13" fill="#52514e">was compared with, on the same task</text><circle cx="22" cy="157.1" r="4.5" fill="#2a78d6"/><text x="36" y="161" font-size="11" fill="#0b0b0b">cheaper by (against a small model)</text><path d="M244.8 151.1l6 6l-6 6l-6 -6z" fill="#2a78d6"/><text x="258.8" y="161" font-size="11" fill="#0b0b0b">faster by</text><circle cx="22" cy="177.1" r="4.5" fill="#8a8981"/><text x="36" y="181" font-size="11" fill="#0b0b0b">against a frontier model</text><line x1="144" y1="201" x2="144" y2="737" stroke-width="1" stroke="#e6e5df"/><text x="144" y="195" font-size="10" text-anchor="middle" fill="#6f6e69">1x</text><line x1="206.7" y1="201" x2="206.7" y2="737" stroke-width="1" stroke="#e6e5df"/><text x="206.7" y="195" font-size="10" text-anchor="middle" fill="#6f6e69">10x</text><line x1="269.3" y1="201" x2="269.3" y2="737" stroke-width="1" stroke="#e6e5df"/><text x="269.3" y="195" font-size="10" text-anchor="middle" fill="#6f6e69">100x</text><line x1="332" y1="201" x2="332" y2="737" stroke-width="1" stroke="#e6e5df"/><text x="332" y="195" font-size="10" text-anchor="middle" fill="#6f6e69">1000x</text><text x="16" y="215.5" font-size="9.5" font-weight="500" fill="#0b0b0b">Jev Pong (me) vs</text><text x="16" y="227.5" font-size="9.5" font-weight="500" fill="#0b0b0b">Ministral 3B</text><line x1="159.8" y1="220" x2="172" y2="220" stroke-width="1.5" stroke="#e6e5df"/><circle cx="172" cy="220" r="4.5" fill="#2a78d6"><title>Jev Pong (me) vs Ministral 3B: 2.8x cheaper</title></circle><path d="M159.8 215l5 5l-5 5l-5 -5z" fill="#2a78d6"><title>Jev Pong (me) vs Ministral 3B: 1.8x faster</title></path><text x="16" y="249.5" font-size="9.5" font-weight="500" fill="#0b0b0b">Taishi Morinaga vs</text><text x="16" y="261.5" font-size="9.5" font-weight="500" fill="#0b0b0b">Gemini 3.5 Flash</text><path d="M175.5 249l5 5l-5 5l-5 -5z" fill="#2a78d6"><title>Taishi Morinaga, Classmethod vs Gemini 3.5 Flash: 3.2x faster</title></path><text x="16" y="283.5" font-size="9.5" font-weight="500" fill="#0b0b0b">CodeAlive vs</text><text x="16" y="295.5" font-size="9.5" font-weight="500" fill="#0b0b0b">gpt-oss-120b</text><line x1="181.7" y1="288" x2="186.4" y2="288" stroke-width="1.5" stroke="#e6e5df"/><circle cx="181.7" cy="288" r="4.5" fill="#2a78d6"><title>CodeAlive vs gpt-oss-120b: 4x cheaper</title></circle><path d="M186.4 283l5 5l-5 5l-5 -5z" fill="#2a78d6"><title>CodeAlive vs gpt-oss-120b: 4.7x faster</title></path><text x="16" y="317.5" font-size="9.5" font-weight="500" fill="#0b0b0b">Jalil Laaraichi vs</text><text x="16" y="329.5" font-size="9.5" font-weight="500" fill="#0b0b0b">GPT-5.6 Luna</text><circle cx="188.7" cy="322" r="4.5" fill="#2a78d6"><title>Jalil Laaraichi, OpenWork vs GPT-5.6 Luna: 5.2x cheaper</title></circle><text x="16" y="351.5" font-size="9.5" font-weight="500" fill="#0b0b0b">anessbelbati vs Cohere</text><text x="16" y="363.5" font-size="9.5" font-weight="500" fill="#0b0b0b">Rerank 4 Pro</text><line x1="162.9" y1="356" x2="190.8" y2="356" stroke-width="1.5" stroke="#e6e5df"/><circle cx="190.8" cy="356" r="4.5" fill="#2a78d6"><title>anessbelbati, rerank bench vs Cohere Rerank 4 Pro: 5.6x cheaper</title></circle><path d="M162.9 351l5 5l-5 5l-5 -5z" fill="#2a78d6"><title>anessbelbati, rerank bench vs Cohere Rerank 4 Pro: 2x faster</title></path><text x="16" y="385.5" font-size="9.5" font-weight="500" fill="#0b0b0b">Emil Lindfors vs</text><text x="16" y="397.5" font-size="9.5" font-weight="500" fill="#0b0b0b">DeepSeek V4.1 Flash</text><line x1="192.6" y1="390" x2="202" y2="390" stroke-width="1.5" stroke="#e6e5df"/><circle cx="192.6" cy="390" r="4.5" fill="#2a78d6"><title>Emil Lindfors vs DeepSeek V4.1 Flash: 6x cheaper</title></circle><path d="M202 385l5 5l-5 5l-5 -5z" fill="#2a78d6"><title>Emil Lindfors vs DeepSeek V4.1 Flash: 8.4x faster</title></path><text x="16" y="419.5" font-size="9.5" font-weight="500" fill="#0b0b0b">Jon Reed vs Mistral</text><text x="16" y="431.5" font-size="9.5" font-weight="500" fill="#0b0b0b">Small 4</text><line x1="187.3" y1="424" x2="202.6" y2="424" stroke-width="1.5" stroke="#e6e5df"/><circle cx="202.6" cy="424" r="4.5" fill="#2a78d6"><title>Jon Reed, Near Here vs Mistral Small 4: 8.6x cheaper</title></circle><path d="M187.3 419l5 5l-5 5l-5 -5z" fill="#2a78d6"><title>Jon Reed, Near Here vs Mistral Small 4: 4.9x faster</title></path><text x="16" y="453.5" font-size="9.5" font-weight="500" fill="#0b0b0b">anpicasso vs a small</text><text x="16" y="465.5" font-size="9.5" font-weight="500" fill="#0b0b0b">chat model</text><path d="M206.1 453l5 5l-5 5l-5 -5z" fill="#2a78d6"><title>anpicasso, Hermes approvals vs a small chat model: 9.8x faster</title></path><text x="16" y="487.5" font-size="9.5" font-weight="500" fill="#0b0b0b">Jev Pong (me) vs</text><text x="16" y="499.5" font-size="9.5" font-weight="500" fill="#0b0b0b">GPT-5.4 Nano</text><line x1="178.9" y1="492" x2="206.7" y2="492" stroke-width="1.5" stroke="#e6e5df"/><circle cx="206.7" cy="492" r="4.5" fill="#2a78d6"><title>Jev Pong (me) vs GPT-5.4 Nano: 10x cheaper</title></circle><path d="M178.9 487l5 5l-5 5l-5 -5z" fill="#2a78d6"><title>Jev Pong (me) vs GPT-5.4 Nano: 3.6x faster</title></path><text x="16" y="521.5" font-size="9.5" font-weight="500" fill="#0b0b0b">Dan Willoughby vs Claude</text><text x="16" y="533.5" font-size="9.5" font-weight="500" fill="#0b0b0b">Haiku 4.5</text><line x1="208.8" y1="526" x2="239.4" y2="526" stroke-width="1.5" stroke="#e6e5df"/><circle cx="239.4" cy="526" r="4.5" fill="#2a78d6"><title>Dan Willoughby, Sniff Test vs Claude Haiku 4.5: 33x cheaper</title></circle><path d="M208.8 521l5 5l-5 5l-5 -5z" fill="#2a78d6"><title>Dan Willoughby, Sniff Test vs Claude Haiku 4.5: 11x faster</title></path><text x="16" y="555.5" font-size="9.5" font-weight="500" fill="#0b0b0b">Jev Pong (me) vs Claude</text><text x="16" y="567.5" font-size="9.5" font-weight="500" fill="#0b0b0b">Haiku 4.5</text><line x1="178.6" y1="560" x2="247" y2="560" stroke-width="1.5" stroke="#e6e5df"/><circle cx="247" cy="560" r="4.5" fill="#2a78d6"><title>Jev Pong (me) vs Claude Haiku 4.5: 44x cheaper</title></circle><path d="M178.6 555l5 5l-5 5l-5 -5z" fill="#2a78d6"><title>Jev Pong (me) vs Claude Haiku 4.5: 3.6x faster</title></path><text x="16" y="589.5" font-size="9.5" font-weight="500" fill="#0b0b0b">Jon Reed vs Gemini 3.5</text><text x="16" y="601.5" font-size="9.5" font-weight="500" fill="#0b0b0b">Flash-Lite</text><line x1="191.7" y1="594" x2="254.5" y2="594" stroke-width="1.5" stroke="#e6e5df"/><circle cx="254.5" cy="594" r="4.5" fill="#2a78d6"><title>Jon Reed, Near Here vs Gemini 3.5 Flash-Lite: 58x cheaper</title></circle><path d="M191.7 589l5 5l-5 5l-5 -5z" fill="#2a78d6"><title>Jon Reed, Near Here vs Gemini 3.5 Flash-Lite: 5.8x faster</title></path><text x="16" y="623.5" font-size="9.5" font-weight="500" fill="#0b0b0b">LangWatch vs Claude</text><text x="16" y="635.5" font-size="9.5" font-weight="500" fill="#0b0b0b">Opus 5</text><line x1="201.3" y1="628" x2="268.6" y2="628" stroke-width="1.5" stroke="#e6e5df"/><circle cx="268.6" cy="628" r="4.5" fill="#8a8981"><title>LangWatch vs Claude Opus 5: 97x cheaper</title></circle><path d="M201.3 623l5 5l-5 5l-5 -5z" fill="#8a8981"><title>LangWatch vs Claude Opus 5: 8.2x faster</title></path><text x="16" y="657.5" font-size="9.5" font-weight="500" fill="#0b0b0b">awlevin vs Claude Opus 5</text><line x1="215.2" y1="660" x2="282.1" y2="660" stroke-width="1.5" stroke="#e6e5df"/><circle cx="282.1" cy="660" r="4.5" fill="#8a8981"><title>awlevin, computer use vs Claude Opus 5: 160x cheaper</title></circle><path d="M215.2 655l5 5l-5 5l-5 -5z" fill="#8a8981"><title>awlevin, computer use vs Claude Opus 5: 14x faster</title></path><text x="16" y="687.5" font-size="9.5" font-weight="500" fill="#0b0b0b">Dan Willoughby vs Claude</text><text x="16" y="699.5" font-size="9.5" font-weight="500" fill="#0b0b0b">Opus 5</text><line x1="241.4" y1="692" x2="293" y2="692" stroke-width="1.5" stroke="#e6e5df"/><circle cx="293" cy="692" r="4.5" fill="#8a8981"><title>Dan Willoughby, Sniff Test vs Claude Opus 5: 239x cheaper</title></circle><path d="M241.4 687l5 5l-5 5l-5 -5z" fill="#8a8981"><title>Dan Willoughby, Sniff Test vs Claude Opus 5: 36x faster</title></path><text x="16" y="721.5" font-size="9.5" font-weight="500" fill="#0b0b0b">Dan Shipper vs Claude</text><text x="16" y="733.5" font-size="9.5" font-weight="500" fill="#0b0b0b">Fable 5.1</text><line x1="231.9" y1="726" x2="317.2" y2="726" stroke-width="1.5" stroke="#e6e5df"/><circle cx="317.2" cy="726" r="4.5" fill="#8a8981"><title>Dan Shipper, Every vs Claude Fable 5.1: 580x cheaper</title></circle><path d="M231.9 721l5 5l-5 5l-5 -5z" fill="#8a8981"><title>Dan Shipper, Every vs Claude Fable 5.1: 25x faster</title></path><text x="16" y="761.5" font-size="10.5" fill="#6f6e69">Small: the vendor's small or cheap tier. Each multiple is the</text><text x="16" y="775.5" font-size="10.5" fill="#6f6e69">comparison model's figure divided by Jev's, as the source</text><text x="16" y="789.5" font-size="10.5" fill="#6f6e69">published it; the table under the chart has the accuracy and the</text><text x="16" y="803.5" font-size="10.5" fill="#6f6e69">links.</text><line x1="16" y1="825.5" x2="344" y2="825.5" stroke-width="1" stroke="#e6e5df"/><text x="16" y="839.5" font-size="11" fill="#6f6e69">Source: the linked write-ups (Near Here, Lindfors, Sniff Test,</text><text x="16" y="854" font-size="11" fill="#6f6e69">OpenWork, CodeAlive, rerank bench, Classmethod, Hermes,</text><text x="16" y="868.5" font-size="11" fill="#6f6e69">LangWatch, Every, awlevin) and the Jev Pong runs;</text><text x="16" y="883" font-size="11" fill="#6f6e69">TypeSafe's launch post; the feed's claim chips; analysis by</text><text x="16" y="897.5" font-size="11" fill="#6f6e69">Matthew O'Riordan</text><text x="16" y="912.5" font-size="11" fill="#6f6e69">Disclosure: the author is CEO of Ably, a realtime</text><text x="16" y="927" font-size="11" fill="#6f6e69">infrastructure company.</text></svg>
